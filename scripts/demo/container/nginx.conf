# An ordinary web server on 8080, running as the unprivileged demo user, so the spatial
# recordings can discover it by port and only then learn its name.
daemon on;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events { worker_connections 64; }

http {
  access_log /tmp/nginx-access.log;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name _;
    location / { return 200 "ono-sendai demo\n"; }
  }
}
