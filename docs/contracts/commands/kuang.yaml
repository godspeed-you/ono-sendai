# Command family: KUANG/11 Extensions. Source: spec §9.1 "KUANG/11 Extensions", complete and in
# the order the specification gives, with the state model of §31.8 (install, enable, load and run
# are different states), the capability model of §31.16–§31.19 and the assistant surface of
# §31.41–§31.51. Delivered by spec §37 Phase I.
#
# KUANG/11 is the extension runtime, never a name for the shell (AGENTS.md §3). The contracts
# these commands operate on live in `docs/contracts/kuang/`, which arrives with Phase I (spec §31.78).
# Conventions as documented at the head of process.yaml.

version: 1
family: kuang

commands:
  - id: ono.plugin.get
    verb: get
    target: plugin
    summary: Enumerate installed and loaded KUANG/11 packages and their runtime health.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.plugin/1>
    provider_capability: plugin.list
    selectors:
      - {name: id, type: string, doc: "Resolve one package by its publisher-namespaced id (spec §31.5), or by its short name when exactly one installed package carries it (K11P §10.4)."}
    options:
      - {name: state, type: string, doc: "Restrict to one of the six states of spec §31.8: installed, enabled, loaded, active, degraded, quarantined (ADR-0022: §31.8 defines `active`, never `running`)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - get plugin
      - get plugin | where state == loaded

  - id: ono.plugin.find
    verb: find
    target: plugin
    summary: Search the configured extension sources without executing any package.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.plugin-package/1>
    provider_capability: plugin.search
    selectors:
      - {name: query, type: string, doc: "The search term."}
    options:
      - {name: source, type: string, doc: "Search one configured source (spec §31.9)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - find plugin postgres

  - id: ono.plugin.inspect
    verb: inspect
    target: plugin
    summary: Show a package's manifest, origin, contributions, permissions, capabilities, resource use and errors.
    stability: stable
    argument_mode: words
    input: "null | ono.plugin/1"
    output: ono.plugin-inspection/1
    provider_capability: plugin.inspect
    selectors:
      - {name: id, type: string, doc: "The package to inspect: its canonical id, or its short name when that is unique among installed packages (K11P §10.4)."}
    options: []
    privilege: none
    streaming: false
    phase: I
    examples:
      - inspect plugin kubernetes
      - inspect plugin dev.example.packet-eye

  # K11P §12: one command, one transaction — resolve, verify, plan, consent, place, enable,
  # register, report ready. The internal lifecycle of §31.8 is orchestrated, never collapsed
  # (ADR-0602). The reference is a short name in the ordinary case (ADR-0601).
  - id: ono.plugin.install
    verb: install
    target: plugin
    summary: Resolve, verify and install a package with its recommended access, so it is ready to use.
    stability: stable
    argument_mode: words
    input: "null"
    output: ono.action-result/1
    provider_capability: plugin.install
    selectors:
      - {name: reference, type: string, doc: "A short name (`kubernetes`), a canonical id, `<catalog>/<name>`, an explicit path (`./dir`, `/dir`, `path:<dir>`) — the forms of `docs/contracts/kuang/catalog.v1.yaml` (K11P §4.1)."}
    options:
      - {name: source, type: string, doc: "Install from one configured source."}
      - {name: access, type: string, doc: "The access profile to install with: `recommended` (the default), `minimal`, or a profile the package offers such as `operate`. A profile that adds mutation is named here deliberately (K11P §9, §20.2)."}
      - {name: confirm, type: bool, doc: "Accept the install plan non-interactively (spec §17.4). Confirms the selected profile's safe defaults and never an explicit or destructive permission (K11P §20.2, ADR-0602 §4)."}
    privilege: none
    streaming: false
    phase: I
    examples:
      - install plugin kubernetes
      - install plugin kubernetes --access recommended --confirm
      - install plugin path:/srv/packages/dev.example.packet-eye --confirm

  - id: ono.plugin.remove
    verb: remove
    target: plugin
    summary: Remove a package with its permissions; state and policy retention is explicit.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.plugin/1>"
    output: stream<ono.action-result/1>
    provider_capability: plugin.remove
    selectors:
      - {name: id, type: string, doc: "The package to remove: its canonical id, or its short name when that is unique among installed packages."}
    options:
      - {name: keep-state, type: bool, doc: "Retain the package's persisted state (spec §31.31, §31.81)."}
      - {name: keep-grants, type: bool, doc: "Retain the capability grants made to it and the permission decisions that minted them, for fleet provisioning (K11P §22.2). Never the default: a reinstall asks again (K11P §22.3)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - remove plugin kubernetes
      - remove plugin dev.example.packet-eye

  - id: ono.plugin.load
    verb: load
    target: plugin
    summary: Negotiate capabilities and instantiate a package's runtime — explicitly; an installed package's contributions load it on first use.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.plugin/1>"
    output: ono.plugin-runtime/1
    provider_capability: plugin.load
    selectors:
      - {name: id, type: string, doc: "The package to load: its canonical id, or its short name when that is unique among installed packages."}
    options: []
    privilege: none
    streaming: false
    phase: I
    examples:
      - load plugin dev.example.packet-eye

  - id: ono.plugin.unload
    verb: unload
    target: plugin
    summary: Drain or cancel a package's jobs and withdraw its runtime contributions.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.plugin/1>"
    output: stream<ono.action-result/1>
    provider_capability: plugin.unload
    selectors:
      - {name: id, type: string, doc: "The package to unload."}
    options:
      - {name: timeout, type: duration, doc: "How long to let jobs drain before cancelling them."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - unload plugin dev.example.packet-eye

  # Not in §9.1's table; spec §31.3 writes `set plugin pg-surgeon --enabled false` and §31.38
  # writes `set plugin packet-eye --background true`. The enable/disable transitions of
  # `docs/contracts/kuang/lifecycle.v1.yaml` name this command (ADR-0022, Consequences item 3).
  - id: ono.plugin.set
    verb: set
    target: plugin
    summary: Change a package's management settings — enablement and background policy.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.plugin/1>"
    output: stream<ono.action-result/1>
    provider_capability: plugin.set
    selectors:
      - {name: id, type: string, doc: "The package to configure."}
    options:
      - {name: enabled, type: bool, doc: "Make the package eligible for loading, or withdraw that eligibility (spec §31.3). Neither direction runs package code; disabling unloads a loaded instance first (lifecycle.v1.yaml, transitions `enable`/`disable`)."}
      - {name: background, type: bool, doc: "Let a package that declares a background role run jobs no command, view or subscription created (spec §31.38). Job lifetime stays scoped to Ono; KUANG/11 never silently creates system services."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - set plugin dev.example.packet-eye --enabled false
      - set plugin dev.example.packet-eye --background true

  - id: ono.plugin.verify
    verb: verify
    target: plugin
    summary: Validate a package's integrity, signature and compatibility.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.plugin/1>"
    output: ono.verification-result/1
    provider_capability: plugin.verify
    selectors:
      - {name: id, type: string, doc: "The installed package or the package reference to verify."}
    options: []
    privilege: none
    streaming: false
    phase: I
    examples:
      - verify plugin dev.example.packet-eye

  # The human layer over the capability table (K11P §16, ADR-0604): a permission is what a
  # user grants, and every record carries the capabilities, scopes and policy source under it.
  - id: ono.permission.get
    verb: get
    target: permission
    summary: Show what a package is permitted to do, in human terms, with the capabilities underneath.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.permission/1>
    provider_capability: permission.list
    selectors:
      - {name: plugin, type: string, doc: "The package, by short name or canonical id. Absent means every installed package."}
    options:
      - {name: all, type: bool, doc: "Include the support permissions the compact view hides and the legacy rows for grants no permission maps (K11P §16.1, §28.3)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - get permission kubernetes
      - get permission kubernetes --all
      - get permission

  - id: ono.permission.set
    verb: set
    target: permission
    summary: Apply an access profile, or decide one permission of a package.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.permission/1>
    provider_capability: permission.set
    selectors:
      - {name: plugin, type: string, doc: "The package, by short name or canonical id."}
      - {name: permission, type: string, doc: "The permission to decide. Absent with `--profile`."}
    options:
      - {name: profile, type: string, doc: "Apply this access profile: every permission it names is allowed. A profile that adds mutation shows its summary and asks (K11P §15.2); non-interactively it needs `--confirm`."}
      - {name: decision, type: string, doc: "`allow`, `deny` or `ask` for the named permission (K11P §16.2)."}
      - {name: duration, type: string, doc: "`session` or `always` (the default) for an `allow`. Precision that ordinary guided flows do not need."}
      - {name: scope, type: string, doc: "`key=value[,value]`, repeatable: the scope an `allow` carries, for a just-in-time permission decided ahead of its use, e.g. `programs=/usr/bin/aws`. The keys are the capability's own (spec §31.16)."}
      - {name: confirm, type: bool, doc: "Accept a mutating profile or permission non-interactively. Never a destructive one (K11P §7.5)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - set permission kubernetes --profile operate
      - set permission kubernetes cluster-mutation --decision allow
      - set permission kubernetes credential-helper --decision allow --scope programs=/usr/bin/aws

  - id: ono.capability.get
    verb: get
    target: capability
    summary: Show capability definitions, requests, grants and leases.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.capability-grant/1>
    provider_capability: capability.list
    selectors:
      - {name: id, type: string, doc: "Resolve one capability by id."}
    options:
      - {name: plugin, type: string, doc: "Restrict to the capabilities of one package."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - get capability
      - get capability --plugin dev.example.packet-eye

  # The exact administrative and automation surface (K11P §16.3, §20.4): `get permission` and
  # `set permission` are the ordinary path; these keep their precision.
  - id: ono.capability.grant
    verb: grant
    target: capability
    summary: Create a scoped capability grant or lease, subject to policy — the exact administrative form of a permission decision.
    stability: stable
    argument_mode: words
    input: "null"
    output: ono.capability-grant/1
    provider_capability: capability.grant
    selectors:
      - {name: capability, type: string, doc: "The capability to grant, from `kuang_capabilities` in docs/contracts/capabilities.yaml."}
    options:
      - {name: plugin, type: string, doc: "The package the grant is made to."}
      - {name: scope, type: record, doc: "The scope keys the capability supports (spec §31.16). A scope that cannot be enforced is never offered."}
      - {name: duration, type: duration, doc: "Make it a lease that expires. Grant prompts must state effect, scope and duration (spec §31.18)."}
    privilege: none
    streaming: false
    phase: I
    examples:
      - grant capability filesystem.read --plugin dev.example.packet-eye --duration 1h

  - id: ono.capability.revoke
    verb: revoke
    target: capability
    summary: Revoke a capability grant or lease.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.capability-grant/1>"
    output: stream<ono.action-result/1>
    provider_capability: capability.revoke
    selectors:
      - {name: selector, type: string, doc: "The grant to revoke."}
    options:
      - {name: plugin, type: string, doc: "Revoke only this plugin's grant of the capability."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - revoke capability filesystem.read --plugin dev.example.packet-eye

  - id: ono.assistant.get
    verb: get
    target: assistant
    summary: Enumerate loaded assistant extensions.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.assistant/1>
    provider_capability: assistant.list
    selectors:
      - {name: id, type: string, doc: "Resolve one assistant by id."}
    options: []
    privilege: none
    streaming: true
    phase: I
    examples:
      - get assistant

  - id: ono.assistant.ask
    verb: ask
    target: assistant
    summary: Run one assistant turn under an explicit context and model policy.
    stability: stable
    argument_mode: words
    input: "null | any"
    output: ono.assistant-turn/1
    provider_capability: assistant.ask
    selectors:
      - {name: id, type: string, doc: "The assistant to ask. Never implicit: spec §7.1 requires the assistant to be explicitly selected."}
      - {name: request, type: string, doc: "The request text."}
    options:
      - {name: autonomy, type: string, doc: "The autonomy level for this turn (spec §31.48)."}
      - {name: model, type: string, doc: "Force one model provider rather than letting the broker choose (spec §31.43)."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - ask assistant ops-assist "why did image-worker fail?"

  - id: ono.model.get
    verb: get
    target: model
    summary: Enumerate configured model providers and their policy characteristics.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.model-provider/1>
    provider_capability: model.list
    selectors:
      - {name: id, type: string, doc: "Resolve one model provider by id."}
    options: []
    privilege: none
    streaming: true
    phase: I
    examples:
      - get model

  - id: ono.finding.get
    verb: get
    target: finding
    summary: Query the findings emitted by analyses and assistants.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.finding/1>
    provider_capability: finding.list
    selectors: []
    options:
      - {name: plugin, type: string, doc: "Restrict to one package's findings."}
      - {name: severity, type: string, doc: "Minimum severity."}
      - {name: since, type: timestamp, doc: "Only findings at or after this time."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - get finding | where severity >= warning

  - id: ono.audit.get
    verb: get
    target: audit
    summary: Query the record of capability-sensitive KUANG/11 actions.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.plugin-audit-event/1>
    provider_capability: audit.list
    selectors: []
    options:
      - {name: plugin, type: string, doc: "Restrict to one package."}
      - {name: capability, type: string, doc: "Restrict to actions taken under one capability."}
      - {name: since, type: timestamp, doc: "Only events at or after this time."}
    privilege: none
    streaming: true
    phase: I
    examples:
      - get audit --plugin dev.example.packet-eye
