# Command family: Package. Source: spec §9.1 Package, complete. Delivered by the
# `linux.packages` provider, which speaks dpkg's and apt's machine formats and never parses
# their human listings (spec §31.58, ADR-0115). Conventions as documented at the head of
# process.yaml.

version: 1
family: package

commands:
  - id: ono.package.get
    verb: get
    target: package
    summary: Enumerate installed and known packages through the active provider.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.package/1>
    provider_capability: package.list
    selectors:
      - {name: name, type: string, doc: "Resolve one package by name."}
    options:
      - {name: installed, type: bool, doc: "Restrict to packages that are or are not installed."}
      - {name: provider, type: string, doc: "Query one named package provider."}
    privilege: none
    streaming: true
    phase: C
    examples:
      - get package
      - get package nginx

  - id: ono.package.find
    verb: find
    target: package
    summary: Search the provider's repositories.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.package/1>
    provider_capability: package.search
    selectors:
      - {name: query, type: string, doc: "The search term."}
    options:
      - {name: provider, type: string, doc: "Search one named package provider."}
    privilege: none
    streaming: true
    phase: C
    examples:
      - find package postgres

  - id: ono.package.add
    verb: add
    target: package
    summary: Install a package.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.package/1>"
    output: stream<ono.action-result/1>
    provider_capability: package.manage
    selectors:
      - {name: name, type: string, doc: "The package to install."}
    options:
      - {name: version, type: string, doc: "Install this version rather than the newest available."}
    privilege: elevated
    streaming: true
    phase: C
    examples:
      - add package nginx

  - id: ono.package.remove
    verb: remove
    target: package
    summary: Remove a package.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.package/1>"
    output: stream<ono.action-result/1>
    provider_capability: package.manage
    selectors:
      - {name: name, type: string, doc: "The package to remove."}
    options:
      - {name: purge, type: bool, doc: "Remove configuration as well as the package. Destructive, so never the default."}
    privilege: elevated
    streaming: true
    phase: C
    examples:
      - remove package nginx

  - id: ono.package.set
    verb: set
    target: package
    summary: Request a version transition where the provider supports it.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.package/1>"
    output: stream<ono.action-result/1>
    provider_capability: package.manage
    selectors:
      - {name: name, type: string, doc: "The package to transition."}
    options:
      - {name: version, type: string, doc: "The version to move to."}
      - {name: hold, type: bool, doc: "Pin the package at its current version."}
    privilege: elevated
    streaming: true
    phase: C
    examples:
      - set package nginx --version 1.24.0

  # The repository as an object, and the refresh that acts on it (ADR-0562, ADR-0565). Spec §9.1
  # names no verb for the index; a mutation acts on the object it names (§11.5), and the object
  # of a refresh is the repository, not a package.
  - id: ono.package-source.get
    verb: get
    target: package-source
    summary: Enumerate the repositories the package manager reads its index from.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.package-source/1>
    provider_capability: package-source.list
    selectors:
      - {name: id, type: string, doc: "Resolve one repository by its id."}
    options: []
    privilege: none
    streaming: true
    phase: C
    examples:
      - get package-source

  - id: ono.package-source.refresh
    verb: refresh
    target: package-source
    summary: Bring the local package index up to date from a repository.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.package-source/1>"
    output: stream<ono.action-result/1>
    provider_capability: package-source.refresh
    selectors:
      - {name: id, type: string, doc: "The repository to refresh."}
    options:
      - {name: dry-run, type: bool, doc: "Report what would be run without running it. The provider answers `skipped` with the command it would have run (ADR-0088)."}
    privilege: elevated
    streaming: true
    phase: C
    examples:
      - refresh package-source updates
