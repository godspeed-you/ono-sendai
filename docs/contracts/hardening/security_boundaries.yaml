# The security boundary map of v0.4.1 §6, as data: where untrusted input enters the product,
# what has to be true before it goes further, which crate is responsible for making it true, and
# the negative test that proves the forbidden thing is refused.
#
# Source: v0.4.1 §6.1 (the required boundary inventory — "The repository MUST contain a
# machine-readable or generated boundary inventory"), §6.2 (boundary ownership — "Each boundary
# MUST have one owning crate/module responsible for enforcing the primary guarantee"), §10.2
# (defense in depth at dispatch), §20 (the security acceptance principle), §52.1
# (`security_boundaries` is one of the registries) and §54.1 (a refusal names the boundary that
# decided). Decisions: ADR-0546.
#
# **§6.1's own words are the contract, not a paraphrase of them.** `input_trust` and
# `required_enforcement` are the specification's two columns, copied character for character, and
# `xtask/tests/contracts.rs::should_name_an_owning_crate_and_a_security_test_for_every_declared_boundary`
# holds the file to a table typed out from the specification rather than read from here. So this
# registry cannot reword what it is a machine-readable form of; anything this repository wants to
# say about a boundary goes in `doc`.
#
# **This file is the join key the other registries were already writing against.**
# `refusals.yaml` names the boundary that decided each hardening refusal and `remote_trust.yaml`
# the boundary each of §51.3's six concepts belongs to. Both were written before this inventory
# existed and both said so in their headers; `cargo xtask spec-check` now resolves those names
# here, so a boundary that is renamed is renamed everywhere or the gate is red.
#
# Fields
#
#   id                    the §6.1 boundary id.
#   input_trust           §6.1's second column, verbatim: what the boundary is handed.
#   required_enforcement  §6.1's third column, verbatim: what must hold before it goes on.
#   owner                 the one crate responsible for the primary guarantee (§6.2). `xtask`
#                         names the repository's own automation, which is where the two release
#                         boundaries are enforced — §43.2 asks for exactly that.
#   module                the file inside the owner where the guarantee is applied. It must live
#                         under the owner, so §6.2's "higher layers MAY add policy but MUST NOT
#                         be the only place a lower-level safety property is enforced" has a
#                         written-down answer to "then where is it enforced".
#   negative_tests        the automated tests §20 accepts the control on: "A security control is
#                         accepted only when there is an automated negative test proving the
#                         forbidden behavior is refused." Each is a `path::name` the gate
#                         resolves, and an `#[ignore]`d one is a failure — a proof that does not
#                         run proves nothing (§65.10).
#   dispatch_paths        for the two provider boundaries only: every path §10.2 governs, with
#                         the guard each one must call. `method` is a method of the served
#                         `RemoteService` trait, `path` the file the handler lives in, `entry`
#                         the line the handler opens with, and `guard` the authorization call
#                         that must appear inside it. The check runs in both directions, so a
#                         new method on the trait is a gate failure until it is declared here.
#   doc                   what this repository knows about the boundary that §6.1 does not say.
#   spec                  the sections that fix the rule.

version: 1

boundaries:
  # --- the direct TCP link, §7, §8, §13 --------------------------------------------------------
  - id: remote.tcp.transport
    input_trust: network
    required_enforcement: TLS 1.3 + mutual peer proof
    owner: ono-remote
    module: crates/ono-remote/src/listener.rs
    spec: "v0.4.1 §6.1, §6.2, §7.1, §7.4, §13.1, §13.4"
    negative_tests:
      - crates/ono-remote/tests/client_authentication.rs::should_refuse_a_tls_client_that_presents_no_certificate
      - crates/ono-remote/tests/client_authentication.rs::should_refuse_a_tls_client_that_cannot_prove_it_holds_the_key_it_presents
      - crates/ono-remote/tests/client_authentication.rs::should_refuse_a_tls_client_that_asks_for_another_application_protocol
      - crates/ono-remote/tests/trust.rs::should_refuse_a_changed_host_key_with_the_stable_safety_code
    doc: >-
      §6.2's own example: "TLS peer proof belongs in `ono-remote`, not in CLI rendering." The
      listener requires a client certificate and verifies possession of the key before a single
      Ono byte is read (§13.1), so an unauthenticated peer never reaches the protocol at all.
      The client half of the same boundary — the pinned host key — is enforced in
      `crates/ono-remote/src/tls.rs` and refuses a changed key rather than asking about it (§2.9).

  - id: remote.tcp.authorization
    input_trust: authenticated peer
    required_enforcement: explicit server policy
    owner: ono-protocol
    module: crates/ono-protocol/src/authorization.rs
    spec: "v0.4.1 §6.1, §6.2, §9.1, §9.4, §10.3, §59.5"
    negative_tests:
      - crates/ono-protocol/tests/authorization.rs::should_refuse_an_unlisted_client_before_provider_negotiation
      - crates/ono-protocol/tests/authorization.rs::should_disclose_no_process_schema_or_capability_inventory_to_an_unlisted_client
      - crates/ono-protocol/tests/authorization.rs::should_refuse_a_client_the_transport_authenticated_as_nobody
      - crates/ono-cli/tests/authorized_clients.rs::should_never_treat_a_malformed_store_as_an_empty_one
    doc: >-
      §9.1: authentication proves possession of a key and does not prove the operator wants that
      key to see the system. The `AuthorizationContext` is built from the authenticated
      fingerprint at accept and is immutable for the life of the connection (§10.3), so nothing
      the peer says about itself reaches the decision (§65.2). A store that will not parse fails
      closed rather than reading as an empty policy (§59.5).

  - id: remote.ssh.transport
    input_trust: ssh channel
    required_enforcement: external SSH authentication
    owner: ono-remote
    module: crates/ono-remote/src/transport.rs
    spec: "v0.4.1 §6.1, §6.2, §4.3, §51.3"
    negative_tests:
      - crates/ono-remote/tests/trust.rs::should_refuse_an_unauthenticated_transport_when_trust_is_required
      - crates/ono-cli/tests/authenticated_link.rs::should_report_no_proved_key_over_a_transport_that_proves_nothing
      - crates/ono-remote/tests/agentless.rs::should_refuse_to_open_an_agentless_link_to_a_far_side_that_does_not_answer
    doc: >-
      The one boundary Ono does not enforce itself, which is why it is in the inventory: the SSH
      carrier decided who may run the command, and the shell's obligation is to say so rather
      than to imply a proof it does not have. `get link` reports no proved key over a transport
      that proves nothing (§51.3), and a policy-governed grant is not consulted here because
      there is no fingerprint to key one on.

  - id: protocol.frame
    input_trust: peer bytes
    required_enforcement: size/depth/version limits
    owner: ono-protocol
    module: crates/ono-protocol/src/frame.rs
    spec: "v0.4.1 §6.1, §6.2, §13.2, §56.2"
    negative_tests:
      - crates/ono-protocol/tests/framing.rs::should_refuse_a_frame_claiming_more_than_the_limit_before_allocating
      - crates/ono-protocol/tests/framing.rs::should_refuse_a_frame_whose_version_is_not_the_one_we_speak
      - crates/ono-protocol/tests/framing.rs::should_refuse_a_frame_whose_kind_is_not_in_the_protocol
      - crates/ono-protocol/tests/framing.rs::should_refuse_a_frame_whose_reserved_bits_are_set
    doc: >-
      §6.2's second example: "wire size limits belong in `ono-protocol`, not in command
      handlers." A declared length larger than the ceiling is refused *before* the allocation it
      declares, which is the difference between a refusal and the memory exhaustion it would
      otherwise cause. The ceilings themselves are `limits.remote_*` in
      `docs/contracts/hardening/limits.yaml`, so no number is typed here (§52.2).

  # --- the provider surface, §10 ---------------------------------------------------------------
  - id: provider.query
    input_trust: authorized request
    required_enforcement: provider capability contract
    owner: ono-protocol
    module: crates/ono-protocol/src/service.rs
    spec: "v0.4.1 §6.1, §6.2, §10.1, §10.2, §20, §65.3"
    negative_tests:
      - crates/ono-protocol/tests/authorization.rs::should_refuse_a_request_for_a_capability_the_offer_omitted
      - crates/ono-protocol/tests/authorization.rs::should_refuse_it_on_every_dispatch_path_the_server_exposes
      - crates/ono-protocol/tests/authorization.rs::should_offer_only_the_capabilities_the_clients_policy_allows
      - crates/ono-protocol/tests/authorization.rs::should_leave_an_ungranted_action_capability_out_of_the_offer_the_provider_advertises
    dispatch_paths:
      - method: query
        path: crates/ono-protocol/src/service.rs
        entry: "Message::StartQuery"
        guard: require_observe
      - method: subscribe
        path: crates/ono-protocol/src/service.rs
        entry: "Message::StartSubscribe"
        guard: require_observe
      - method: query
        path: crates/ono-remote/src/agent.rs
        entry: "async fn query"
        guard: require_observe
      - method: subscribe
        path: crates/ono-remote/src/agent.rs
        entry: "async fn subscribe"
        guard: require_observe
    doc: >-
      §10.1 filters the offer and §10.2 says that is not the enforcement: "negotiation filtering
      is not sufficient by itself." Both dispatch sites ask the same immutable context — the
      protocol loop before it hands the request on, and the service before it touches the
      registry — so a request that reaches a provider unchecked needs two independent pieces of
      code to be wrong at once (ADR-0472).

  - id: provider.act
    input_trust: authorized request
    required_enforcement: capability + risk/elevation checks
    owner: ono-protocol
    module: crates/ono-protocol/src/service.rs
    spec: "v0.4.1 §6.1, §6.2, §9.5, §9.6, §10.2, Appendix C"
    negative_tests:
      - crates/ono-protocol/tests/authorization.rs::should_deny_an_action_whose_capability_id_is_unknown
      - crates/ono-protocol/tests/authorization.rs::should_deny_a_capability_introduced_after_the_grant_was_written
      - crates/ono-protocol/tests/authorization.rs::should_leave_every_ungranted_action_refused_when_one_action_is_granted
      - crates/ono-cli/tests/authorized_clients.rs::should_refuse_a_wildcard_or_risk_class_in_an_action_grant
    dispatch_paths:
      - method: act
        path: crates/ono-protocol/src/service.rs
        entry: "Message::Act"
        guard: require_action
      - method: adapt
        path: crates/ono-protocol/src/service.rs
        entry: "Message::StartAdapt"
        guard: require_action
      - method: act
        path: crates/ono-remote/src/agent.rs
        entry: "async fn act"
        guard: require_action
      - method: adapt
        path: crates/ono-remote/src/agent.rs
        entry: "async fn adapt"
        guard: require_action
    doc: >-
      The capability an action needs is resolved by the serving side from this agent's own
      command contracts, never read from the request, because a peer that names the capability it
      needs is authorizing itself (§65.2). An id this side cannot name is denied, which is
      Appendix C's rule and also covers a capability a later version introduces. `adapt` runs a
      program of the caller's choosing and no entry in `docs/contracts/capabilities.yaml` names it, so
      no grant can name it and every policy-governed connection is refused it.

  # --- KUANG/11, §15–§18 -----------------------------------------------------------------------
  - id: kuang.native.spawn
    input_trust: package process
    required_enforcement: manifest + fail-closed confinement
    owner: ono-kuang-supervisor
    module: crates/ono-kuang-supervisor/src/sandbox.rs
    spec: "v0.4.1 §6.1, §6.2, §16.1, §16.2, §16.3, §18.1, Appendix D"
    negative_tests:
      - crates/ono-kuang-supervisor/tests/confinement.rs::should_never_exec_the_plugin_when_a_mandatory_control_cannot_be_installed
      - crates/ono-kuang-supervisor/tests/confinement.rs::should_leave_the_plugins_startup_marker_absent_after_a_failed_confinement_setup
      - crates/ono-kuang-supervisor/tests/confinement.rs::should_never_hand_back_a_plugin_whose_report_is_not_confined
      - crates/ono-kuang-supervisor/tests/confinement.rs::should_check_the_result_of_every_control_the_table_marks_mandatory
    doc: >-
      §6.2's third example: "native process setup errors belong in
      `ono-kuang-supervisor`/process code, not in a later audit view." Every mandatory control is
      installed between fork and exec and its return value is checked (§16.2), so a control that
      could not be installed stops the exec rather than being noticed afterwards. Which controls
      are mandatory is `docs/contracts/hardening/kuang_confinement_controls.yaml`, once (§52.2).

  - id: kuang.protocol
    input_trust: plugin bytes
    required_enforcement: frame/credit/schema limits
    owner: ono-kuang-protocol
    module: crates/ono-kuang-protocol/src/frame.rs
    spec: "v0.4.1 §6.1, §6.2, §18.2, §18.3"
    negative_tests:
      - crates/ono-kuang-protocol/src/frame.rs::should_refuse_an_oversized_declaration_before_allocating_when_reading
      - crates/ono-kuang-protocol/src/frame.rs::should_refuse_garbage_bytes_as_malformed_when_decoding
      - crates/ono-kuang-protocol/tests/manifest_validation.rs::should_refuse_a_nested_document_before_it_costs_anything_to_refuse_it
      - crates/ono-kuang-protocol/tests/manifest_validation.rs::should_refuse_an_unknown_capability_id_rather_than_ignore_it
    doc: >-
      A loaded plugin is a separate process speaking a framed protocol, and its bytes are as
      untrusted as a network peer's: the host is what a hostile package attacks. The manifest is
      parsed fail-closed — an unknown key in a closed section is a refusal rather than an
      ignored field — and a nested document is refused before the nesting costs anything.

  # --- the adapter surface, v0.3 §1.54 ---------------------------------------------------------
  - id: external.adapter
    input_trust: process output
    required_enforcement: adapter decoder and schema validation
    owner: ono-adapter
    module: crates/ono-adapter/src/decode.rs
    spec: "v0.4.1 §6.1, §6.2, §50; v0.3 §1.54"
    negative_tests:
      - crates/ono-adapter/tests/decode.rs::should_report_a_schema_violation_when_a_field_has_the_wrong_type
      - crates/ono-adapter/tests/decode.rs::should_fail_structurally_on_truncated_output_and_keep_the_bytes
      - crates/ono-adapter/tests/decode.rs::should_never_panic_on_hostile_bytes
    doc: >-
      The output of a program the shell did not write, decoded into objects the shell promises a
      schema for. Truncated output fails structurally and keeps the bytes rather than yielding a
      half-record that looks like data, and a field of the wrong type is a schema violation
      rather than a coerced value — spec §35.3's "unknown is null, never fabricated" applied to
      the one input the product cannot constrain.

  # --- the pipeline, §21–§24 -------------------------------------------------------------------
  - id: pipeline.materialization
    input_trust: value stream
    required_enforcement: count + byte budget
    owner: ono-value
    module: crates/ono-value/src/budget.rs
    spec: "v0.4.1 §6.1, §6.2, §21.1, §21.3, §22.2, §65.6"
    negative_tests:
      - crates/ono-pipeline/tests/budget.rs::should_refuse_rather_than_truncate_when_a_budget_is_exceeded
      - crates/ono-pipeline/tests/budget.rs::should_offer_no_default_that_leaves_a_budget_unlimited
      - crates/ono-pipeline/tests/budget.rs::should_require_both_an_item_and_a_byte_ceiling_when_a_budget_is_constructed
      - crates/ono-pipeline/tests/budget.rs::should_charge_a_nested_budget_against_the_budget_it_was_taken_from
    doc: >-
      §6.2's fourth example: "byte-budget enforcement belongs in the materialization primitive,
      not in each caller independently." One `Budget` type carries both ceilings, has no
      constructor that leaves either unset (§65.6 names a count-only limit as a failure mode),
      and refuses rather than truncating — a silently shortened answer is §2.6's unknown
      pretending to be a result.

  # --- the release, §43–§49 --------------------------------------------------------------------
  - id: release.build
    input_trust: CI inputs
    required_enforcement: immutable refs + locked dependencies
    owner: xtask
    module: xtask/src/supply_chain.rs
    spec: "v0.4.1 §6.1, §6.2, §43.1, §43.2, §44.1, §44.4, §65.11"
    negative_tests:
      - xtask/tests/supply_chain.rs::should_reject_an_action_referenced_by_a_floating_tag
      - xtask/tests/supply_chain.rs::should_reject_a_build_image_pulled_by_tag_alone
      - xtask/tests/supply_chain.rs::should_reject_a_workflow_that_grants_write_access_to_every_job
      - xtask/tests/supply_chain.rs::should_reject_a_publishing_job_a_pull_request_can_reach
    doc: >-
      The inputs a release trusts are a boundary in the same sense a socket is: everything that
      runs during a build can write to the artifact. §43.2 asks that critical logic live in
      first-party code rather than in a third-party action, so the owner is this repository's own
      `xtask` and the scanners run on every gate, not only on a tag. §65.11 names a mutable
      release input as a failure mode outright.

  - id: release.publish
    input_trust: artifacts
    required_enforcement: checksum + signature + provenance
    owner: xtask
    module: xtask/src/provenance.rs
    spec: "v0.4.1 §6.1, §6.2, §47.2, §47.3, §47.4, §49.1, §62.5"
    negative_tests:
      - xtask/tests/provenance.rs::should_fail_verification_when_the_checksum_manifest_is_altered
      - xtask/tests/provenance.rs::should_fail_the_release_check_when_an_artifact_is_absent_from_the_manifest
      - xtask/tests/provenance.rs::should_verify_every_artifact_digest_against_the_checksum_manifest_and_the_provenance_before_publication
      - xtask/tests/provenance.rs::should_bind_all_seven_required_fields_to_every_artifact_digest
    doc: >-
      §49.1's "build once, promote after proof": the bytes that were tested are the bytes that
      ship, and what makes that checkable from outside is the checksum manifest, the signature
      over it and the provenance binding each digest to the inputs of Appendix H. A real
      signature needs an OIDC token that exists only inside a release run, so the end-to-end
      proof is owed by the first `v*` tag and `docs/ACCEPTANCE.md` §4.8.11 says so in the box.
