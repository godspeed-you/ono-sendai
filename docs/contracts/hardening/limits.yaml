# The runtime resource limits of Ono-Sendai, as data.
#
# Source: v0.4.1 Appendix A (Default Hardening Limits — the normative defaults), §55.1 (the
# canonical `limits.*` configuration keys), §55.2 (numeric limits are range-checked at load time
# and a security-sensitive limit never silently becomes unlimited), §55.4 (environment overrides
# follow the existing configuration architecture), §52.1 (`materialization_limits` is one of the
# seven machine-readable hardening registries) and §52.2, the sentence this file exists to obey:
#
#   "A number such as `max_connections = 32` MUST not be independently typed into five files if
#    one contract can generate the others."
#
# So every hardening limit in the product has exactly one written-down home, and it is here.
# Decisions: ADR-0456.
#
# Authority: `ono_cli::settings::CATALOGUE` declares the same keys with the same types, defaults
# and ranges, and `crates/ono-cli/tests/resource_limits.rs` compares the two in both directions —
# a key the shell declares and this file omits is a failure, and so is a key this file declares
# and the shell has never heard of. `inspect limits` reads the shell's catalogue, so a user and a
# test read the figures the shell actually enforces rather than a second copy of them (§54.3).
#
# Fields
#
#   key         the dotted configuration key, as §55.1 spells it.
#   type        `int` for a count or a duration in milliseconds, `bytesize` for a byte ceiling.
#               Appendix A: "Limits MUST be expressed internally in integer base units and
#               rendered in human-readable units separately", so a `bytesize` is stored in bytes.
#   default     Appendix A's value, in base units.
#   min, max    the permitted range, inclusive. §55.2 requires the check; the range is this
#               registry's decision and ADR-0456 defends each bound.
#   unit        what the number counts, for rendering.
#   enforced_by which component reads the effective value. `pending` means the key is declared,
#               validated and readable, and the component that will read it has not landed yet —
#               stated rather than implied, so no reader infers an effect from a key's existence.
#   spec        the section that fixes the default.
#
# Zero is not unlimited. §22.2: "A value of zero means 'no values permitted', not unlimited."
# Where zero would turn a security boundary off rather than closed, the minimum is one instead,
# and the row says so.

version: 1

limits:
  # --- materialization, §22.2 -----------------------------------------------------------------
  - key: limits.materialize_items
    type: int
    default: 100000
    min: 0
    max: 1000000000
    unit: values
    enforced_by: ono-pipeline
    spec: "v0.4.1 §22.2, Appendix A"
    doc: >-
      How many values one global operation — `sort`, `group`, `measure`, an explicit collect —
      may hold at once. Zero permits none.
  - key: limits.materialize_bytes
    type: bytesize
    default: 134217728
    min: 0
    max: 1099511627776
    unit: bytes
    enforced_by: ono-pipeline
    spec: "v0.4.1 §22.2, Appendix A"
    doc: >-
      How many bytes one global operation may hold at once, counted with the deterministic
      approximate estimator of §21.2. Both this and the item ceiling apply; the first reached
      wins.
  - key: limits.command_capture_bytes
    type: bytesize
    default: 268435456
    min: 0
    max: 1099511627776
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §23.4, Appendix A"
    doc: >-
      How many bytes every capture inside one shell command may retain together — a ceiling
      across nested capture contexts, not an allowance each capture may spend in full.

  # --- retained result history, §24.1 ----------------------------------------------------------
  - key: limits.history_results
    type: int
    default: 16
    min: 0
    max: 4096
    unit: results
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many recent pipeline results `@-1` … `@-N` can reach. Zero retains none.
  - key: limits.history_items_per_result
    type: int
    default: 10000
    min: 0
    max: 100000000
    unit: values
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many values of one result are retained for reuse. Retention only; the emitted output
      is never truncated.
  - key: limits.history_bytes_per_result
    type: bytesize
    default: 16777216
    min: 0
    max: 68719476736
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many bytes of one result are retained. A single value larger than this is not retained
      at all, and still flows through the pipeline normally (§24.2).
  - key: limits.history_bytes_total
    type: bytesize
    default: 67108864
    min: 0
    max: 274877906944
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many bytes the whole result history may hold. Oldest entries are evicted until it fits
      — history is a cache, so it evicts rather than failing the user's command (§24.2).

  # --- completion budgets, §36.2 ---------------------------------------------------------------
  - key: limits.completion_soft_ms
    type: int
    default: 50
    min: 1
    max: 60000
    unit: milliseconds
    enforced_by: ono-cli
    spec: "v0.4.1 §36.2, Appendix A"
    doc: >-
      When completion may begin answering with what it has. One rather than zero: a budget of
      zero would answer before it looked.
  - key: limits.completion_hard_ms
    type: int
    default: 150
    min: 1
    max: 60000
    unit: milliseconds
    enforced_by: ono-cli
    spec: "v0.4.1 §36.2, Appendix A"
    doc: >-
      When completion stops discovering, whatever it has found. Not to be set below the soft
      budget.

  # --- the listening agent, §12 ----------------------------------------------------------------
  # Declared, typed and range-checked here because §55.2's binding sentence is about the
  # *configuration* layer: "A security-sensitive agent limit MUST NOT silently become unlimited
  # because a value failed to parse." Enforcement is `ono-remote`'s and arrived with phase H3
  # (ADR-0501): `ono_protocol::Limits` carries all four as fields, clamps every setter into the
  # range declared below, and `ono_remote::ListeningAgent` applies them at the two moments
  # `docs/contracts/hardening/remote_limits.yaml` names. That file describes the enforcement and
  # references these keys; the numbers stay here, once (§52.2).
  # --- orientation, §34.4 ---------------------------------------------------------------------
  - key: limits.orientation_objects
    type: int
    default: 128
    min: 1
    max: 1000000
    unit: objects
    enforced_by: ono-cli
    spec: "v0.4.1 §34.4, Appendix A"
    doc: >-
      How many objects one orientation — `look`, `near`, the first frame of `map --live` — reads
      from a provider target before it stops reading and counts the rest instead. §34.4 asks that
      a local question not require the complete system graph "when provider APIs can answer the
      neighborhood incrementally"; the bound is what asks for the incremental answer, and the
      population the provider states beside it is what keeps the count honest (§2.17, ADR-0576).
      A place with fewer objects than this never notices it. The default sits above §34.2's
      hundred-node view budget, so no view ever shows fewer places because of the bound — it only
      stops the shell from reading objects it would cluster away unseen. Zero is excluded: an
      orientation that reads nothing is not a lower-detail view, it is a blank one.
  - key: limits.orientation_ceiling
    type: int
    default: 16384
    min: 1
    max: 100000000
    unit: objects
    enforced_by: ono-cli
    spec: "v0.4.1 §34.4, Appendix A"
    doc: >-
      The same bound, for a target whose count an orientation cannot keep true. A provider states
      one population per query, and a target that serves several kinds of place — `socket` serves
      both listeners and connections — cannot have that one figure split between them without
      inventing the split (§2.17). Such a target is therefore read whole on any ordinary host, and
      this is the ceiling at which "whole" stops: far above what a machine has, and far below what
      a pathological one has (§33.3's bounded lower-detail strategy). Past it the exits report no
      count and say why, rather than counting a sample as though it were the collection.
  - key: limits.remote_connections
    type: int
    default: 32
    min: 1
    max: 65536
    unit: connections
    enforced_by: ono-remote
    spec: "v0.4.1 §12.1, Appendix A"
    doc: >-
      Concurrent authenticated connections one agent accepts. One rather than zero: a ceiling of
      zero would silently turn the listener off, and §2.3 wants a boundary that refuses to say so.
  - key: limits.remote_pending_handshakes
    type: int
    default: 16
    min: 1
    max: 65536
    unit: handshakes
    enforced_by: ono-remote
    spec: "v0.4.1 §12.2, Appendix A"
    doc: >-
      Connections that may be mid-negotiation at once, before any of them is authenticated.
  - key: limits.remote_connections_per_client
    type: int
    default: 4
    min: 1
    max: 65536
    unit: connections
    enforced_by: ono-remote
    spec: "v0.4.1 §12.3, Appendix A"
    doc: >-
      Concurrent connections one authenticated fingerprint may hold, so one client cannot fill
      the global ceiling.
  - key: limits.remote_handshake_timeout_ms
    type: int
    default: 10000
    min: 100
    max: 600000
    unit: milliseconds
    enforced_by: ono-remote
    spec: "v0.4.1 §12.2, Appendix A"
    doc: >-
      How long TLS and protocol negotiation may take before the connection is dropped. The floor
      is 100 ms rather than 1: a timeout too short to complete a handshake is a listener that
      accepts nobody, which is a denial of service spelled as a configuration value.

# --- build budgets, issue #125 ------------------------------------------------------------------
#
# Not runtime limits: nothing here is a `limits.*` configuration key, the shell reads none of them,
# and `crates/ono-cli/tests/resource_limits.rs` compares only the `limits` list above against the
# shell's catalogue. They live in this file because §52.2 gives every hardening number one
# written-down home, and a budget on the shipped artifact is one.
#
#   key          the budget's name.
#   binary       the release binary it holds, by file name.
#   triple       the target triple it holds, when the row is for one; a row without one holds
#                every triple of its binary that has no row of its own. Every row here names its
#                triple, so a triple nobody budgeted fails where it is packaged (ADR-0866).
#   budget       the ceiling, inclusive, in `unit`.
#   measured     what is measured, and how.
#   enforced_by  who fails when the ceiling is exceeded.
#
# Raising a budget is a decision and takes an ADR saying what the bytes buy (ADR-0863).
build_budgets:
  - key: build.ono_stripped_bytes
    binary: ono
    triple: x86_64-unknown-linux-gnu
    type: bytesize
    budget: 24350304
    unit: bytes
    measured: >-
      The size of the release `ono` (`strip = "symbols"`, so the size a package installs), per
      target triple; recorded in docs/baselines/binary-size.yaml by `cargo xtask metrics --write`.
    enforced_by: >-
      `scripts/binary-size.sh` from `scripts/package.sh`, on the release runner and in CI's
      packaging job (ADR-0866); `cargo xtask binary-size`: `scripts/gate.sh` when a current release
      binary is built, and `docker/Dockerfile` with `--require` on every acceptance image build;
      `spec-check` holds the recorded figure to it (ADR-0864).
    spec: "v0.4.1 §44.2, §50.1, Appendix H; ADR-0863, ADR-0864, ADR-0866"
    doc: >-
      The first budget is the stripped x86_64 size the release profile of issue #124 lands at on
      the integrated tree (with #126, the compiler out of the shell, and #127), plus ten percent:
      22136640 bytes from `scripts/package.sh`, times 1.1. Before #126 the same profile gave
      28708064 bytes (ADR-0864).
  - key: build.ono_core_stripped_bytes
    binary: ono
    triple: x86_64-unknown-linux-musl
    type: bytesize
    budget: 7999999
    unit: bytes
    measured: >-
      The core build (#127, ADR-0910, ADR-0912): `ono` without the enhancements, statically linked
      against musl, at the release profile; `target/x86_64-unknown-linux-musl/release/ono`.
    enforced_by: >-
      `scripts/binary-size.sh` from `scripts/build-core.sh`, in the `core-build` job on every push;
      `cargo xtask binary-size` in `scripts/gate.sh` when a current core binary is built;
      `spec-check` holds the recorded figure to it (ADR-0864).
    spec: "#127; ADR-0912, ADR-0864"
    doc: >-
      #127's exit test: "a static binary under 8 MB", read as decimal megabytes (ADR-0912), so
      the inclusive ceiling is one byte under 8000000.
  - key: build.ono_aarch64_stripped_bytes
    binary: ono
    triple: aarch64-unknown-linux-gnu
    type: bytesize
    budget: 21359924
    unit: bytes
    measured: >-
      The release `ono` for aarch64, as `scripts/package.sh --target aarch64-unknown-linux-gnu`
      builds and packages it.
    enforced_by: >-
      `scripts/binary-size.sh` from `scripts/package.sh` on the release workflow's native arm64
      runner; `spec-check` holds the recorded figure to it (ADR-0866).
    spec: "v0.4.1 §44.2, §50.1; ADR-0866"
    doc: >-
      19418112 bytes, built by `scripts/package.sh --target aarch64-unknown-linux-gnu` through
      `cross` on x86_64 at cc2d9a5d plus the fixes of ADR-0866, times 1.1, rounded up. The release
      builds it natively on arm64 in the pinned build image; ADR-0866 says why the two agree.
  - key: build.kuang_compile_stripped_bytes
    binary: kuang-compile
    triple: x86_64-unknown-linux-gnu
    type: bytesize
    budget: 8045823
    unit: bytes
    measured: >-
      The KUANG/11 compiler the packages ship beside the shell (ADR-0870), as `scripts/package.sh`
      builds it.
    enforced_by: >-
      `scripts/binary-size.sh` from `scripts/package.sh`, on the release runner and in CI's
      packaging job; `spec-check` holds the recorded figure to it (ADR-0866).
    spec: "v0.4.1 §44.2, §50.1; ADR-0866, ADR-0870"
    doc: >-
      7314384 bytes from `scripts/package.sh` at cc2d9a5d plus the fixes of ADR-0866, times 1.1,
      rounded up.
  - key: build.kuang_compile_aarch64_stripped_bytes
    binary: kuang-compile
    triple: aarch64-unknown-linux-gnu
    type: bytesize
    budget: 6151174
    unit: bytes
    measured: >-
      The KUANG/11 compiler for aarch64, as `scripts/package.sh --target
      aarch64-unknown-linux-gnu` builds it.
    enforced_by: >-
      `scripts/binary-size.sh` from `scripts/package.sh` on the release workflow's native arm64
      runner; `spec-check` holds the recorded figure to it (ADR-0866).
    spec: "v0.4.1 §44.2, §50.1; ADR-0866, ADR-0870"
    doc: >-
      5591976 bytes, built through `cross` on x86_64 like the aarch64 shell's figure, times 1.1,
      rounded up.
