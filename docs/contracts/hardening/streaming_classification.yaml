# The streaming classification matrix of v0.4.1 Appendix E, as data.
#
# Appendix E's own closing sentence is why this file exists:
#
#   "If a command cannot be placed in this matrix, its execution semantics are underspecified and
#    MUST be resolved before release."
#
# A sentence like that needs something that can fail. `cargo xtask spec-check` reads this file,
# reads every command contract under `docs/contracts/commands/`, and requires each command that
# consumes a stream to name one of the eight classes below — so a new transform cannot be added
# without its execution semantics being stated, and a class cannot be invented in passing.
#
# The two properties are the ones the rest of the hardening layer acts on:
#
#   requires_finite_input   §22.3 — the stage refuses a declared-unbounded upstream immediately,
#                           with `stream.unbounded_operation`, before consuming a value.
#   may_materialize         §22.1, §22.2 — the stage may hold its input, within the budget of
#                           `limits.materialize_items` and `limits.materialize_bytes`.
#
# `explain` reads the same classification, so what §22.4 shows a user is derived from this
# contract rather than restated beside it (ADR-0460). Decisions: ADR-0455, ADR-0460.
#
# Authority: `ono_command::ExecutionClass` carries the same eight ids and the same two properties,
# and `xtask/tests/contracts.rs` compares the two in both directions.

version: 1

# ---------------------------------------------------------------------------------------------
# Appendix E's eight rows, in its own order.
# ---------------------------------------------------------------------------------------------
classes:
  - id: item_transform
    appendix_e: Item transform
    requires_finite_input: false
    may_materialize: false
    doc: >-
      One value in, zero or more values out, with no state that grows. `each` and projection.
      §25.2 forbids it capturing its complete input, which is what makes it this class rather
      than a collector wearing its name.
  - id: predicate
    appendix_e: Predicate
    requires_finite_input: false
    may_materialize: false
    doc: A test applied to each value in turn. `where`.
  - id: prefix
    appendix_e: Prefix
    requires_finite_input: false
    may_materialize: false
    doc: >-
      Answers from a bounded prefix of its input and then stops reading, which is what lets
      `source | take 1` complete while the source is still waiting (§60.1).
  - id: incremental_aggregate
    appendix_e: Incremental aggregate
    requires_finite_input: false
    may_materialize: false
    doc: >-
      Folds its input into state of a fixed or explicitly bounded size — a counter, an
      accumulator, a ring buffer of a declared length. Appendix E permits "constant/bounded state
      only", so a stage that grows its state per value is not this class however it is named.
  - id: global_reorder
    appendix_e: Global reorder
    requires_finite_input: true
    may_materialize: true
    doc: Emits the same values in an order it can only know once it has them all. `sort`.
  - id: global_grouping
    appendix_e: Global grouping
    requires_finite_input: true
    may_materialize: true
    doc: Emits one value per group, which it can only close once the input has ended. `group`.
  - id: explicit_collect
    appendix_e: Explicit collect
    requires_finite_input: true
    may_materialize: true
    doc: >-
      Holds a collection because its answer is defined over the whole of it: an explicit list, an
      exact percentile, the side of a relational operation that is not streamed past.
  - id: live_view
    appendix_e: Live view
    requires_finite_input: false
    may_materialize: false
    doc: >-
      Maintains a bounded model of current state and repaints it. Never accumulates history: a
      live view that kept every frame would be §65.7's background collection with a picture on it.

# ---------------------------------------------------------------------------------------------
# Where each pipeline operation sits. Every command whose declared `input` is a stream must
# appear here, and the `execution:` field of its contract must say the same thing.
# ---------------------------------------------------------------------------------------------
operations:
  - command: ono.data.each
    class: item_transform
  - command: ono.data.select
    class: item_transform
  - command: ono.data.where
    class: predicate
  - command: ono.data.take
    class: prefix
  - command: ono.data.skip
    class: prefix
    note: >-
      Drops a prefix rather than keeping one, and reads no further ahead than the value it is
      forwarding, so its state is the count it has skipped.
  - command: ono.data.count
    class: incremental_aggregate
  - command: ono.data.reduce
    class: incremental_aggregate
    note: The accumulator is one value; a folder that grew it per input would be a collector.
  - command: ono.data.tail
    class: incremental_aggregate
    note: >-
      Keeps the last `n` values in a ring of the declared length — bounded state, not a
      materialization, which is why it does not require finite input the way `sort` does.
  - command: ono.data.sort
    class: global_reorder
  - command: ono.data.group
    class: global_grouping
  - command: ono.data.measure
    class: explicit_collect
    note: >-
      Placed by its properties rather than by Appendix E's example name. `count`, `sum`, `mean`,
      `min` and `max` are constant-state, but an exact percentile is defined over the whole
      distribution and holds a sample per value (§22.1), so the stage as a whole requires finite
      input and materializes within budget. Splitting the constant-state statistics from the
      distribution ones would move the first half to `incremental_aggregate` (ADR-0454).
  - command: ono.data.join
    class: explicit_collect
    note: >-
      The left side streams past; the right side is held for the whole run and is what the budget
      is charged for (ADR-0454).
  - command: ono.data.diff
    class: explicit_collect
    note: The earlier snapshot is held; the new state streams past it.
  - command: ono.place.map
    class: live_view
    note: >-
      Appendix E's own example of the class. `--live` repaints a bounded projection of the
      current graph and keeps no history of it (§35.2, §35.3).

# ---------------------------------------------------------------------------------------------
# What a consumer may conclude from the order it observed things in (v0.4.1 §27).
#
# §27.2 requires this to be explicit rather than implied by whatever Tokio happened to schedule,
# and §27.4 requires the stream module documentation to state it and the concurrency tests to
# prove only what is promised here. `docs/reference/streaming.md` is rendered from this block, so
# the page a user reads and the rule the tests hold are one text (ADR-0483).
# ---------------------------------------------------------------------------------------------
ordering:
  per_channel: >-
    Total. Every event of one channel is delivered in the order it was produced, and no stage
    reorders its own channel: values keep value-channel order and partial failures keep
    error-channel order, however many stages they pass through (§27.1).
  cross_kind: >-
    None. `StreamEvent` does not promise a total temporal ordering between independently produced
    value and partial-error channels unless a producer explicitly serializes them through one
    event source (§27.2).
  causality: >-
    Consumers MUST NOT infer causality from the relative observation order of a value and an
    asynchronously reported partial error. That a failure was observed after a value does not mean
    it happened after it, and a consumer that acts on the difference is reading the scheduler
    rather than the pipeline (§27.2).
  total_order: >-
    A provider or operation whose semantic contract must express "the error occurred between value
    A and value B" emits an ordered event stream through one sequence-bearing path — one sink,
    one send at a time, on one channel — rather than relying on scheduling between two channels
    (§27.3). `StreamSink::send_in_sequence` is that path: it places every event on the value
    channel, carrying a failure as the error value it is, so the order the producer chose is the
    order the consumer observes.
  channels:
    - id: value
      carries: The values a stage produced.
      ordered_within_itself: true
      doc: >-
        The stream's answer. A stage forwards these in the order it received them unless its own
        contract reorders — `sort` does, and says so in its classification above.
    - id: partial_failure
      carries: >-
        Failures that concern one item rather than the pipeline, which spec §16.5 forbids
        collapsing into the result.
      ordered_within_itself: true
      doc: >-
        Reported beside the values rather than instead of them, and asynchronously: the stage that
        raised one keeps running, so the failure reaches the consumer when the error channel has
        room rather than at the position in the value sequence where it arose.
