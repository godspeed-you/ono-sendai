# The release reference environment of v0.4.1 §37.2, as data.
#
# §37.2 is short and absolute:
#
#   "The release documentation MUST name the hardware/software environment used for absolute
#    performance gates: CPU model / core count, RAM, kernel version, distribution/container
#    image, Rust toolchain, release build flags."
#
# §32.4 says why: "release qualification MUST run on a named reference environment with stable
# absolute targets". A latency figure without the machine behind it is not a measurement, it is
# an anecdote — and this repository has the receipt. ADR-0252 accepted a proxy for §34's 50 ms
# completion budget because "a wall-clock assertion is flaky on shared hardware"; ADR-0431 chose
# §33.3's thirty-second floor over §33.2's 500 ms target for the same reason; ADR-0459 measured
# cancellation at 0.07 s for a hundred cancellations and deliberately asserted none of it. All
# three were waiting for this file.
#
# This is documentation that a machine reads, so it cannot go quietly stale:
# `xtask/tests/perf.rs::should_name_the_reference_environment_on_every_recorded_figure` requires
# every §37.2 field to be stated, and requires every record in
# `docs/contracts/hardening/performance_baseline.json` to name this environment.
#
# Naming a *second* environment is a second file beside this one plus a second baseline;
# `xtask::perf::Comparison::ForeignEnvironment` is what stops a figure from one being read as a
# verdict about the other. Decisions: ADR-0489, ADR-0490.

version: 1

# ---------------------------------------------------------------------------------------------
# The environment absolute performance gates are measured on.
# ---------------------------------------------------------------------------------------------
environment:
  id: ryzen-3900x-ubuntu-2604

  # §37.2's six required facts.
  cpu_model: AMD Ryzen 9 3900X 12-Core Processor
  cpu_cores: 8
  ram_bytes: 65273339904
  kernel: Linux 7.0.0-30-generic
  distribution: Ubuntu 26.04.1 LTS
  rust_toolchain: "1.94"
  release_build_flags: >-
    cargo build --release with the workspace release profile: lto = "thin",
    codegen-units = 1, strip = "symbols" (Cargo.toml [profile.release]).

  # Stated rather than implied, because a figure measured here is being compared against a figure
  # measured here later, and the reader has to know what the two runs shared.
  notes: >-
    Eight cores of a twelve-core part, so the machine is a virtualised slice rather than the whole
    processor, and it is shared with the developer's ordinary work. Absolute targets are therefore
    stated with the load average of the run beside them, and §37.4's statistical rule — at least
    twenty iterations, median and p95 — is what makes a figure from it usable at all. A
    single-run best-case timing does not qualify a release, and
    `xtask::perf::Comparison::Underpowered` is where that rule is enforced rather than remembered.
