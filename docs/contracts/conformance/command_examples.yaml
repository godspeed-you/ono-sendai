# Documented examples the command conformance suite would run and cannot, with the reason.
#
# `crates/ono-cli/tests/command_conformance.rs` is generated from `docs/contracts/commands/*.yaml`
# by `cargo xtask conformance` (issue #149, ADR-0935). It runs every example whose contracts say it
# is safe to run in a hermetic scratch shell — declared commands only, no mutating verb
# (`verbs.yaml`), privilege `none`, a `read` capability that stays on this host
# (`capabilities.yaml`), no live source, no redirection, no reference to an earlier session, no
# output schema still owed by `schemas/deferred.yaml` — and holds every value it produces to the
# command's declared `output`. Those rules are the contracts'; they are not restated here.
#
# What the contracts cannot see is listed here instead: an example that names an object a fresh
# environment does not have, or a command whose value cannot be observed through a pipeline.
# The register is checked both ways when the suite is generated: an entry that names an example
# no command documents, or one the contracts already skip, is refused as stale, so an exemption
# cannot outlive its reason unnoticed.
#
# Fields
#
#   command   the command id whose `examples:` documents the example.
#   example   the example, character for character.
#   reason    why it cannot run here, in terms a reader can check.

version: 1

exemptions:
  # --- objects a fresh environment does not have ---------------------------------------------
  - command: ono.change-plan.get
    example: get plan a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change-plan.get
    example: get plan a82f --revision 1
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change-plan.inspect
    example: inspect plan a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change-plan.inspect
    example: inspect plan a82f --resolution
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change-plan.inspect
    example: inspect plan a82f --protection
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change-plan.rebase
    example: rebase plan a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change.impact
    example: impact a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change.impact
    example: impact a82f --depth 3
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change.verify
    example: verify a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change.recover
    example: recover a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.change.recover
    example: recover a82f --goal restore-changed-objects
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.recovery.get
    example: get recovery --plan a82f
    reason: names the plan `a82f`, and a fresh state directory holds no plan.
  - command: ono.recovery.inspect
    example: inspect recovery r-a82f
    reason: names the recovery asset `r-a82f`, and a fresh state directory holds none.
  - command: ono.change.plan
    example: plan restart service nginx
    reason: plans against the unit `nginx`, which a test host need not have.
  - command: ono.change.plan
    example: plan copy file ./nginx.conf /etc/nginx/nginx.conf
    reason: >-
      plans to replace `/etc/nginx/nginx.conf` from `./nginx.conf`; a scratch directory has
      neither file.
  - command: ono.change.plan
    example: get service | where state == failed | plan restart service
    reason: >-
      plans against the failed units of the host; a healthy test host has none, and a plan over
      nothing is refused rather than empty.
  - command: ono.process.get
    example: get process 4419
    reason: names the process 4419, which a test host need not be running.
  - command: ono.host.trace
    example: trace host prod-db
    reason: names the host `prod-db`, which a fresh configuration does not know.
  - command: ono.link.trace
    example: trace link prod-db
    reason: names the link `prod-db`, which a fresh configuration does not hold.
  - command: ono.permission.get
    example: get permission kubernetes
    reason: names the package `kubernetes`, and a fresh plugin path has none installed.
  - command: ono.permission.get
    example: get permission kubernetes --all
    reason: names the package `kubernetes`, and a fresh plugin path has none installed.
  - command: ono.plugin.inspect
    example: inspect plugin kubernetes
    reason: names the package `kubernetes`, and a fresh plugin path has none installed.
  - command: ono.plugin.inspect
    example: inspect plugin dev.example.packet-eye
    reason: names the package `dev.example.packet-eye`, and a fresh plugin path has none installed.
  - command: ono.plugin.verify
    example: verify plugin dev.example.packet-eye
    reason: names the package `dev.example.packet-eye`, and a fresh plugin path has none installed.
  - command: ono.temporal.at
    example: at -10m
    reason: >-
      asks for recorded history, and a fresh shell has recorded nothing: recording is off until
      `start recorder` (v0.5 §10.2), which mutates.
  - command: ono.temporal.at
    example: at 12:17
    reason: >-
      asks for recorded history, and a fresh shell has recorded nothing: recording is off until
      `start recorder` (v0.5 §10.2), which mutates.
  - command: ono.temporal.at
    example: at 2026-08-31T12:17:00+02:00
    reason: >-
      asks for recorded history, and a fresh shell has recorded nothing: recording is off until
      `start recorder` (v0.5 §10.2), which mutates.
  - command: ono.place.back
    example: back
    reason: returns to the previous place, and a fresh session has not moved (spatial.history_empty).
  - command: ono.place.up
    example: up
    reason: >-
      moves to the parent place, and a fresh one-shot session starts at the top of the host's
      canonical hierarchy (spatial.no_parent).
  - command: ono.place.unpin
    example: unpin
    reason: removes the pin of the current place, and a fresh session has pinned nothing.
  - command: ono.place.unpin
    example: unpin edge-proxy
    reason: removes the pin `edge-proxy`, and a fresh session has pinned nothing.

  # --- programs no contract describes -------------------------------------------------------
  - command: ono.temporal.present
    example: present git status
    reason: >-
      runs `git status`, an external program whose effects and output no contract states, in a
      scratch directory that is not a repository.
  - command: ono.temporal.present
    example: present printf ok
    reason: >-
      runs `printf`, an external program that writes to the terminal before the action result,
      so its output is not one inspectable document.

  # --- commands whose value a pipeline cannot observe ---------------------------------------
  # `enter <target>` changes the session's context frame and runs only as a statement of its own:
  # placed in a pipeline it is refused as declared-but-not-implemented, so its declared
  # `ono.context/1` cannot reach `inspect` (found by the suite; see ADR-0935).
  - command: ono.user.enter
    example: enter user postgres
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.group.enter
    example: enter group docker
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.interface.enter
    example: enter interface eth0
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.process.enter
    example: enter process 4419
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.link.enter
    example: enter link prod-db
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.service.enter
    example: enter service nginx
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  - command: ono.mount.enter
    example: enter mount /mnt/data
    reason: runs only as a statement of its own; in a pipeline this build implements nothing for it.
  # `explain` written with bare words takes the rest of its pipeline as its subject (spec §11.3,
  # ADR-0942), so `| inspect | to json` appended to it is explained rather than run. The same
  # record is observed through the delimited examples `explain "…"` and `explain { … }`.
  - command: ono.meta.explain
    example: explain get process
    reason: >-
      the unquoted form plans everything after `explain`, so the suite's `| inspect | to json`
      would become stages of the subject; the delimited examples of the same command run.

  # --- examples that name what the shell does not have --------------------------------------
  - command: ono.change.plan
    example: plan update package openssl --protection require
    reason: >-
      spells v0.6 §3.1's intent `update package`, and no verb `update` exists (verbs.yaml); the
      plan refuses it as not plannable. A gap between the specification's illustration and the
      verb vocabulary, recorded in ADR-0935, not a property of the test host.

# --- runs, and may produce no value in a fresh environment ------------------------------------
#
# An example that produces nothing conforms to every declaration, so it would pass without having
# held a single value to its contract (review C8, ADR-0941). The harness refuses an empty answer
# unless the example is listed here with the reason a fresh environment has nothing to show. A
# listed example still runs, and every value it does produce is still held to the declaration.
# The register is checked like the exemptions: an entry naming no runnable example is refused.
may_be_empty:
  - command: ono.audit.get
    example: "get audit --plugin dev.example.packet-eye"
    reason: "names the plugin `dev.example.packet-eye`, and a fresh environment has none installed, so no action of it is audited."
  - command: ono.assistant.get
    example: "get assistant"
    reason: "lists loaded assistant extensions, and a fresh environment loads none."
  - command: ono.change-plan.get
    example: "get plan --state failed"
    reason: "a fresh state directory holds no plan, failed or otherwise."
  - command: ono.capability.get
    example: "get capability --plugin dev.example.packet-eye"
    reason: "names the plugin `dev.example.packet-eye`, and a fresh environment has none installed."
  - command: ono.client-key.get
    example: "get client-key"
    reason: "a fresh configuration authorizes no client key."
  - command: ono.change-plan.get
    example: "get plan"
    reason: "a fresh state directory holds no plan."
  - command: ono.config.get
    example: "get config --problems"
    reason: "a fresh configuration has no problem to report; the empty answer is the healthy one."
  - command: ono.event.find
    example: "find event 'kind == \"action.failed\"'"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.event.find
    example: "find event --since 1h"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.event.find
    example: "find event 'kind == \"object.appeared\"' | take 20"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.finding.get
    example: "get finding | where severity >= medium"
    reason: "findings are emitted by analyses and assistants, and a fresh environment has run none."
  - command: ono.group.get
    example: "get group | where \"postgres\" in members"
    reason: "names the user `postgres`, which a test host need not have."
  - command: ono.host.get
    example: "get host"
    reason: "a fresh configuration names no host source."
  - command: ono.host-key.get
    example: "get host-key"
    reason: "a fresh configuration has pinned no host key."
  - command: ono.job.get
    example: "get job"
    reason: "a fresh session has started no job."
  - command: ono.link.get
    example: "get link"
    reason: "a fresh session has opened no link."
  - command: ono.job.get
    example: "get job | where state == running"
    reason: "a fresh session has started no job."
  - command: ono.model.get
    example: "get model"
    reason: "a fresh configuration declares no model provider."
  - command: ono.permission.get
    example: "get permission"
    reason: "lists what installed packages may do, and a fresh environment has none installed."
  - command: ono.package.get
    example: "get package nginx"
    reason: "names the package `nginx`, which a test host need not have installed."
  - command: ono.place.trail
    example: "trail"
    reason: "a fresh session has navigated nowhere, so its trail is empty."
  - command: ono.plugin.get
    example: "get plugin"
    reason: "a fresh environment has no plugin installed (`ONO_PLUGIN_PATH` is an empty scratch directory)."
  - command: ono.plugin.find
    example: "find plugin postgres"
    reason: "a fresh environment has no plugin installed (`ONO_PLUGIN_PATH` is an empty scratch directory)."
  - command: ono.plugin.get
    example: "get plugin | where state == loaded"
    reason: "a fresh environment has no plugin installed (`ONO_PLUGIN_PATH` is an empty scratch directory)."
  - command: ono.recovery.get
    example: "get recovery"
    reason: "a fresh state directory holds no recovery asset."
  - command: ono.service.get
    example: "get service nginx"
    reason: "names the service `nginx`, which a test host need not run."
  - command: ono.temporal.changes
    example: "changes --since 10m"
    reason: "a fresh state directory has recorded no history to compare."
  - command: ono.meta.inspect
    example: "get service | where state == failed | take 1 | inspect"
    reason: "needs a failed service, and a healthy test host has none."
  - command: ono.temporal.changes
    example: "changes service nginx --since 1h"
    reason: "a fresh state directory has recorded no history, and a test host need not run `nginx`."
  - command: ono.temporal.changes
    example: "changes --since 12:00 --until 12:30"
    reason: "a fresh state directory has recorded no history to compare."
  - command: ono.temporal.changes
    example: "changes --since 30m | group subject.object_type"
    reason: "a fresh state directory has recorded no history to compare."
  - command: ono.temporal.timeline
    example: "timeline"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.temporal.timeline
    example: "timeline --since 30m"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.temporal.timeline
    example: "timeline --kind object.changed"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.temporal.timeline
    example: "timeline service nginx"
    reason: "a fresh state directory has recorded no event history, and a test host need not run `nginx`."
  - command: ono.temporal.timeline
    example: "timeline --view"
    reason: "a fresh state directory has recorded no event history."
  - command: ono.temporal.timeline
    example: "timeline --since 1h | where kind == \"object.changed\""
    reason: "a fresh state directory has recorded no event history."
  - command: ono.user.get
    example: "get user postgres"
    reason: "names the user `postgres`, which a test host need not have."
  - command: ono.service.get
    example: "get service | where state == failed"
    reason: "a healthy test host has no failed service."
  - command: ono.data.where
    example: "get process | where cpu > 20"
    reason: "selects processes above a CPU threshold, and how many there are is the test host's load at that instant."
  - command: ono.data.where
    example: "get process | where cpu > 20 and user.name != \"root\""
    reason: "selects processes above a CPU threshold, and how many there are is the test host's load at that instant."
  - command: ono.data.join
    example: "get process | join (get process | where cpu > 1) --on pid"
    reason: "selects processes above a CPU threshold, and how many there are is the test host's load at that instant."
  - command: ono.process.get
    example: "get process | where cpu > 20"
    reason: "selects processes above a CPU threshold, and how many there are is the test host's load at that instant."
  - command: ono.process.get
    example: "get process --sample 500ms | where cpu > 20"
    reason: "selects processes above a CPU threshold, and how many there are is the test host's load at that instant."
  - command: ono.session.get
    example: "get session"
    reason: "lists login sessions, and a build host or container need not have one."
  - command: ono.interface.get
    example: "get interface | where state == up"
    reason: "a host without networking (a sandbox, `--network none`) has no interface that is up."
  - command: ono.route.get
    example: "get route | where destination == null"
    reason: "a host without networking has no default route."
  - command: ono.neighbor.get
    example: "get neighbor"
    reason: "the neighbor table of a host that has talked to nobody yet is empty."
  - command: ono.neighbor.get
    example: "get neighbor | where state == reachable"
    reason: "the neighbor table of a host that has talked to nobody yet is empty."
  - command: ono.route.trace
    example: "trace route 0.0.0.0/0"
    reason: "a host without networking has no default route to trace."
  - command: ono.package.find
    example: "find package postgres"
    reason: "names `postgres`, which the test host's package database need not know."
  - command: ono.mount.get
    example: "get mount | where read_only"
    reason: "a test host need not have a read-only mount."
