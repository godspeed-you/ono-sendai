      retained. `inspect plan`, `recover plan/<id>` and `rebase plan <id>` are all available; none
      of them is automatically the right one.
  - code: Ono-Sendai-E1719
    name: change.verification_failed
    kind: provider
    summary: A required postcondition did not hold after the change.
    help: >-
      v0.6 §2.14 and §23.2: a command that returned success has not proved that the intended state
      exists. The plan is FAILED and its recovery assets are retained (§37.2).
  - code: Ono-Sendai-E1720
    name: change.verification_unknown
    kind: provider
    summary: A verification check could not be answered.
    help: >-
      v0.6 §23.3 and §23.5: an unanswerable check is UNKNOWN, and §2.4 forbids reading that as a
      pass. The metadata names the check and why it could not be observed.
  - code: Ono-Sendai-E1721
    name: change.verification_missing
    kind: conflict
    summary: A plan containing a mutating action carries no verification contract.
    help: >-
      v0.6 §23.1: every plan that mutates MUST have at least one verification contract, even where
      the minimum is provider-level state acknowledgement. A plan that cannot be checked cannot be
      sealed.
  - code: Ono-Sendai-E1722
    name: change.irreversible_not_accepted
