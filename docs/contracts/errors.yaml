    help: >-
      v0.6 Appendix D.3 and §53's `recovery.min_filesystem_free`: automatic protection fails
      closed rather than worsening storage exhaustion. The metadata names the pool or filesystem,
      the free space and the floor. `get recovery` shows what is already retained.
  - code: Ono-Sendai-E1817
    name: recovery.asset_stale
    kind: conflict
    summary: The recovery asset no longer reflects the state that is about to change.
    help: >-
      v0.6 §18.3: an asset created before the state drifted is not a just-before-change recovery
      point, and Ono does not pretend it is. Creating a fresh asset, or accepting the stale one
      explicitly, are the two ways forward.
  - code: Ono-Sendai-E1818
    name: recovery.quiesce_failed
    kind: provider
    summary: An application could not be quiesced for an application-consistent asset.
    help: >-
      v0.6 §18.4 and §39.3: the quiesce window is bounded and the application is resumed when
      snapshot creation fails. Nothing was mutated.
  - code: Ono-Sendai-E1819
    name: recovery.resume_failed
    kind: provider
    summary: An application was quiesced and could not be resumed.
    help: >-
      v0.6 §18.4 makes this a critical error surfaced separately from whatever else happened: the
      application is still paused. The metadata names the application, the provider and the resume
      operation that failed.
  - code: Ono-Sendai-E1820
    name: recovery.plan_incomplete
    kind: safety
    summary: A recovery fact required before destructive recovery could not be established.
    help: >-
      v0.6 §56.3: where any critical recovery fact cannot be established, destructive recovery is
      blocked rather than guessed. The metadata names the fact — a snapshot that may not exist, a
      clone whose effect on rollback is unknown, a boundary that could not be read.
  - code: Ono-Sendai-E1901
    name: transaction.atomicity_unavailable
    kind: provider
    summary: A transaction was requested from a provider that does not offer one.
    help: >-
      v0.6 §27.1: the word `transaction` is reserved for a provider that can state concrete
      atomicity and rollback guarantees for its own domain.
  - code: Ono-Sendai-E1902
    name: transaction.cross_provider_not_atomic
    kind: provider
    summary: A change spanning several providers cannot be atomic.
    help: >-
      v0.6 §2.11 and §27.2: a plan involving a filesystem, a service manager and a remote call is
      a ChangeSet, not a transaction, even where each domain has recovery actions. §27.3 makes
      generic distributed two-phase commit an explicit non-goal.
  # --- KUANG/11, spec §31.79 (folded into the global model by ADR-0108) ---------------------
  - code: Ono-Sendai-K11001
    name: package.invalid
    kind: parse
    summary: The package manifest is not a valid `kuang-package/1` document.
    help: >-
      `verify plugin <reference>` reports which rule failed. A missing mandatory field, an unknown field in a closed section, an id outside the publisher namespace and an unknown capability id all fail closed (spec §31.7).
  - code: Ono-Sendai-K11002
    name: package.incompatible
    kind: conflict
    summary: The package requires a host, platform or API version this system does not provide.
    help: >-
      The unmet range is in the error metadata. `compatibility.kuang_api`, `ono_language` and `platforms` are each checked separately, so exactly one of them is the answer.
  - code: Ono-Sendai-K11003
    name: package.integrity_failed
    kind: safety
    summary: The package's bytes do not match the hash the reference named.
    help: >-
      Do not install it because it is inconvenient not to. A hash mismatch is indistinguishable from a substituted artifact. Re-resolve from the source and compare, or obtain the package another way.
  - code: Ono-Sendai-K11004
    name: package.signature_invalid
    kind: safety
    summary: The package carries a signature and it does not verify.
    help: >-
      An *absent* signature is not this error — an unsigned package installs in a visibly untrusted, capability-limited mode (spec §31.36). A signature that fails to verify is a different claim, and it is refused.
  - code: Ono-Sendai-K11005
    name: publisher.untrusted
    kind: safety
    summary: The signing key or publisher is not one this system trusts.
    help: >-
      Trust the publisher deliberately, out of band, and record it — or install the package unsigned and accept the untrusted, capability-limited mode it then runs in. Trusting a key because it happened to sign the thing you already wanted is not verification.
  - code: Ono-Sendai-K11101
    name: load.capability_denied
    kind: permission
    summary: A capability the package declares as required was not granted.
    help: >-
      `inspect plugin <id>` lists every requested capability with its class and its grant state. Grant it with `grant capability`, or leave the package unloaded — a required capability is one the package said it could not run without.
  - code: Ono-Sendai-K11102
    name: load.dependency_missing
    kind: resolution
    summary: A declared package or schema dependency could not be resolved.
    help: >-
      The unresolved id and version range are in the error metadata. Install the dependency, or use a package version whose range this system can satisfy.
  - code: Ono-Sendai-K11103
    name: load.dependency_cycle
    kind: conflict
    summary: The package's dependencies form a cycle.
    help: >-
      The cycle is listed in the error metadata. Spec §31.30 requires cycles to be detected before load, so nothing has run; the packages involved must be fixed by their publishers.
  - code: Ono-Sendai-K11104
    name: load.runtime_unavailable
    kind: provider
    summary: The isolation tier the package declares is not available on this host.
    help: >-
      The package's `runtime.kind` names a tier this build or this policy does not offer. A native out-of-process package on a host that permits only isolated components is the common case, and it is a policy answer rather than a missing file.
  - code: Ono-Sendai-K11201
    name: runtime.trap
    kind: external
    summary: The plugin instance trapped or crashed.
    help: >-
      The shell is unaffected: failure degrades the plugin, not Ono (spec §31.34). Streams the instance produced were cancelled with this error. `inspect plugin` shows the restart count.
  - code: Ono-Sendai-K11202
    name: runtime.timeout
    kind: timeout
    summary: A host call or invocation exceeded its deadline.
    help: >-
      The deadline and the call are in the error metadata. An assistant turn or a slow provider is the usual cause; a raised deadline is a policy change, not a retry.
  - code: Ono-Sendai-K11203
    name: runtime.memory_limit
    kind: external
    summary: The plugin instance exceeded its memory ceiling and was terminated.
    help: >-
      The declared and effective ceilings are in the error metadata; the effective one is the smaller of the package's declaration and host policy. A package that needs more must say so in its manifest and be granted it.
  - code: Ono-Sendai-K11204
    name: runtime.protocol_violation
    kind: provider
    summary: The plugin sent a message that is not valid under the negotiated host API.
    help: >-
      A malformed frame, an emission beyond granted credit, or a handle that is not the plugin's. This is a defect in the package, not in your pipeline; the instance is not restarted automatically.
  - code: Ono-Sendai-K11205
    name: runtime.schema_violation
    kind: provider
    summary: The plugin emitted a value outside the schema its contribution advertises.
    help: >-
      Report it to the package's publisher with the output of `inspect` on the offending value. Ono validates contributed output rather than trusting it, which is why you are seeing this instead of a wrong answer.
  - code: Ono-Sendai-K11206
    name: runtime.backpressure_failure
    kind: stream
    summary: A stream could not keep up and its policy was to fail rather than lose data.
    help: >-
      The stream's overflow policy was `fail-stream`, which correctness-sensitive analyses require (spec §31.15). A lossy policy would have answered, incompletely and quietly. Slow the source, bound it with `take`, or choose a policy that says which values it discards.
  - code: Ono-Sendai-K11207
    name: runtime.concurrency_limit
    kind: safety
    summary: The plugin already has as many invocations open as its contract allows.
    help: >-
      The instance is healthy and busy: `max_concurrent_invocations` in the negotiated contract is the ceiling, and it is the smaller of the package's declaration and host policy (spec §31.15). Nothing of the refused invocation ran. Wait for one of the open invocations to finish, or raise the ceiling deliberately.
  - code: Ono-Sendai-K11301
    name: capability.denied
    kind: permission
    summary: The plugin asked for something it has not been granted.
    help: >-
      `get capability --plugin <id>` shows what it holds. Deny by default is the design (spec §31.19); a package that works only when granted everything it asks for should be asked why.
  - code: Ono-Sendai-K11302
    name: capability.scope_violation
    kind: permission
    summary: The plugin holds the capability but the call fell outside its granted scope.
    help: >-
      The attempted value and the granted scope are both in the error metadata, and the attempt is in the audit trail. Widen the scope deliberately with `grant capability --scope`, or leave it as it is.
  - code: Ono-Sendai-K11303
    name: capability.lease_expired
    kind: permission
    summary: The lease backing this call has expired, been used up, or its condition no longer holds.
    help: >-
      A lease is checked at every use, not at grant time (spec §31.49). Issue a new lease if the delegation is still wanted; a lease is never extended in place, so the audit trail shows two decisions rather than one.
  - code: Ono-Sendai-K11304
    name: permission.required
    kind: permission
    summary: The operation needs a permission nobody has decided, and this context cannot ask.
    help: >-
      A script never waits for a prompt and never assumes consent (K11P section 20.3). The metadata carries the plugin, the permission, the capability, the requested scope, the reason and a `remedy`: a `set permission` or `grant capability` line that decides it deliberately.
  - code: Ono-Sendai-K11305
    name: permission.denied
    kind: permission
    summary: The operation needs a permission the user denied.
    help: >-
      The message leads with the permission and the reason; the capability and the operation are in the metadata (K11P section 24.4). `get permission <plugin>` shows the decision, and `set permission <plugin> <permission> --decision allow` or `--decision ask` changes it.
  - code: Ono-Sendai-K11306
    name: permission.invalid_profile
    kind: resolution
    summary: The named access profile does not exist for this package.
    help: >-
      `inspect plugin <plugin>` lists the profiles a package offers; every package with permission requests offers `minimal` and `recommended` (K11P section 9.1).
  - code: Ono-Sendai-K11307
    name: permission.invalid_mapping
    kind: parse
    summary: The package's permission declarations do not map validly onto its capabilities.
    help: >-
      The manifest is invalid and nothing of the package runs (K11P section 8.2, ADR-0600 section 3). The message names the rule: a permission grants a capability the manifest does not declare, a phase or a risk below the class of what it grants, a `recommended` profile carrying mutation, or a title that could spoof the text beside it.
  - code: Ono-Sendai-K11308
    name: permission.scope_unavailable
    kind: safety
    summary: The concrete scope a permission needs could not be derived or enforced.
    help: >-
      A runtime-derived scope is granted for the exact value in use; where that value cannot be established or the broker cannot enforce it, the permission is refused rather than granted wider (K11P section 19.3).
  - code: Ono-Sendai-K11309
    name: permission.escalation_requires_confirmation
    kind: safety
    summary: The permission widens authority and needs a deliberate confirmation this context cannot give.
    help: >-
      A destructive permission is never enabled by `--confirm` or any unattended acceptance (K11P section 7.5), and a mutating profile applied non-interactively must be named outright. Re-run interactively, or name the profile or permission on the command line together with `--confirm`.
  - code: Ono-Sendai-K11401
    name: state.quota_exceeded
    kind: safety
    summary: The plugin's persistent state would exceed its quota.
    help: >-
      The write failed; nothing was evicted, because evicting the package's other keys to make room would corrupt state to satisfy a limit. Raise the quota deliberately or let the package prune its own store.
  - code: Ono-Sendai-K11402
    name: state.migration_failed
    kind: external
    summary: A plugin state migration did not complete.
    help: >-
      The previous state is intact: a migration must fail without destroying it (spec §31.32). The package stays on its previous version, and rollback is available where the migration was reversible or a checkpoint exists.
  - code: Ono-Sendai-K11501
    name: view.protocol_error
    kind: provider
    summary: The plugin submitted a view tree the host cannot lay out.
    help: >-
      The view was torn down and the terminal restored. A buggy view cannot leave the terminal in raw mode (spec §31.27); if output was redirected, the command's declared non-interactive fallback ran instead.
  - code: Ono-Sendai-K11601
    name: model.provider_unavailable
    kind: provider
    summary: No configured model provider satisfies the request.
    help: >-
      `get model` lists what is configured and what each one's data policy allows. An assistant degrades gracefully when no model is available (spec §31.87); its non-model contributions keep working.
  - code: Ono-Sendai-K11602
    name: model.policy_denied
    kind: safety
    summary: The request carries a data class this provider is not allowed to receive.
    help: >-
      The denied class and the provider's policy are in the error metadata. The request was refused rather than trimmed, so that the boundary stays visible; choose a provider whose policy permits the class, or narrow what the turn is asking about.
  - code: Ono-Sendai-K11603
    name: assistant.tool_invalid
    kind: type
    summary: A tool intent named an unexposed tool, or arguments that do not fit its descriptor.
    help: >-
      Ono validates a model's tool call exactly as it validates a human command plan (spec §31.46). Nothing ran. The attempt is audited, because a model asking for tools it was not given is worth seeing.
  - code: Ono-Sendai-K11604
    name: assistant.context_denied
    kind: permission
    summary: The assistant requested a context source it has not been granted.
    help: >-
      The turn's context summary lists what was included and what was not (spec §31.45). Grant the source deliberately, or accept the narrower answer — an assistant that sees less is not an assistant that is wrong.
  - code: Ono-Sendai-K11701
    name: remote.extension_unavailable
    kind: provider
    summary: The remote agent cannot run the requested extension component.
    help: >-
      The remote host has no compatible agent, no matching component, or policy forbids it. Ono does not copy plugin code to a host merely because a link exists (spec §31.39).
  - code: Ono-Sendai-K11702
    name: remote.policy_denied
    kind: safety
    summary: The remote host's policy denies the capability, whatever the local grant says.
    help: >-
      Effective authority is the intersection of local and remote policy (spec §31.40). A local grant never becomes a remote grant on its own; change the policy on the host that owns the objects.
  - code: Ono-Sendai-K11801
    name: plugin.confinement_failed
    kind: safety
    summary: A mandatory confinement control could not be installed, so the plugin was not started.
    help: >-
      The metadata names the control and carries the operating system's own reason. v0.4.1 §2.3 is why nothing ran: a safety control Ono says it applies before an operation must prevent that operation when it cannot be applied. The package is not quarantined — it never started, so there is nothing to hold (v0.4.1 §18.1).
  - code: Ono-Sendai-K11802
    name: plugin.resource_limit_failed
    kind: safety
    summary: A mandatory resource limit could not be installed, so the plugin was not started.
    help: >-
      The metadata names which limit and the value that was refused. A `setrlimit` refusal is usually a hard ceiling below the requested soft one, which is a configuration question about the shell's own limits rather than about the package (v0.4.1 §59.8).
  - code: Ono-Sendai-K11803
    name: plugin.no_new_privs_failed
    kind: safety
    summary: "`PR_SET_NO_NEW_PRIVS` could not be installed, so the plugin was not started."
    help: >-
      Without it a setuid or file-capability binary the package execs could gain authority the package was never granted, which is the one thing process confinement is for. On a kernel that does not implement the option there is no confined way to run a native package (v0.4.1 §59.7).
  - code: Ono-Sendai-K11901
    name: contribution.refused
    kind: safety
    summary: The contribution declined to act under a safety rule of its own.
    help: >-
      This is the package's rule, not the host's policy and not the external system's answer: a precondition the package requires was not met, so it did nothing. The message is the package's own and names the precondition. `safety.policy_denied` would assert a configured host policy that does not exist, `provider.unavailable` a system that did not answer when it was never asked, and `provider.unsupported` an inability where the package is perfectly able (ADR-0587).
