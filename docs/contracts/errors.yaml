    summary: The state of a remote action could not be established.
    help: >-
      v0.6 §29.3 and Appendix F.2: a link that dropped mid-plan leaves an unknown outcome, and Ono
      MUST NOT mark it failed or successful without evidence. The metadata names the host and the
