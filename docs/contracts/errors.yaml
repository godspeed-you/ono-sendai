    help: >-
      v0.6 §19.4: irreversible actions require an explicit acknowledgement stored in the sealed
      revision. The metadata names each one. Add `--accept-irreversible`, which re-seals the plan.
  - code: Ono-Sendai-E1723
    name: change.risk_not_accepted
    kind: safety
    summary: The plan's risk class requires an acknowledgement that has not been given.
    help: >-
      v0.6 §19.4 and §40.2: HIGH and CRITICAL plans require explicit acknowledgement, and the
      reason is in the metadata rather than behind a generic question. Add `--accept-risk`. A
      script supplies it as policy and never waits for a prompt (§40.3).
  - code: Ono-Sendai-E1724
    name: change.bulk_guard_failed
    kind: safety
    summary: A bulk plan reaches further than its configured guard permits.
    help: >-
      v0.6 §28.3 and §53's `change.bulk` settings: scope is a risk dimension of its own. The
      metadata names the target count and the guard. Narrow the selection, raise the guard
      deliberately, or acknowledge the risk.
  - code: Ono-Sendai-E1725
    name: change.remote_state_unknown
