# Ono-Sendai error registry.
#
# Source: spec §43 (the stable code taxonomy) and spec §16.1 (the error record and its kinds).
# The kind assignments are fixed by ADR-0006 and implemented in `crates/ono-core/src/error.rs`;
# this file and that file MUST agree exactly — `cargo xtask spec-check` compares them.
#
# `code`    the rendered, user-visible identity, spelled as spec §43 spells it.
# `name`    the dotted selector `try`/`catch`, `where` predicates over errors and this registry
#           match on. Stable and machine-readable (ADR-0006).
# `kind`    the broad category scripts branch on. One of the twelve kinds of `kinds` below.
# `summary` one line, what happened.
# `help`    one line, what the user should do about it.
#
# The taxonomy is closed and additive (ADR-0006): a code is never renumbered, never removed and
# never re-pointed at a different meaning. New codes take the next free number in their family.

version: 1

# spec §16.1, extended by ADR-0006 with `safety` and `stream`, which spec §43 needs and §16.1
# omits. See the `Spec deviation` heading of ADR-0006.
kinds:
  - name: resolution
    doc: A name could not be resolved to a command, target or object.
  - name: permission
    doc: The operation is understood but not permitted for this user or context.
  - name: io
    doc: The operating system refused or failed an I/O operation.
  - name: parse
    doc: The input could not be parsed.
  - name: type
    doc: A value, field or unit did not have the required type.
  - name: provider
    doc: A provider could not answer, or answered outside its advertised schema.
  - name: external
    doc: An external process failed or was signalled.
  - name: conflict
    doc: The requested state conflicts with the state that already exists.
  - name: timeout
    doc: The operation did not complete within its budget.
  - name: cancelled
    doc: The operation was cancelled before completing.
  - name: safety
    doc: A safety policy or confirmation requirement stopped the operation (ADR-0006).
  - name: stream
    doc: The operation is not valid for a stream with these properties (ADR-0006).
  - name: resource
    doc: >-
      A resource budget — items retained, bytes retained, values materialized — was reached
      (v0.4.1 §21.4, ADR-0453).

errors:
  # --- parse ------------------------------------------------------------------------------
  - code: Ono-Sendai-E0001
    name: parse.syntax
    kind: parse
    summary: The input is not valid Ono syntax.
    help: >-
      Read the span the diagnostic points at; the construct there cannot become valid however
      much more you type. `help language` lists the syntax of every statement form.
  - code: Ono-Sendai-E0002
    name: parse.incomplete
    kind: parse
    summary: The input ended in the middle of a construct; more text would complete it.
    help: >-
      Close the open string, bracket or block. Interactively the editor keeps the line open; in
      a script the file ended early.

  # --- resolution -------------------------------------------------------------------------
  - code: Ono-Sendai-E0101
    name: resolve.command_not_found
    kind: resolution
    summary: No keyword, function, native command or executable answers to this name.
    help: >-
      Check the suggestions the error carries, or run `help` to browse commands. `explain <name>`
      reports every resolution step that was tried (ADR-0011).
  - code: Ono-Sendai-E0102
    name: resolve.target_not_found
    kind: resolution
    summary: The verb is known but has no such target.
    help: >-
      Run `help <verb>` to list the targets that verb accepts, or `get command` to browse the
      registry.
  - code: Ono-Sendai-E0103
    name: resolve.ambiguous
    kind: resolution
    summary: The name matches more than one candidate and no namespace was given.
    help: >-
      Qualify the name with the namespace of the candidate you meant, for example `ono:get` or
      `dev.example.tool:scan`. The error lists every candidate's qualified name.
  # --- type -------------------------------------------------------------------------------
  - code: Ono-Sendai-E0201
    name: type.mismatch
    kind: type
    summary: A value did not have the type the operation requires.
    help: >-
      `type <expression>` shows what the value actually is. Convert it explicitly rather than
      relying on coercion.
  - code: Ono-Sendai-E0202
    name: type.unknown_field
    kind: type
    summary: A record schema has no such field.
    help: >-
      `type` on the stream shows the schema and its fields. A field that exists but is unknown
      to the provider is `null`, not a missing field (spec §10.5).
  - code: Ono-Sendai-E0203
    name: type.invalid_unit
    kind: type
    summary: A unit was unknown, or two incompatible dimensions were compared.
    help: >-
      Compare like with like: byte sizes with byte sizes, durations with durations. The unit
      suffix must be adjacent to the number, as in `512MiB`, not `512 MiB`.

  # --- io ---------------------------------------------------------------------------------
  - code: Ono-Sendai-E0301
    name: io.not_found
    kind: io
    summary: The path or resource does not exist.
    help: Check the path; `get file <parent>` lists what is actually there.
  - code: Ono-Sendai-E0302
    name: io.permission_denied
    kind: permission
    summary: The operating system refused access to the resource.
    help: >-
      The current user lacks the required permission. Elevate explicitly rather than re-running
      blind; `explain` reports the privilege a command needs before it runs.
  - code: Ono-Sendai-E0303
    name: io.already_exists
    kind: io
    summary: The resource already exists and would have been overwritten.
    help: Choose another destination, or pass the command's explicit overwrite option.
  - code: Ono-Sendai-E0304
    name: io.not_directory
    kind: io
    summary: A path component is not a directory.
    help: One of the leading components of the path is a file; check the path spelling.

  # --- provider ---------------------------------------------------------------------------
  - code: Ono-Sendai-E0401
    name: provider.unavailable
    kind: provider
    summary: The provider cannot answer on this system right now.
    help: >-
      The backing system is absent or not running — no systemd on this host, no container
      runtime socket. `get command <name>` names the provider a command needs.
  - code: Ono-Sendai-E0402
    name: provider.unsupported
    kind: provider
    summary: The provider does not implement this capability.
    help: >-
      Another provider for the same target may support it. The capability matrix generated from
      `docs/contracts/capabilities.yaml` lists which provider answers what.
  - code: Ono-Sendai-E0403
    name: provider.schema_violation
    kind: provider
    summary: A provider emitted a value outside the schema it advertises.
    help: >-
      This is a defect in the provider, not in your pipeline. Report it with the output of
      `inspect` on the offending value.
  # The four below are the truths of `docs/architecture/external-system-provider.md` §8.4, §18.1,
  # §19.1 and §20.1 that the three above could not carry without lying — an external system that
  # answered, and answered *no*, is not `unavailable`; a provider that can do the thing and was
  # refused is not `unsupported`; an empty answer that proves nothing is not an answer (ADR-0592).
  - code: Ono-Sendai-E0404
    name: provider.inconclusive
    kind: provider
    summary: The answer is empty or incomplete, and that establishes nothing about the system.
    help: >-
      The provider looked and did not find, and it is telling you that not finding is not the
      same as absence here — a retention window that may have discarded what you asked about, a
      search that could not reach every scope, a verification that ran out of time. The message
      says what was and was not established. Treat an empty pipeline downstream of this as
      unknown, never as "nothing happened".
  - code: Ono-Sendai-E0405
    name: provider.authentication_failed
    kind: permission
    summary: The external system did not accept the credential the provider presented.
    help: >-
      The credential is absent, expired, revoked or malformed — the remote system said *who are
      you*, not *you may not*. Renew it where it came from: a credential helper's login flow, a
      rotated token, a client certificate that is still valid. Nothing was performed, and this is
      never the same as `provider.authorization_denied`, which is a refusal to a known identity.
  - code: Ono-Sendai-E0406
    name: provider.authorization_denied
    kind: permission
    summary: The external system refused the operation to the identity the provider presented.
    help: >-
      The identity was accepted and the operation was refused to it — `403` and its relatives.
      The operation was not performed. This is data about what you may do, never evidence that
      the target is absent (external-system-provider §18.1); a read refused here is a coverage
      gap, and a write refused here changed nothing.
  - code: Ono-Sendai-E0407
    name: provider.rate_limited
    kind: timeout
    summary: The external system asked the provider to slow down.
    help: >-
      A `429` or its equivalent, with the retry guidance the system gave in the error metadata
      where it gave any. A bounded, idempotent read may already have been retried once within
      its budget before this was reported; a mutation is never replayed on your behalf
      (external-system-provider §20.2, §20.3). Narrow the query or wait.

  # --- external ---------------------------------------------------------------------------
  - code: Ono-Sendai-E0501
    name: external.exit_nonzero
    kind: external
    summary: An external process exited with a non-zero status.
    help: >-
      The status is carried in the error metadata. Use `||` to branch on it, or `try`/`catch` to
      handle it as a value.
  - code: Ono-Sendai-E0502
    name: external.signal
    kind: external
    summary: An external process was terminated by a signal.
    help: >-
      The signal name is carried in the error metadata. A signalled process did not choose its
      exit status, so treat it differently from a non-zero exit.

  # --- remote -----------------------------------------------------------------------------
  - code: Ono-Sendai-E0601
    name: remote.unreachable
    kind: provider
    summary: The remote link could not be established or was lost.
    help: >-
      `test host <name>` probes reachability and reports where the attempt failed. An
      established link that dropped mid-pipeline reports the values it had already delivered.
  - code: Ono-Sendai-E0602
    name: remote.protocol_mismatch
    kind: provider
    summary: The remote peer speaks an incompatible protocol version.
    help: >-
      Upgrade the agent on the remote host, or connect in agentless mode where the local side
      does the work.
  - code: Ono-Sendai-E0603
    name: remote.host_key_changed
    kind: safety
    summary: The remote host presented a different key than the one recorded for it.
    help: >-
      Do not override this because it is inconvenient. Verify the new key out of band, then
      record it deliberately. A changed key is indistinguishable from an interception.
  - code: Ono-Sendai-E0604
    name: remote.identity_permissions
    kind: safety
    summary: The peer identity file is readable or writable by someone other than its owner.
    help: >-
      The file holds the private key that is this machine's identity on a direct link (v0.4.1
      section 8.3). `chmod 600` the path named in the diagnostic. A key another account could
      read is a key another account can impersonate you with, so this is a refusal and not a
      warning; nothing is printed from inside the file.
  - code: Ono-Sendai-E0605
    name: remote.peer_unauthenticated
    kind: safety
    summary: The remote peer did not prove possession of a peer key.
    help: >-
      A direct link is mutually authenticated in v0.4.1 (section 7.1, section 13.3) and never
      retries without a certificate. A peer that speaks the older, one-sided direct protocol is
      refused here; upgrade it, or reach it over `--transport ssh`, where OpenSSH authenticates
      the host instead.

  # --- safety -----------------------------------------------------------------------------
  - code: Ono-Sendai-E0701
    name: safety.confirmation_required
    kind: safety
    summary: The operation needs explicit confirmation that this context cannot ask for.
    help: >-
      Scripts and non-interactive sessions never wait for a TTY (spec §17.4). Re-run
      interactively, or pass the command's explicit confirmation option.
  - code: Ono-Sendai-E0702
    name: safety.policy_denied
    kind: safety
    summary: A configured safety policy forbids the operation.
    help: >-
      `get config safety.*` shows the policy and the layer that set it. Config mode denies
      external execution, network access and plugin load by design (ADR-0010).

  # --- stream -----------------------------------------------------------------------------
  - code: Ono-Sendai-E0801
    name: stream.unbounded_operation
    kind: stream
    summary: The operation requires bounded input but the stream is unbounded.
    help: >-
      `sort`, `group`, `count` and `measure` need a finite input. Bound the stream first with
      `take <n>` or a window.
  - code: Ono-Sendai-E0802
    name: stream.cancelled
    kind: cancelled
    summary: The stream was cancelled before it completed.
    help: >-
      Cancellation propagates through native pipelines and becomes a signal for external
      processes (spec §18.5). Values already delivered remain valid.
  - code: Ono-Sendai-E0803
    name: stream.backpressure_timeout
    kind: timeout
    summary: A consumer did not accept values within the configured budget.
    help: >-
      The slow stage is named in the error metadata. Raise the budget, or insert a bounded stage
      such as `take` ahead of the consumer.

  # --- adapter (spec v0.3 §1.65, ADR-0053) -------------------------------------------------
  - code: Ono-Sendai-E0901
    name: adapter.not_available
    kind: resolution
    summary: No adapter answers to this invocation, and structured output was required.
    help: >-
      Only an explicit structured demand raises this (`adapt …`, or a pipeline whose consumer
      needs objects). Drop the demand to run the program raw, or decode its output yourself with
      `from json`; `explain` names the adapters that were considered.
  - code: Ono-Sendai-E0902
    name: adapter.disabled
    kind: permission
    summary: An adapter exists for this invocation but is switched off in this context.
    help: >-
      The error metadata names the adapter and the setting that disabled it. The raw program is
      still one `raw` away.
  - code: Ono-Sendai-E0903
    name: adapter.unsupported_invocation
    kind: provider
    summary: The adapter knows the executable but not this combination of options.
    help: >-
      `help adapter <id>` lists the invocations the adapter supports. Where the pipeline did not
      require structure the program already ran raw; the metadata says whether it did.
  - code: Ono-Sendai-E0904
    name: adapter.version_incompatible
    kind: provider
    summary: The executable's version is outside the range the adapter was tested with.
    help: >-
      The metadata carries the version found and the range supported. A machine-format adapter
      may still work — `adapt` forces it — but a version-constrained parser refuses by design
      (spec v0.3 §1.46).
  - code: Ono-Sendai-E0905
    name: adapter.executable_mismatch
    kind: resolution
    summary: The executable that resolved is not the one the adapter's contract names.
    help: >-
      A program earlier on PATH shadows the one the adapter was written for; `explain` shows the
      path that resolved. The program ran raw, or will if you drop the structured demand.
  - code: Ono-Sendai-E0906
    name: adapter.rewrite_failed
    kind: provider
    summary: The adapter could not turn the invocation into its machine-oriented form.
    help: >-
      This is an adapter defect; the metadata names the adapter and its version so it can be
      reported. `raw <command>` runs the program as typed.
  - code: Ono-Sendai-E0907
    name: adapter.decode_failed
    kind: provider
    summary: The executable's output was not what the adapter's decoder expects.
    help: >-
      The raw bytes are kept in the error metadata and nothing was fabricated. Check the
      executable's version against the adapter's range, and run the program `raw` to see its
      output as it is.
  - code: Ono-Sendai-E0908
    name: adapter.schema_violation
    kind: provider
    summary: The adapter decoded a value outside the schema it advertises.
    help: >-
      The offending field and the schema are in the metadata. This is an adapter defect; report
      it with the executable version, and use the raw program meanwhile.
  - code: Ono-Sendai-E0909
    name: adapter.capability_denied
    kind: permission
    summary: The adapter's package is not allowed to run this executable.
    help: >-
      `process.exec` grants a package exactly the executables its manifest declares
      (spec v0.3 §1.22). `get plugin` shows the grant; the raw program is unaffected.
  - code: Ono-Sendai-E0910
    name: adapter.conflict
    kind: conflict
    summary: More than one adapter claims the invocation and the resolution rules cannot separate them.
    help: >-
      The metadata lists the candidates. Prefer one in the adapter configuration, or disable
      the other; until then the program runs raw.
  - code: Ono-Sendai-E0911
    name: adapter.required_for_structured_pipeline
    kind: type
    summary: A consumer demanded objects and no adapter can provide them for this invocation.
    help: >-
      A stage declared over objects is never handed the bytes a program wrote, and a forced
      structured invocation never downgrades to text (spec §12.3, spec v0.3 §1.18). Run the
      program raw, decode the output yourself (`| from json`), or drop the structured consumer.

  # --- spatial (spec v0.4 §40, ADR-0125) ---------------------------------------------------
  - code: Ono-Sendai-E1001
    name: spatial.not_found
    kind: resolution
    summary: No place, object or alias answers to this spatial selector.
    help: >-
      `look` lists the exits of where you stand and `near` lists what is adjacent to it; both
      answer without a name being known in advance (spec v0.4 §9). `find place <text>` searches
      the index across domains.
  - code: Ono-Sendai-E1002
    name: spatial.ambiguous_selector
    kind: resolution
    summary: More than one place answers to this selector and none of them is the obvious one.
    help: >-
      The error metadata lists the candidates. Narrow the selector — `follow socket :443` rather
      than `follow socket` — or use `near <relation>` to stand where all of them are visible. A
      script never gets a picker: ambiguity is deterministic and fails (spec v0.4 §29.3).
  - code: Ono-Sendai-E1003
    name: spatial.not_enterable
    kind: type
    summary: This object exists but is not a place you can stand in.
    help: >-
      `enter` moves into a place; the registry's `enterable` flag says which object types are
      one (spec v0.4 §41.1). Read the object with `get`/`inspect` instead, or enter the
      collection that contains it.
  - code: Ono-Sendai-E1004
    name: spatial.no_relation
    kind: resolution
    summary: No relation of that name leaves this place.
    help: >-
      `look` names the exits this place has, and `docs/contracts/spatial/relations.yaml` is the whole
      vocabulary (spec v0.4 §41.2). A relation that exists but has no neighbour here answers
      `spatial.not_found` instead — the name was understood.
  - code: Ono-Sendai-E1005
    name: spatial.no_parent
    kind: resolution
    summary: This place has no canonical parent, so `up` has nowhere to go.
    help: >-
      `up` follows the canonical hierarchy and the root is its top (spec v0.4 §6.6, §11.1). Use
      `back` to retrace the trail you actually took, or `home` to return to the root.
  - code: Ono-Sendai-E1006
    name: spatial.history_empty
    kind: conflict
    summary: The navigation trail holds no earlier place to return to.
    help: >-
      `back` retraces the trail of this session, which starts empty and is not persisted across
      sessions (spec v0.4 §46.1). `trail` shows what it holds; `up` moves by hierarchy instead
      of by history.
  - code: Ono-Sendai-E1007
    name: spatial.destination_gone
    kind: resolution
    summary: The place the trail or pin points at no longer exists.
    help: >-
      The metadata carries the tombstone — when the object went away, and the replacement
      candidate where one can be identified (spec v0.4 §10.3, §20.3). The trail record is kept;
      `back` again skips to the nearest place that still exists.
  - code: Ono-Sendai-E1008
    name: spatial.permission_denied
    kind: permission
    summary: This user may not see the objects or relations behind this place.
    help: >-
      Denied is not empty: the group stays visible with its state so the boundary is legible
      (spec v0.4 §35.2). Spatial navigation never escalates privilege on its own; run the
      inspection deliberately as a user who may read it.
  - code: Ono-Sendai-E1009
    name: spatial.unsupported
    kind: provider
    summary: No installed provider can answer for this place, relation or domain.
    help: >-
      An unavailable domain stays visible and says why rather than disappearing (spec v0.4 §4).
      `get provider` lists what this build can answer; a KUANG/11 package may contribute the
      missing objects.
  - code: Ono-Sendai-E1010
    name: spatial.stale
    kind: provider
    summary: The index's answer is older than this operation is allowed to accept.
    help: >-
      The index is a cache and providers remain the truth (spec v0.4 §33.2). The metadata says
      when the object was last observed; re-run the command to revalidate, and note that a
      mutation always revalidates its target before it acts.
  - code: Ono-Sendai-E1011
    name: spatial.remote_unavailable
    kind: provider
    summary: The remote host this place belongs to cannot be reached.
    help: >-
      A remote root is an explicit space and crossing to it is never implicit (spec v0.4 §19,
      §35.4). `get link` shows the links this session holds; `link host <name>` establishes one
      deliberately.
  - code: Ono-Sendai-E1012
    name: spatial.scope_violation
    kind: permission
    summary: The movement would cross a scope boundary this session may not cross.
    help: >-
      Host, container, namespace and mount boundaries are visible on purpose (spec v0.4 §2.18,
      §35.4). `trail` shows the boundary that was refused; enter the scope explicitly instead of
      reaching through it.
  - code: Ono-Sendai-E1013
    name: spatial.map_too_large
    kind: stream
    summary: The requested map exceeds its node budget and cannot be drawn honestly.
    help: >-
      A map clusters rather than truncates arbitrarily (spec v0.4 §8.2), and refuses when even
      clustering would not fit. Narrow the scope, lower the zoom level, or raise
      `spatial.map.node_budget`.
  - code: Ono-Sendai-E1014
    name: spatial.identity_conflict
    kind: conflict
    summary: Two observations claim to be the same object and their identities disagree.
    help: >-
      Reconciliation refuses rather than merging two objects into one place (spec v0.4 §37.1,
      §42.1). The metadata names both identities and the providers that asserted them; this is a
      provider defect worth reporting.

  # --- spatial cost model (v0.4.1 §33.3, §34.1, ADR-0494) -----------------------------------
  - code: Ono-Sendai-E1401
    name: spatial.cost_refused
    kind: resource
    summary: The planner estimated this query beyond the interactive budget and refused it.
    help: >-
      v0.4.1 §33.3: a query the planner predicts beyond the supported interactive budget is
      refused or answered at a bounded lower detail, rather than left to look hung. The message
      names the estimate and the number of candidates it was made over (§34.1), so the refusal
      can be acted on. Narrow the place, lower the depth, or ask for the expensive relation
      explicitly — §34.3 requires that path to exist.

  # --- resource budgets (v0.4.1 §21.4, §53.1, ADR-0453) ------------------------------------
  - code: Ono-Sendai-E1101
    name: resource.item_limit
    kind: resource
    summary: An operation reached the number of values it is allowed to retain.
    help: >-
      The metadata names the stage that enforced the ceiling, the configured limit and the
      consumption that crossed it — never the retained values, because a resource error that
      prints its payload is a second resource problem (v0.4.1 §21.4, §53.3). Narrow the input,
      or raise `limits.materialize_items` deliberately.
  - code: Ono-Sendai-E1102
    name: resource.byte_limit
    kind: resource
    summary: An operation reached the number of bytes it is allowed to retain.
    help: >-
      Bytes are counted with the deterministic approximate estimator of §21.2, so the figure is
      a logical payload size rather than resident memory. Narrow the input, or raise
      `limits.materialize_bytes` deliberately.
  - code: Ono-Sendai-E1103
    name: resource.materialization_limit
    kind: resource
    summary: An operation that must see its whole input may not materialize this input.
    help: >-
      The refusal is about the input as a whole rather than about a count that was reached: the
      stage requires finite input, or its budget admits nothing at all (v0.4.1 §22.2, §22.3).
      Bound the upstream before the stage that needs it whole.

  # --- server-side client authorization (v0.4.1 §9, §10.4, §53.1, ADR-0466) ----------------
  - code: Ono-Sendai-E1201
    name: remote.unauthenticated
    kind: safety
    summary: The connecting client proved possession of no key, so there is no identity to authorize.
    help: >-
      A direct link is mutually authenticated (v0.4.1 section 7.1). The listening agent has no
      mode that accepts a client without a certificate, and authorization cannot begin without an
      authenticated identity (section 2.2). Connect with an `ono` that presents a peer identity.
  - code: Ono-Sendai-E1202
    name: remote.unauthorized
    kind: safety
    summary: The client is authenticated but is not listed in the agent's authorization store.
    help: >-
      Holding a private key proves who you are, never that the operator wants you here (v0.4.1
      section 9.1). On the agent's host, `add client-key <fingerprint>` authorizes the client to
      observe; the diagnostic carries the fingerprint to add and whether a store exists at all.
  - code: Ono-Sendai-E1203
    name: remote.capability_denied
    kind: safety
    summary: The client is authorized, but not for the capability this request needs.
    help: >-
      Grants name exact capability ids and never patterns (v0.4.1 section 9.5). The metadata says
      whether observe access is off or the action capability is absent; `set client-key
      <fingerprint> --allow <capability>` on the agent's host grants exactly the one named.
  - code: Ono-Sendai-E1204
    name: remote.authorization_store_invalid
    kind: safety
    summary: The authorization store could not be loaded, so nothing is authorized.
    help: >-
      A malformed store is never read as an empty one and never falls back to permissive access
      (v0.4.1 section 9.2, section 59.5). The diagnostic names the file and the line; repair that
      line, or remove the file to authorize nobody deliberately.

  # --- listening-agent resource limits (v0.4.1 §12, §53.1, ADR-0502) -----------------------
  - code: Ono-Sendai-E1501
    name: remote.connection_limit
    kind: resource
    summary: The listening agent is already holding as many connections as it may.
    help: >-
      A listening agent has a hard ceiling on concurrent connections and a second one per
      authenticated client key (v0.4.1 section 12.1, section 12.3). The metadata names which of
      the two was reached and the figure it was set to. The refusal is retryable: a slot is
      released whenever a session ends. `limits.remote_connections` and
      `limits.remote_connections_per_client` configure the two ceilings on the agent's host.
  - code: Ono-Sendai-E1502
    name: remote.handshake_timeout
    kind: timeout
    summary: The peer did not complete TLS and Ono negotiation within the time a handshake is given.
    help: >-
      A peer that opens a connection and then says nothing holds a slot in the agent's
      pre-negotiation ceiling for free, so the handshake has a deadline (v0.4.1 section 12.2).
      Ten seconds by default, configured on the agent's host with
      `limits.remote_handshake_timeout_ms`. A link dropped this way is worth retrying: nothing
      about the client was refused.

  # --- plugin references: names, catalogs and releases (K11P §10, §11, §24.1; ADR-0601, ADR-0605)
  - code: Ono-Sendai-E1601
    name: plugin.not_found
    kind: resolution
    summary: No installed package and no catalog entry answers to the plugin reference.
    help: >-
      `find plugin <word>` searches the installed set and every catalog; `get plugin` lists what is
      installed. A short name is the package's `name`, a canonical id its reverse-DNS `id`, and
      `./dir` or `path:<dir>` an explicit local package (K11P section 4.1).
  - code: Ono-Sendai-E1602
    name: plugin.reference_ambiguous
    kind: resolution
    summary: The short name resolves to more than one canonical package.
    help: >-
      The metadata lists every candidate as a canonical id and a `<catalog>/<name>` selector.
      Name one of those; nothing is chosen by catalog order or by publisher (K11P section 10.3).
  - code: Ono-Sendai-E1603
    name: plugin.catalog_unavailable
    kind: resolution
    summary: The catalog names the release and its artifact is not available to this build.
    help: >-
      This build fetches nothing over the network. Place the unpacked package under one of the
      local package sources the metadata names, or install it from an explicit path with
      `install plugin path:<dir>` (ADR-0601 section 3).
  - code: Ono-Sendai-E1604
    name: plugin.release_not_compatible
    kind: conflict
    summary: No release of the package the catalog offers can run on this host.
    help: >-
      Every release was excluded by its `platforms` or its `kuang_api` range; the metadata says
      which. A package version is never installed to be found incompatible at load.
  - code: Ono-Sendai-E1605
    name: plugin.source_conflict
    kind: conflict
    summary: Two acquisition sources offer the same package version with different content.
    help: >-
      The same canonical id and version hash differently in two places, which is a supply-chain
      conflict nothing resolves by order (K11A section 19.2). The metadata lists every source
      with its digest and signer; choose one deliberately with `--source`, or remove the copy that
      is wrong.
  - code: Ono-Sendai-E1606
    name: plugin.transport_refused
    kind: safety
    summary: A plugin artifact would travel over a transport policy does not allow.
    help: >-
      A catalog artifact is fetched over HTTPS. Plain `http://` is allowed only by an operator
      catalog that declares `insecure_http: true`, and then the digest and the package signature
      are still checked (K11A section 6.3).
  - code: Ono-Sendai-E1607
    name: plugin.source_root_rejected
    kind: safety
    summary: A system source root is not read-only to ordinary users and was not searched.
    help: >-
      A system source is owned by the package manager and writable by nobody else (K11A section
      16.1); a root writable by its group or by everyone, or owned by another user, could hold
      anything and is set aside with this warning rather than searched.

  # --- temporal (v0.5 §34, ADR-0610) --------------------------------------------------------
  #
  # v0.5 §34 numbers this family E1101–E1114. Those three lowest numbers are the resource family
  # of v0.4.1 §21.4, shipped and matched on by scripts, and the taxonomy above forbids
  # re-pointing a code. ADR-0610 keeps every name §34 fixes and opens E13, the lowest free
  # block: a reader holding §34 open adds two hundred to each row.
  #
  # Unknown cause has no code. §16.7 makes `cause: null` a successful explanation carrying its
  # evidence, its correlations and its gaps, and an error would turn honesty into a failure.
  - code: Ono-Sendai-E1301
    name: temporal.invalid_time
    kind: parse
    summary: Time selector cannot resolve unambiguously.
    help: >-
      A selector is an instant (`2026-08-31T12:17:00+02:00`), a local date and time, a time
      today, a relative past duration (`-10m`) or an event (`event @e42`) — v0.5 §4.4. A future
      instant is not a historical coordinate. A local wall time inside a daylight-saving fold
      exists twice and needs the offset that picks one; the metadata names both instants.
  - code: Ono-Sendai-E1302
    name: temporal.not_recorded
    kind: resolution
    summary: No evidence source covers the requested time or scope.
    help: >-
      History is what a source observed, never what the question implies (v0.5 §1.3). The
      metadata lists every source that was asked and how far back each reaches, so the answer
      says what would have to change. `start recorder` begins retaining local history; it does
      not create history that was never observed.
  - code: Ono-Sendai-E1303
    name: temporal.out_of_retention
    kind: resolution
    summary: Requested history is known to have expired.
    help: >-
      This is a stronger statement than `temporal.not_recorded`: the ledger held this interval
      and retention removed it (v0.5 §10.4). The metadata names the earliest instant still
      retained. Raising `temporal.retention.max_age` bounds future history and resurrects none.
  - code: Ono-Sendai-E1304
    name: temporal.read_only
    kind: safety
    summary: Mutation attempted while the session observes historical state.
    help: >-
      The past is read-only (v0.5 §2, §4.7), and that covers native mutations, KUANG/11 mutation
      tools and remote mutations alike. Nothing was changed. `now` returns to the present, where
      the command is available again.
  - code: Ono-Sendai-E1305
    name: temporal.present_only
    kind: safety
    summary: An operation bound to the present was attempted in historical context.
    help: >-
      An arbitrary external program executes against the machine as it is now, whatever the
      session's temporal coordinate says, so it does not run by accident from the past (v0.5
      §4.8). `present <command...>` runs it in the real current environment and leaves the
      historical coordinate where it was.
  - code: Ono-Sendai-E1306
    name: temporal.ambiguous_event
    kind: resolution
    summary: A query resolves to more than one equally valid event.
    help: >-
      The metadata lists every candidate as an event reference. Name one — `why event @e42` —
      rather than letting an order nobody chose decide (v0.5 §16.3). A script never gets a
      picker.
  - code: Ono-Sendai-E1307
    name: temporal.store_unavailable
    kind: io
    summary: The persistent temporal store cannot be accessed.
    help: >-
      The shell keeps working: the store holds retained history, and nothing else depends on it
      (v0.5 §31.7). The metadata names the path and the reason. Session-lifetime temporal
      features continue from the in-memory ledger.
  - code: Ono-Sendai-E1308
    name: temporal.store_corrupt
    kind: io
    summary: Ledger integrity failure detected.
    help: >-
      Affected history is refused rather than presented as valid, and the interval it covered
      becomes a visible coverage gap (v0.5 §31.7). The metadata names the segment. `remove
      temporal-history` discards the store deliberately; the shell needs no repair to run.
  - code: Ono-Sendai-E1309
    name: temporal.permission_denied
    kind: permission
    summary: History or evidence exists and is not accessible to this session.
    help: >-
      Recording never raises privilege (v0.5 §2, §10.5), so a history this user could not have
      observed is one they cannot read either. This is distinct from `temporal.not_recorded`:
      the evidence is there and the answer is no.
  - code: Ono-Sendai-E1310
    name: temporal.unsupported_source
    kind: provider
    summary: The source cannot provide the requested temporal capability.
    help: >-
      A provider advertises what it can answer about the past (v0.5 §21.1), and a snapshot
      source is not a historical one. `inspect provider <id>` lists the temporal capabilities it
      declares.
  - code: Ono-Sendai-E1311
    name: temporal.coverage_gap
    kind: provider
    summary: The operation requires an interval with a material unsupported gap.
    help: >-
      Partial coverage is normally a successful answer that says how partial it is (v0.5 §34);
      this code is raised only where the operation asked for completeness it cannot have. The
      metadata names the gap, its interval and why it exists.
  - code: Ono-Sendai-E1312
    name: temporal.clock_uncertain
    kind: provider
    summary: The requested strict ordering cannot be established from the evidence.
    help: >-
      Two events in different clock domains are ordered by shared sequence, transaction or
      causal evidence, never by wall clocks that differ by milliseconds (v0.5 §24.3, §26). They
      remain potentially concurrent, and the timeline may still display them in a stable order
      that claims nothing.
  - code: Ono-Sendai-E1313
    name: temporal.recorder_not_running
    kind: conflict
    summary: The operation requires a running recorder.
    help: >-
      Persistent recording is opt-in and off by default (v0.5 §2, §10.2). `start recorder`
      begins it; `get recorder` reports its state, its retention and where it writes.
  - code: Ono-Sendai-E1314
    name: temporal.recorder_already_running
    kind: conflict
    summary: A start was requested while the recorder is already active.
    help: >-
      `start recorder` is idempotent and answers with the running recorder (v0.5 §10.8); this
      code is raised only where the request carried settings the running recorder is not using,
      so that a silently ignored change is impossible. `stop recorder` then `start recorder`
      applies them.

  # --- prospective change, v0.6 §45 ------------------------------------------------------
  #
  # The three groups of §45, at the numbers ADR-0801 allocated: E17 for the plan, E18 for the
  # way back, E19 for the guarantee §27 reserves. Every `help` says what was *not* changed,
  # because a refusal in this family is nearly always a refusal to touch the system at all.
  - code: Ono-Sendai-E1701
    name: change.plan_not_sealed
    kind: conflict
    summary: A plan that is not sealed was given to a command that acts on one.
    help: >-
      Only a sealed plan can be applied (v0.6 §4.4, §5.6). `plan` seals what it builds; a draft
      reached by editing an earlier revision is sealed again by re-planning it. Nothing was
      changed.
  - code: Ono-Sendai-E1702
    name: change.plan_sealed
    kind: conflict
    summary: A sealed plan cannot be edited.
    help: >-
      A sealed plan is immutable (v0.6 §4.4). `rebase plan <id>` opens a new revision against
      current state and leaves the sealed one exactly as it is (§7.5).
  - code: Ono-Sendai-E1703
    name: change.plan_expired
    kind: conflict
    summary: The sealed plan's validity window has closed.
    help: >-
      v0.6 §5.6: `apply` refuses an expired plan, because its targets were frozen against a world
      that has had time to move. `rebase plan <id>` resolves it again.
  - code: Ono-Sendai-E1704
    name: change.plan_already_applying
    kind: conflict
    summary: Another session is applying this plan.
    help: >-
      v0.6 §42.4: the plan store prevents two sessions from applying one sealed plan at once. The
      metadata names the holder and when the claim was taken. Nothing was changed here.
  - code: Ono-Sendai-E1705
    name: change.plan_drift_detected
    kind: conflict
    summary: A precondition the plan froze no longer holds.
    help: >-
      v0.6 §7.3: material drift stops execution before anything is prepared or mutated. The
      metadata names each fact that moved, what was expected and what was found. `rebase
      plan/<id>` creates a new revision against the world as it is now.
  - code: Ono-Sendai-E1706
    name: change.plan_not_found
    kind: resolution
    summary: No plan matches the reference.
    help: >-
      v0.6 §36.4: a plan is referenced by its identity or an unambiguous prefix of it. `get plan`
      lists what the store holds, with the shortest reference that resolves.
  - code: Ono-Sendai-E1707
    name: change.plan_reference_ambiguous
    kind: resolution
    summary: The reference matches more than one plan.
    help: >-
      v0.6 §36.4: a reference is a prefix, and a prefix that matches two plans names neither. The
      metadata lists the candidates with the width that tells them apart.
  - code: Ono-Sendai-E1708
    name: change.plan_state_invalid
    kind: conflict
    summary: The lifecycle transition is not one v0.6 §4.1 draws.
    help: >-
      v0.6 §4.1 is a state machine, not a set of labels. The metadata names the state the plan is
      in and the transition that was attempted.
  - code: Ono-Sendai-E1709
    name: change.plan_store_unavailable
    kind: io
    summary: The plan store cannot be accessed.
    help: >-
      v0.6 §36.1 persists sealed plans so they survive shell exit. The metadata names the path and
      the underlying failure. No plan was created, changed or applied.
  - code: Ono-Sendai-E1710
    name: change.plan_store_corrupt
    kind: io
    summary: The plan store failed its integrity check.
    help: >-
      v0.6 §36.2: the store is versioned and checked on open. A store this build cannot read is
      refused rather than migrated downwards, so nothing overwrites a newer schema.
  - code: Ono-Sendai-E1711
    name: change.target_unresolved
    kind: resolution
    summary: A selector did not resolve to a concrete object.
    help: >-
      v0.6 §4.3 freezes identities, not selectors, so a selector matching nothing cannot become a
      plan. The metadata names the selector and the provider that was asked.
  - code: Ono-Sendai-E1712
    name: change.target_changed
    kind: conflict
    summary: A frozen target is no longer the object the plan resolved.
    help: >-
      v0.6 §7.1 and §55.2 case 7: identity includes generation, inode or unit identity, so a
      replaced object is a different object. `rebase plan <id>` resolves against what is there
      now.
  - code: Ono-Sendai-E1713
    name: change.action_not_plannable
    kind: provider
    summary: The operation has no provider contract v0.6 can plan from.
    help: >-
      v0.6 §6.1: an operation is plannable only where a contract declares its target schema,
      mutation semantics, capabilities, preconditions, effects, execution method, idempotency
      class, recovery semantics and verification options. The metadata names what is missing.
  - code: Ono-Sendai-E1714
    name: change.opaque_action_forbidden
    kind: safety
    summary: An opaque external command cannot be planned by default.
    help: >-
      v0.6 §6.2: Ono cannot reason about the target scope or side effects of an arbitrary command,
      so it does not pretend to. §6.3's `opaque action` entry exists for the case where an
      operator accepts that, and it classifies impact and reversibility as unknown.
  - code: Ono-Sendai-E1715
    name: change.historical_context_read_only
    kind: safety
    summary: A plan for application cannot be resolved against historical state.
    help: >-
      v0.6 §6.4: historical state can be inspected but not used as the executable target base.
      `now` returns to the present, where the plan resolves against the world it would change.
  - code: Ono-Sendai-E1716
    name: change.precondition_failed
    kind: conflict
    summary: A declared precondition of an action did not hold.
    help: >-
      v0.6 §7.2: each action declares the facts sufficient to detect material drift. The metadata
      names the action, the fact, what was expected and what was found.
  - code: Ono-Sendai-E1717
    name: change.prepare_failed
    kind: provider
    summary: Preparation failed, and no mutating action ran.
    help: >-
      v0.6 §2.3 and §4.5: if a required recovery asset cannot be created, mutation MUST NOT begin.
