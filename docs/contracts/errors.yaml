      it, which are retained until a cleanup decision is made (Appendix F.1).
  - code: Ono-Sendai-E1718
    name: change.apply_failed
    kind: provider
    summary: A mutating action failed.
    help: >-
      v0.6 §4.7 and Appendix F: what ran, ran. The metadata names the failed action, the actions
