# The providers that ask beyond the local kernel: the C library's resolver, and the network
# itself. See linux-procfs.yaml for what this registry is and what enforces it.

providers:
  - id: linux.resolver
    doc: >-
      Names and addresses, through the C library's resolver (getaddrinfo / getnameinfo) — NSS,
      so /etc/hosts, DNS, mDNS and LDAP all answer, exactly as they do for every other program.
    targets: [dns]
    capabilities: [dns.resolve]
    schemas: [ono.dns-record/1]
    conformance:
      dns: selector_required
    temporal:
      # A resolution is an observation made when it was asked for, and the answer may differ the
      # next time. There is nothing here to keep and nothing to check against a past instant.
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: false
      retained_history: null
      coverage: snapshot

  - id: ono.probe
    doc: >-
      Reachability probes: the shell itself connects to a host and port and reports what it
      found, with timing. A refused or silent port is the answer, not an error.
    targets: [port]
    capabilities: [port.probe]
    schemas: [ono.probe-result/1]
    conformance:
      port: selector_required
    temporal:
      # A probe is a point sample by construction: it says what one connection attempt found at one
      # instant, and §8.4's `point_sample` is what its coverage becomes in the ledger.
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: false
      retained_history: null
      coverage: snapshot
