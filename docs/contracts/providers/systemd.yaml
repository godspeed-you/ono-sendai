# The provider that answers over D-Bus from systemd. Registered even when systemd cannot be
# reached: unavailability with a reason is a different answer from "there are no services"
# (spec §35.3). See linux-procfs.yaml for what this registry is and what enforces it.

providers:
  - id: systemd
    doc: Services, from org.freedesktop.systemd1 over D-Bus.
    targets: [service]
    capabilities: [service.list, service.manage]
    schemas: [ono.service/1]
    conformance:
      service: enumerable
    temporal:
      # §22.2: the systemd provider "SHOULD contribute live unit state transitions and job identity
      # where available". Job identity is here — `StartUnit` and its siblings answer with the job's
      # object path, and `Unit.Job` names a job in flight — and that is a causal token in the sense
      # of §21.6 and the evidence §15.2 admits for `caused_by`. Live transitions are not: this
      # provider reads unit state on demand and the runtime polls it, so `live_events` stays false
      # until it subscribes to `PropertiesChanged` (§21.5).
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: true
      checkpointable: true
      retained_history: null
      coverage: snapshot
    spatial:
      # §13: "A service place represents the stable service-manager concept rather than a
      # single process lifetime." The unit name is that concept, and it survives every
      # restart of the processes below it (§10.1 Tier A, §44.7).
      identity_strategy: stable
      canonical_parent:
        Service: [compute.services]
      relationships:
        - service.controls_process
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: normal
      landmark_metrics: [state, substate, since, enabled]

  - id: systemd-journal
    doc: >-
      The journal and the log, from `journalctl --output=json` through the decoder of the
      systemd adapter pack (ADR-0085). Registered even where no `journalctl` is on PATH or no
      journal files exist: that is `provider.unavailable` with the reason, not an empty journal.
    targets: [journal, log]
    capabilities: [log.read]
    schemas: [ono.journal-event/1, ono.log-record/1]
    conformance:
      journal: unbounded
      log: unbounded
    temporal:
      # §22.3: the journal is the one source in this tree that genuinely answers about the past.
      # `--since` and `--until` reach events recorded before anything asked for them, which is a
      # `historical_query` and nothing weaker. It is still not exhaustive: journald rate-limits, a
      # volatile journal is lost at reboot, and a rotated one is gone — so no absence claim rests on
      # it (§21.5). Its retention is `journald.conf`'s to state and this provider does not read it,
      # so the bound is null rather than a guess.
      current_snapshot: true
      live_events: false
      historical_query: true
      exhaustive_events: false
      causal_tokens: false
      # A journal is a stream of what happened, never a snapshot of object state, so there is
      # nothing here to serialise into a checkpoint (§21.7).
      checkpointable: false
      retained_history: null
      coverage: historical_query

  - id: systemd-logind
    doc: >-
      Login sessions, from org.freedesktop.login1 over D-Bus (ADR-0100). Registered even when no
      login manager answers: that is `provider.unavailable` with the reason, not "no sessions".
    targets: [session]
    capabilities: [session.list]
    schemas: [ono.session/1]
    conformance:
      session: enumerable
    temporal:
      # logind answers about the logins that exist now. A login that ended leaves nothing here; the
      # journal is where its record is, under another provider.
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      coverage: snapshot
    spatial:
      identity_strategy: lifetime
      canonical_parent:
        Session: [identity.sessions]
      relationships: []
      freshness: on_demand
      events: false
      permissions: [available, empty, unsupported]
      cost_class: normal
      landmark_metrics: [state, since]
