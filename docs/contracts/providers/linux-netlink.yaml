# The providers that answer from netlink sockets — structured kernel answers, never parsed tool
# output (spec §50). See linux-procfs.yaml for what this registry is and what enforces it.

providers:
  - id: linux.netlink
    doc: >-
      Network interfaces, from rtnetlink (RTM_GETLINK / RTM_GETADDR); configured through
      RTM_NEWLINK / RTM_DELLINK / RTM_NEWADDR / RTM_DELADDR, which need CAP_NET_ADMIN.
    targets: [interface]
    capabilities: [interface.list, interface.set]
    schemas: [ono.interface/1]
    conformance:
      interface: enumerable
    temporal:
      # §22.4: netlink is live evidence for interface and address changes, and this provider does
      # subscribe — `RTMGRP_LINK` plus the IPv4 and IPv6 address groups. A netlink socket still
      # drops messages when its receive buffer overruns, and the kernel says so with `ENOBUFS`
      # rather than replaying them, so the stream cannot carry an absence claim (§21.5).
      current_snapshot: true
      live_events: true
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      coverage: event_stream
    spatial:
      identity_strategy: stable
      canonical_parent:
        Interface: [network.interfaces]
      relationships:
        - interface.has_address
        - route.via_interface
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [state, rx_bytes, tx_bytes, mtu]

  - id: linux.netlink
    doc: >-
      Routes, from rtnetlink (RTM_GETROUTE); changed through RTM_NEWROUTE / RTM_DELROUTE,
      which need CAP_NET_ADMIN.
    targets: [route]
    capabilities: [route.list, route.set]
    schemas: [ono.route/1]
    conformance:
      route: enumerable
    temporal:
      # The route groups of §22.4, subscribed the same way and bounded by the same overrun.
      current_snapshot: true
      live_events: true
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      coverage: event_stream
    spatial:
      # A route is identified by the tuple it carries; delete it and add it again and it is a
      # new route with the same shape (§10.1 Tier B).
      identity_strategy: lifetime
      canonical_parent:
        Route: [network.routes]
      relationships:
        - route.via_interface
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [metric, protocol, type]

  - id: linux.netlink
    doc: Neighbors, from rtnetlink (RTM_GETNEIGH).
    targets: [neighbor]
    capabilities: [neighbor.list]
    schemas: [ono.neighbor/1]
    conformance:
      neighbor: enumerable
    temporal:
      # §22.4 lists neighbour changes among what netlink *can* provide live. This provider reads
      # the table and does not subscribe to `RTMGRP_NEIGH`, so it claims a snapshot and no more:
      # a capability the kernel offers and the code does not use is not a capability (§21.1).
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      coverage: snapshot
    spatial:
      identity_strategy: lifetime
      canonical_parent:
        Neighbor: [network.neighbors]
      relationships: []
      freshness: on_demand
      events: false
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [state, updated]

  - id: linux.sock-diag
    doc: >-
      Sockets and connections, from sock_diag; endpoints are ono.endpoint/1 records. A socket
      is closed through SOCK_DESTROY, which needs CAP_NET_ADMIN.
    targets: [socket, connection]
    capabilities: [socket.list, connection.list, socket.close]
    schemas: [ono.socket/1, ono.endpoint/1]
    conformance:
      socket: enumerable
      connection: enumerable
    temporal:
      # §22.4: "Socket connection history is not automatically exhaustive merely because netlink is
      # used elsewhere." sock_diag dumps the sockets that exist at the moment of the dump; a
      # connection that opened and closed between two dumps was never visible to it.
      current_snapshot: true
      live_events: false
      historical_query: false
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      coverage: snapshot
    spatial:
      # A socket inode is reused after the socket closes, so the identity lasts exactly as
      # long as the socket does (§10.1 Tier B).
      identity_strategy: lifetime
      # §6.6: `up` from a socket reaches "the canonical parent of the socket in the currently
      # active map projection, normally `NETWORK/SOCKETS`, not necessarily to the process" — so
      # the chain is the network collection alone, and the owning process stays a relationship
      # `follow` traverses (§44.6, ADR-0151).
      canonical_parent:
        Listener: [network.listeners]
        Connection: [network.connections]
      relationships:
        - process.owns_socket
        - socket.connected_to
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: normal
      landmark_metrics: [state, protocol]
