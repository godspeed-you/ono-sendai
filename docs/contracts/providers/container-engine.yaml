# The provider that answers over the Docker Engine API from whichever runtime socket answers —
# Docker's or Podman's, found through DOCKER_HOST / CONTAINER_HOST or the well-known paths
# (ADR-0112). Registered even where no runtime answers: unavailability naming the sockets tried
# is a different answer from "there are no containers" (spec §35.3). See linux-procfs.yaml for
# what this registry is and what enforces it.

providers:
  - id: container-engine
    doc: >-
      Containers and images, from `GET /containers/json`, `GET /containers/{id}/json` and
      `GET /images/json` over the runtime's Unix socket — never from `docker ps` (spec §23,
      §31.57).
    targets: [container, image]
    capabilities: [container.list, image.list, container.manage]
    schemas: [ono.container/1, ono.image/1]
    conformance:
      container: enumerable
      image: enumerable
    temporal:
      # §22.7: "Container providers SHOULD expose runtime-native lifecycle events when the runtime
      # supports them." `GET /events` is such a stream, and since ADR-0716 this provider opens it
      # — live with no upper bound, and as a historical replay with `since` and `until`, which is
      # the same endpoint answering about the past (§21.4). The engine's container id is the
      # identity `get container` answers with, so the events reconcile with v0.4 container
      # spatial identity by construction rather than by a mapping table.
      #
      # `exhaustive_events` is false because the engine's event log is bounded by its own
      # retention and by the daemon's lifetime, and neither is a thing this provider can read: a
      # container that came and went while the daemon was restarting left nothing to find (§21.5).
      # `causal_tokens` is false because the event carries no request identifier — the engine
      # does not publish one — so there is no transaction here to join a cause on (§21.6).
      current_snapshot: true
      live_events: true
      historical_query: true
      exhaustive_events: false
      causal_tokens: false
      checkpointable: true
      retained_history: null
      # The word names the strongest thing this source can answer, and a historical query is
      # stronger than a live stream: `GET /events` pushes as it happens *and* replays a window on
      # request, and it is one endpoint doing both. `live_events: true` above is where the live
      # half is stated; a single word cannot carry two claims and the capabilities are where the
      # detail belongs.
      coverage: historical_query
    spatial:
      # The engine's full container id is stable for the container's whole existence and is
      # never reused (§10.1 Tier A). The name is a label the engine lets a user change, so it
      # is not identity (§3.1).
      identity_strategy: stable
      canonical_parent:
        Container: [containers]
      relationships:
        - container.contains_process
      freshness: on_demand
      events: true
      permissions: [available, empty, unsupported]
      cost_class: normal
      landmark_metrics: [state, created]
