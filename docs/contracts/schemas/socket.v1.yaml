# Canonical Socket schema. Source: spec §28.4, field-for-field. Identity is the
# "provider-specific socket ref/inode" of §28.4. The `local`/`remote` Endpoint records are
# `ono.endpoint/1`, defined in endpoint.v1.yaml (ADR-0012).
id: ono.socket/1
name: Socket
summary: A socket with its endpoints, owner and state.
identity: [inode]
# A socket in `time-wait` has no inode — the kernel has already released it — and three of sixteen
# connections in one live snapshot carried a wholly null identity because of it. The connection is
# still a real thing the kernel is reporting, and what names it is the tuple every network stack
# names it by, so that tuple joins the identity for exactly the sockets the inode cannot identify
# (ADR-0554).
identity_fallback: [protocol, local, remote]
fields:
  # `ss` lists ICMP ping sockets as `icmp`/`icmp6`, and socket types newer than any vocabulary
  # this file can list. The first two are protocols of their own; a type nobody here knows is
  # `unknown` with a null family, rather than failing every socket listed beside it (issue #131,
  # ADR-0854). Both widenings are additive: no record valid before is invalid now.
  protocol:
    type: enum
    required: true
    values: [tcp, udp, unix, raw, sctp, dccp, packet, icmp, icmp6, unknown]
    doc: The transport protocol.
  family:
    type: enum
    nullable: true
    values: [inet, inet6, unix, packet, netlink, other]
    doc: The address family; null when it cannot be told, as for a socket type the provider does not know.
  local:
    type: ono.endpoint/1
    nullable: true
    doc: The local endpoint; null for socket kinds that have none.
  remote:
    type: ono.endpoint/1
    nullable: true
    doc: The peer endpoint; null for listening and connectionless sockets.
  state:
    type: enum
    nullable: true
    values:
      [established, syn-sent, syn-recv, fin-wait-1, fin-wait-2, time-wait, close, close-wait,
       last-ack, listen, closing, unknown]
    doc: The connection state; null for protocols that have none, such as UDP.
  process:
    type: ref<ono.process/1>
    nullable: true
    doc: >-
      The owning process; null when no process owns the socket, or when this user may not see
      the owner. Spec §10.5 forbids collapsing those two into an empty string.
  user:
    type: ref<ono.user/1>
    nullable: true
    doc: The owning user.
  inode:
    type: int
    nullable: true
    doc: The socket inode; the identity field, null when the provider cannot supply it.
default_view:
  columns: [protocol, local, remote, state, process]
