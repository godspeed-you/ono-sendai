# ModelProvider. Source: spec §31.43's `get model` table, column for column, plus the data
# policy of §31.44 and the requirements a broker matches against in §31.43. Output of
# `get model` (`docs/contracts/commands/kuang.yaml` → `ono.model.get`).
#
# Spec §31.43's point is portability: an assistant asks for a model by requirements, and the
# operator decides which provider satisfies them. This record is the operator's side of that —
# what is configured, where it runs, and what it is allowed to see. It is configuration made
# inspectable, which is spec §31.89 rule 10 applied to models.
id: ono.model-provider/1
name: ModelProvider
summary: One configured model provider, and the data boundary the operator set for it.
identity: [id]
fields:
  id:
    type: string
    required: true
    doc: The provider's configured id, e.g. `local-code`, `fast-remote`, `private-prod`.
  name:
    type: string
    required: true
    doc: The display name.
  kind:
    type: enum
    required: true
    values: [local, remote]
    doc: >-
      Whether inference happens on this machine or leaves it. The distinction the whole data
      policy hangs on (spec §31.43's `KIND` column).
  location:
    type: string
    required: true
    doc: >-
      Where it runs, in the operator's own words — `workstation`, `configured`, `enterprise`
      (spec §31.43's `LOCATION` column). Descriptive; the enforceable part is `data_policy`.
  endpoint:
    type: string
    nullable: true
    doc: >-
      The configured endpoint. Null for a local provider, and redacted for any provider whose
      endpoint carries credentials — a value marked secret is never rendered (spec §17.5).
  context_window:
    type: int
    nullable: true
    doc: >-
      The usable context, in tokens (spec §31.43's `CONTEXT` column). Null when the provider does
      not report one, which is different from zero and disqualifies it from any
      `min_context` requirement.
  tools:
    type: bool
    required: true
    doc: Whether it supports tool calling (spec §31.43's `TOOLS` column). An assistant needing tools is not offered a provider without them.
  structured_output:
    type: bool
    required: true
    doc: Whether it supports schema-constrained output. Required by any assistant asking for a declared `output_schema`.
  streaming:
    type: bool
    required: true
    doc: Whether partial responses are available. Relevant because an assistant must never block terminal input (spec §31.67).
  data_policy:
    type: enum
    required: true
    values: [local-only, external-ok, redacted-only]
    doc: >-
      The policy name shown in spec §31.43's `DATA-POLICY` column. It is a summary of the three
      fields below, kept as its own field because it is what an operator recognises at a glance.
  allowed_classes:
    type: list<string>
    required: true
    doc: >-
      The data classes that may be sent as they are, from `data_classes` in
      `docs/contracts/kuang/assistants.v1.yaml` (spec §31.44).
  transformed_classes:
    type: map
    required: true
    doc: >-
      Class to transformation, e.g. `{logs: redact}`. Applied by the host before the request
      leaves. An empty map when nothing is transformed.
  denied_classes:
    type: list<string>
    required: true
    doc: >-
      Classes that may never be sent here. A request carrying one is refused with
      `model.policy_denied` rather than trimmed, so the boundary stays visible.
  available:
    type: bool
    required: true
    doc: Whether the provider can answer right now.
  unavailable_reason:
    type: string
    nullable: true
    doc: Why it cannot, when it cannot (spec §35.3). Null when it is available.
default_view:
  columns: [name, kind, location, context_window, tools, data_policy]
