# AssistantTurn. Source: spec §31.41 (the flow: context, model, proposal, capability check,
# execution), §31.45 (the visible context summary), §31.47 (action plans), §31.48 (autonomy),
# §31.50 (evidence and citations), §31.82 (the data-boundary plan). Output of `ask assistant`
# (`docs/contracts/commands/kuang.yaml` → `ono.assistant.ask`).
#
# The turn is the audit object of the assistant system. Everything spec §31.41's flow diagram
# passes through is a field here — what context was assembled, what was excluded, which model
# answered, what it asked to do, and what actually ran — so that a turn can be inspected after
# the fact rather than reconstructed from prose. Spec §31.89 rule 10: everything inspectable.
id: ono.assistant-turn/1
name: AssistantTurn
summary: One assistant exchange — the context it saw, what it concluded, and what it proposed or did.
identity: [id]
fields:
  id:
    type: uuid
    required: true
    doc: The turn's own identity, so an answer can be cited and re-inspected later.
  assistant:
    type: ref<ono.assistant/1>
    required: true
    doc: "Which assistant took the turn. Never implicit: the assistant is named on the command line (spec §7.1, §31.42)."
  conversation:
    type: string
    nullable: true
    doc: The conversation this turn belongs to. Null for a one-shot `ask assistant`.
  request:
    type: string
    required: true
    doc: What the operator asked, verbatim. Labelled `OPERATOR_REQUEST` in the model context (spec §31.52).
  at:
    type: timestamp
    required: true
    doc: When the turn started.
  duration:
    type: duration
    required: true
    doc: How long it took, so a slow answer is visible as one.
  autonomy:
    type: enum
    required: true
    values: [L0, L1, L2, L3, L4]
    doc: The effective level for this turn — the minimum of the package's declaration and policy (spec §31.48).
  model:
    type: ref<ono.model-provider/1>
    nullable: true
    doc: >-
      Which provider answered. Null when no inference happened — because none was configured,
      because policy denied it, or because the turn was answered from tools alone.
  context:
    type: record
    required: true
    doc: >-
      The visible context summary of spec §31.45: `{included: list<record>, excluded:
      list<record>, fields: list<string>, at: timestamp, host: string}`. The `excluded` list is
      the part an operator cannot verify any other way — shell history, environment, file
      contents, secrets — so it is stated rather than implied.
  data_boundary:
    type: record
    nullable: true
    doc: >-
      The model-request plan of spec §31.82: what was sent, what was removed, and under which
      policy. Retained on the turn whether or not it was displayed, so inspection stays
      available even when a repeat call was shown tersely. Null when nothing left the process.
  answer:
    type: string
    required: true
    doc: >-
      The assistant's answer. Model-authored text, sanitised before display like any other value
      (ADR-0015 T1); it never reaches the terminal as escape sequences.
  citations:
    type: list<ono.evidence/1>
    required: true
    doc: >-
      The object references supporting the answer's claims (spec §31.50). Each must resolve, or
      the turn fails output validation — spec §31.87 asks that the same question be investigable
      manually from these alone.
  findings:
    type: list<ono.finding/1>
    required: true
    doc: Findings the turn produced or surfaced. Empty when it produced none.
  tool_calls:
    type: list<record>
    required: true
    doc: >-
      Every tool the model requested, as `{tool, arguments, decision, at, error}` with `decision`
      one of `executed`, `denied`, `invalid`. Denied and invalid calls are kept: a model asking
      for tools it was not given is worth seeing (spec §31.46).
  proposed_actions:
    type: list<ono.assistant-action/1>
    required: true
    doc: >-
      The action plan, in order. Empty when the turn proposed nothing. At `L2` and below, every
      mutating entry stays `proposed` until an operator chooses (spec §31.47).
  executed:
    type: bool
    required: true
    doc: >-
      Whether anything in the plan actually ran in this turn. Required even when false, because
      "no changes made" — spec §31.53's own closing line — is the answer an operator most needs
      stated plainly.
  status:
    type: enum
    required: true
    values: [answered, proposed, denied, failed, cancelled]
    doc: >-
      How the turn ended. `proposed` means it produced a plan awaiting a decision; `denied`
      means policy stopped it, in context assembly, in model selection or at a capability check.
  error:
    type: ono.error/1
    nullable: true
    doc: The structured error for `denied`, `failed` and `cancelled`. Null otherwise.
default_view:
  columns: [at, assistant, request, status, autonomy, executed]
