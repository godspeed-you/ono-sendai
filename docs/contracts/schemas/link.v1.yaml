# Link. Spec §21.1 creates one with `link host`, §14.4 makes the active link decide where
# provider calls run, and §37 Phase H delivers it. The record is the session's own bookkeeping:
# a link is not an object some provider found, it is a connection this shell holds.
id: ono.link/1
name: Link
summary: One remote Ono link this session holds.
identity: [name]
fields:
  name:
    type: string
    required: true
    doc: The host as the user named it — the prompt's spelling, and `enter link`'s argument.
  host:
    type: string
    required: true
    doc: >-
      The host the link points at. `link host prod-db` points at `prod-db` itself; a definition
      may point elsewhere (`add link prod-db --host 10.4.2.11`), and the table never hides where
      a link goes.
  transport:
    type: enum
    required: true
    values: [ssh, local, tcp]
    doc: >-
      How the bytes travel. `ssh` spawns the remote agent over OpenSSH; `local` spawns
      `ono --agent` as a child of this shell, which is how a link is exercised without a
      network; `tcp` is Ono's own authenticated transport of spec §21.5, where the peer proves
      it holds the key this shell pinned for the host (ADR-0353).
  mode:
    type: enum
    required: true
    values: [agent, agentless]
    doc: >-
      Whether the far side is the Ono agent of spec §21.4 or the agentless fallback of §21.3.
      The fallback MUST be visible because semantics and performance may differ, so the mode is
      part of the record wherever the link is described.
  state:
    type: enum
    required: true
    values: [defined, connected, closed]
    doc: >-
      Whether the link is usable now: `connected` once the handshake succeeded, `defined` for a
      definition recorded with `add link` that was never established, `closed` once torn down.
  targets:
    type: list<string>
    required: true
    doc: >-
      The targets the remote negotiated (spec §21.2), which is what its context can answer.
      Empty for a link that was never established: nothing was negotiated.
  protocol:
    type: int
    nullable: true
    doc: The link protocol version the handshake settled on (spec §21.2); null until it did.
  providers:
    type: list<string>
    nullable: true
    doc: >-
      The ids of the providers the remote offers (spec §21.2), which keep their ids across the
      link (ADR-0036); null until the handshake settled them.
  transport_fingerprint:
    type: string
    nullable: true
    doc: >-
      The `sha256:` fingerprint of the key the far side proved it holds, during this link's own
      handshake (v0.4.1 §7.3). Null where the transport authenticated nobody to this process —
      `ssh`, where OpenSSH did the authenticating in its own `known_hosts` and will not say
      which key it accepted (§4.3), and `local`, where the far side is this shell's own child.
      Null is the honest answer there and not a missing value.
  transport_trust:
    type: enum
    nullable: true
    values: [pinned, newly_pinned, unauthenticated]
    doc: >-
      What the trust store concluded about that key (v0.4.1 §7.3): `pinned` for a key already
      recorded for this host, `newly_pinned` for one recorded on first contact, and
      `unauthenticated` for a transport that proved nothing and a policy that said so by name.
      Null until a handshake settled it.
  authenticated:
    type: bool
    nullable: true
    doc: >-
      Whether *this process* verified the far side's key during this link's own handshake
      (v0.4.1 §19.1: "authenticated — cryptographic peer proof was verified"). True exactly
      where `transport_fingerprint` names a key. False over `ssh` and `local`, where something
      else did the authenticating and §4.3 requires the link to say so rather than borrow it.
      Not the same question as `transport_trust`, which says what was *decided* about that key.
  authorized:
    type: bool
    nullable: true
    doc: >-
      Whether the far side's own policy admitted this connection (v0.4.1 §19.1: "authorized —
      authenticated principal is permitted by policy"). True for an established direct link,
      where the agent resolved its `authorized_clients` store for this client before it
      negotiated anything (§9.4, §10.1). Null where no policy this process can see decided —
      `ssh` and `local`, where the carrier decided — and null for a link that was never
      established. A client the agent refuses never becomes a row: the refusal is
      `remote.unauthorized` (E1202), which is where an unauthorized authenticated peer is seen.
  runtime_user:
    type: string
    nullable: true
    doc: >-
      The user the far side reports it is running as. v0.4.1 §7.3: "the runtime identity is
      useful context but MUST NOT grant authority" — it is what the peer said about itself, and
      `transport_fingerprint` is what it proved.
  runtime_uid:
    type: int
    nullable: true
    doc: The numeric user id the far side reports, where it reports one. Context, not authority.
  runtime_elevated:
    type: bool
    nullable: true
    doc: >-
      Whether the far side reports it is running with elevated privilege (spec §17.2). Self-
      reported, and §2.1 forbids it from satisfying the word authenticated.
default_view:
  columns: [name, host, transport, mode, state, targets]
