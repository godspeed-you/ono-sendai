# VerificationResult. Source: spec §31.36's `verify plugin` output, line for line, plus the
# manifest and compatibility checks spec §31.7 and §31.9 require before an artifact is trusted
# enough to place on disk. Output of `verify plugin`
# (`docs/contracts/commands/kuang.yaml` → `ono.plugin.verify`).
#
# Spec §31.36's central point is that these are four different questions and must have four
# different answers: integrity is not signature, signature is not publisher trust, and none of
# them is isolation. Collapsing them into one "trusted: yes/no" is how an unsigned local package
# and a package signed by an unknown key end up looking the same.
#
# A verification is a result rather than an addressable object, so it declares no identity
# (ADR-0012 §9).
id: ono.verification-result/1
name: VerificationResult
summary: What integrity, signature, publisher trust and compatibility say about one package.
identity: []
fields:
  package:
    type: string
    required: true
    doc: The package id and version verified, or the source reference where it is not yet installed.
  source:
    type: string
    required: true
    doc: What was verified — an installed artifact, or a reference that has not been installed.
  integrity:
    type: enum
    required: true
    values: [valid, invalid, unknown]
    doc: >-
      "Are these the exact bytes referenced?" (spec §31.36). `unknown` where the source offered
      no hash to compare against, which is a real answer and not a pass.
  signature:
    type: enum
    required: true
    values: [valid, invalid, absent, unknown]
    doc: >-
      "Did a key sign these bytes?" `absent` is not a failure: spec §31.36 requires unsigned
      local development packages to remain runnable in a visibly untrusted, capability-limited
      mode.
  publisher:
    type: string
    nullable: true
    doc: The publisher the signature attests to. Null when there is no valid signature to attest anything.
  key:
    type: string
    nullable: true
    doc: The signing key, e.g. `ed25519:AB12...`. Null when there is none.
  trust:
    type: enum
    required: true
    values: [user-trusted, system-trusted, untrusted, unknown]
    doc: >-
      "Do I trust that key or publisher?" A valid signature from a key this system does not know
      is `unknown`, never `user-trusted` — the signature proves who signed, not whether to care.
  transparency:
    type: enum
    required: true
    values: [present, absent, unknown]
    doc: >-
      Whether the signature appears in a transparency log. `unknown` where none is configured,
      which is what spec §31.36's own example prints.
  compatibility:
    type: enum
    required: true
    values: [compatible, incompatible, unknown]
    doc: Whether `kuang_api`, `ono_language` and `platforms` admit this host (spec §31.7, §31.62).
  manifest:
    type: enum
    required: true
    values: [valid, invalid]
    doc: Whether the manifest satisfies every rule in `docs/contracts/kuang/manifest.v1.yaml` and every registration check.
  runtime:
    type: enum
    required: true
    values: [core-built-in, trusted-native, isolated-component, remote-service]
    doc: >-
      "What can the code do even if I do not trust it?" (spec §31.36). Reported, never judged —
      it is the answer that makes the others survivable.
  blocking_failures:
    type: list<string>
    required: true
    doc: >-
      The checks that failed and prevent installing or loading, by check id. Empty when nothing
      blocks. A blocking failure never produces a prompt offering to continue (ADR-0015 rule 4).
  warnings:
    type: list<string>
    required: true
    doc: Non-blocking observations, such as an absent signature or an unknown transparency state. Empty when there are none.
  verified_at:
    type: timestamp
    required: true
    doc: When the checks ran. Integrity is re-verified at load, so an old result is not a licence.
default_view:
  columns: [package, integrity, signature, trust, compatibility, runtime]
