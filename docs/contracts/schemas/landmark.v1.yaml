# Canonical Landmark schema. Source: v0.4 §3.7 — "A landmark MUST always expose its reason" —
# with the fourteen built-in reasons §3.7 enumerates and `docs/contracts/spatial/landmarks.yaml`
# declares. §26.1 says what they are for: orientation, not decoration; §49.1 forbids the
# decorative kind.
id: ono.landmark/1
name: Landmark
summary: An object or condition promoted because it helps orientation or deserves attention.
identity: [subject, reason]
fields:
  subject:
    type: string
    required: true
    doc: The `spatial_id` of the place the landmark is about (§3.1).
  name:
    type: string
    required: true
    doc: What a person calls that place.
  reason:
    type: enum
    required: true
    values:
      - high_cpu
      - high_memory
      - failed
      - restarting
      - recently_changed
      - public_listener
      - privileged
      - storage_pressure
      - connection_spike
      - new_object
      - removed_object
      - security_boundary
      - remote_boundary
      - user_pinned
    doc: Why it is a landmark. §3.7 makes the reason mandatory, and the vocabulary is closed.
  evidence:
    type: string
    required: true
    doc: The observation that made the rule fire — the number, the state, the pin (§26.1).
  source:
    type: string
    required: true
    doc: Who claimed it — a built-in rule, the user's pin, or a plugin id (§26.5, §35.5).
default_view:
  columns: [name, reason, evidence]
