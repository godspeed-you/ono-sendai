# PluginPackage. Source: spec §31.9 (discovery and installation sources), §31.5 (identity),
# §31.7 (manifest fields visible before execution), §31.36 (integrity and signature).
# Output of `find plugin` (`docs/contracts/commands/kuang.yaml` → `ono.plugin.find`).
#
# This is a package *as a source offers it*, before anything is installed and long before
# anything runs. Everything here comes from metadata the source served; none of it is a claim
# Ono has verified unless a field says otherwise. That is why `signature` and `integrity` are
# separate fields with `unknown` among their values rather than booleans.
id: ono.plugin-package/1
name: PluginPackage
summary: A KUANG/11 package as an installation source describes it, before installing anything.
identity: [id, version, source]
fields:
  id:
    type: string
    required: true
    doc: The publisher-namespaced package id (spec §31.5).
  name:
    type: string
    required: true
    doc: The display name the source advertises.
  version:
    type: string
    required: true
    doc: The version this record describes. A source offering several versions yields several records.
  publisher:
    type: string
    required: true
    doc: The publisher namespace `id` begins with.
  summary:
    type: string
    required: true
    doc: One line, what the package is for. Package-authored text, sanitised before display (ADR-0015 T1).
  source:
    type: string
    required: true
    doc: >-
      The resolved source reference, e.g. `registry:example/packet-eye@2.4.1` or
      `file:./packet-eye.k11` (spec §31.9). Part of the identity: the same package from two
      sources is two things worth telling apart.
  source_kind:
    type: enum
    required: true
    values: [catalog-network, local-path, system-package]
    doc: >-
      How the payload reaches this host (K11A §4.2): a catalog artifact fetched over the network,
      a local directory (an explicit path, the package cache or a local package source), or a
      payload an operating-system package placed under a system source root. Acquisition grants
      nothing; every kind goes through the same verification, trust and permission steps.
  system_package:
    type: string
    nullable: true
    doc: >-
      The outer distribution package that supplied a system-provided payload, e.g.
      `ono-plugin-kubernetes`, when its sidecar said (K11A §10.1). Null for every other kind, and
      for a payload whose wrapper left no sidecar.
  license:
    type: string
    required: true
    doc: The SPDX identifier the manifest declares.
  kuang_api:
    type: string
    required: true
    doc: The host API range the package declares (spec §31.7).
  platforms:
    type: list<string>
    required: true
    doc: The platform tuples the package supports. A host not in the list cannot install it.
  roles:
    type: list<string>
    required: true
    doc: The extension roles the package declares (spec §31.4).
  contributions:
    type: record
    required: true
    doc: >-
      What the package says it contributes: counts and ids of commands, schemas, targets, views,
      relations and annotations. Spec §31.1 requires every displayed line to be backed by a
      manifest field, so this is read from the manifest and not from a description.
  requested_capabilities:
    type: list<record>
    required: true
    doc: >-
      Every capability the package requests, as `{capability, class, scope, purpose}` with
      `class` one of `required`, `optional`, `runtime-requested` (spec §31.17). Empty when it
      asks for nothing.
  network:
    type: record
    required: true
    doc: "The declared outbound policy and destinations (spec §31.21). `outbound: none` is a stated answer, not an absent field."
  integrity:
    type: string
    nullable: true
    doc: >-
      The content hash the source advertises, e.g. `sha256:...`. Null when the source offers
      none — which makes installing from it a decision rather than a formality.
  signature:
    type: enum
    required: true
    values: [valid, invalid, absent, unknown]
    doc: >-
      The signature state, as far as it can be judged without downloading the artifact.
      `unknown` is the honest answer for a source that does not say (spec §35.3).
  trust:
    type: enum
    required: true
    values: [verified, signed, local, unknown, untrusted]
    doc: What is known about the publisher, using the same vocabulary as `ono.plugin/1.trust`.
  installed:
    type: bool
    required: true
    doc: Whether this exact id and version is already installed on this host.
  catalog:
    type: string
    nullable: true
    doc: The catalog that answered, by name, e.g. `official` (K11P §11). Null for a package read from an installed directory or an explicit path.
  catalog_verification:
    type: enum
    nullable: true
    values: [built-in, operator, unknown]
    doc: >-
      How the shell knows the catalog: part of the release, placed by the operator, or claimed.
      A separate answer from `signature` and `trust` on purpose — a catalog saying a package
      exists makes nobody trusted (K11P §11.3, ADR-0601 §2). Null when no catalog answered.
  size:
    type: bytesize
    nullable: true
    doc: The artifact's size where the source reports it; null where it does not.
  published_at:
    type: timestamp
    nullable: true
    doc: When the source says the version was published. Null where the source does not say.
# K11P §11.6: the name leads, the id stays available, and trust is a column of its own.
default_view:
  columns: [name, id, version, trust, source_kind, source, installed]
