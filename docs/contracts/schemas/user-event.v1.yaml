# UserEvent. Spec §18.2 turns a query into a stream of updates and §31.14 fixes the event
# envelope: what kind of change, when, to which object, carrying the object's state. The account
# database has no event source the shell can subscribe to — NSS answers questions, it does not
# push — so the runtime compares snapshots and says so in `source` (ADR-0034, ADR-0078).
id: ono.user-event/1
name: UserEvent
summary: One change to one user account, as a live stream emits it.
identity: []
fields:
  kind:
    type: enum
    required: true
    values: [snapshot, added, changed, removed]
    doc: >-
      What happened. A subscription always begins with `snapshot` events carrying the current
      state (ADR-0024), so no consumer has to reconstruct the starting point.
  at:
    type: timestamp
    required: true
    doc: When the change was observed.
  user:
    type: record
    required: false
    doc: >-
      The account as it now is — or, for `removed`, as it last was. Identity is the uid
      (user.v1.yaml), so a renamed account is the same object changing and a reused uid is a
      new one.
  changed:
    type: list<string>
    required: false
    doc: For `changed`, the names of the fields whose values moved. Null for every other kind.
  source:
    type: enum
    required: true
    values: [subscription, poll]
    doc: >-
      How the change was observed. `poll` means the runtime compared NSS snapshots at the
      configured interval — explicit, as spec §18.2 requires.
default_view:
  columns: [kind, at, user, changed]
