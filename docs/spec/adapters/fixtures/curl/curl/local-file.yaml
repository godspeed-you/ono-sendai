# A local scheme: no status, no server, the body before the marker byte.
invocation: [curl, "file:///etc/hostname"]
tool_version: "8.18.0"
distro: debian
expect:
  records:
    - {url: "file:///etc/hostname", scheme: file, status: null, content_type: null, size: "5B", time: "322000ns", remote_address: null, remote_port: null, redirects: 0, body: "deck\n"}
