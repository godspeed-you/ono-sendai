# The adapter pack contract: the format every first-party pack under `first-party/` and every
# KUANG/11 package's `adapters:` section is written in.
#
# Source: spec v0.3 §1.44 (manifest sketch), §1.45 (declarative SDK), §1.46 (version probe),
# §1.47 (fixtures), §1.14–§1.16 (invocation ownership and partial support), §1.22 (capability
# boundary), §1.9 (tiers), §1.11 (canonical schemas), §1.66 (derivation). Conventions: ADR-0055.
#
# `cargo xtask spec-check` validates every pack against this file through `ono-adapter`, which
# is the same code the shell loads a pack with. The reference pages and the compatibility matrix
# under `docs/reference/adapters/` are generated from the packs, never written by hand.
#
# Reading the field tables:
#   `type`      the value model of spec §10.2 (`string`, `int`, `bool`, `list<T>`, `map`, …).
#   `required`  the pack is invalid without it.
#   `nullable`  may be absent; absent means unknown, never a default.

version: 1
format: ono-adapter-pack/1

# ---------------------------------------------------------------------------------------------
# Top level
# ---------------------------------------------------------------------------------------------
pack:
  closed: true
  fields:
    format:       {type: string, required: true, doc: "Always `ono-adapter-pack/1`."}
    package:      {type: record, required: true, doc: "Identity and tier — see `package` below."}
    roles:        {type: list<string>, required: true, doc: "Must contain `adapter` (spec v0.3 §1.44)."}
    capabilities: {type: record, required: true, doc: "The `process.exec` grant — see `capabilities` below."}
    adapters:     {type: list<record>, required: true, doc: "At least one adapter — see `adapter` below."}

package:
  closed: true
  fields:
    id:        {type: string, required: true, doc: "Reverse-DNS, lowercase, `[a-z][a-z0-9-]*` per segment. A first-party pack is `org.ono.compat.<name>`; a third-party pack MUST NOT claim `ono.*` or `org.ono.*` (spec §31.5)."}
    name:      {type: string, required: true, doc: "Display name."}
    version:   {type: string, required: true, doc: "The pack's own semver; provenance quotes it as `adapter_version` (spec v0.3 §1.8)."}
    publisher: {type: string, required: true, doc: "The publisher namespace `id` begins with."}
    tier:      {type: "enum[first-party, recommended, community, experimental]", required: true, doc: "Distribution tier (spec v0.3 §1.27); trust policy keys on it (§1.56)."}

capabilities:
  closed: true
  fields:
    process.exec:
      type: record
      required: true
      doc: >-
        The only executable grant an adapter pack may hold (spec v0.3 §1.22). `executables` lists
        program names or absolute paths; every `executable.names` entry of every adapter must be
        in it. `argv_policy` is always `declared-invocations-only`: the pack may run exactly the
        argv its invocation plans produce, never `sh -c`, never a concatenated string.

# ---------------------------------------------------------------------------------------------
# One adapter: an executable family, one canonical schema, one decoder, several invocations.
# ---------------------------------------------------------------------------------------------
adapter:
  closed: true
  fields:
    id:            {type: string, required: true, doc: "Kebab-case, unique within the pack. The adapter's full id is `<package.id>.<id>`."}
    summary:       {type: string, required: true, doc: "One line for the reference page and `get command`."}
    executable:    {type: record, required: true, doc: "See `executable`."}
    tier:          {type: "enum[A, B, C]", required: true, doc: "Strategy tier of spec v0.3 §1.9: A native machine protocol, B stable explicit fields, C version-constrained human-output parser."}
    output_demand: {type: "list<enum[structured, interactive]>", required: true, doc: "The demands the adapter answers (ADR-0052). It never answers `bytes`, `text` or `discard`."}
    fallback:      {type: "enum[raw, error]", required: true, doc: "What an unsupported invocation or incompatible version does when the demand is `interactive`: run raw, or fail. A `structured` demand always fails (spec v0.3 §1.18)."}
    schema:        {type: string, required: true, doc: "A registered canonical schema id, `ono.<name>/<major>` (spec v0.3 §1.11)."}
    decoder:       {type: record, required: true, doc: "See `decoder`."}
    fields:        {type: map, required: true, doc: "Schema field → `field` mapping; see `field`. A schema field the map omits is `null` on every record."}
    literals:      {type: map, nullable: true, doc: "Schema field → constant the adapter's invocation implies (`family: inet6` for `ip -6 route`). Exact, because the invocation states it."}
    invocations:   {type: list<record>, required: true, doc: "At least one; see `invocation`."}
    limits:        {type: list<string>, required: true, doc: "What the adapter does not do, in prose the reference page prints (spec v0.3 §1.68 item 14). May be empty."}
    fixtures:      {type: string, required: true, doc: "Directory under `docs/spec/adapters/fixtures/`, holding at least one fixture per invocation (see `fixture`)."}

executable:
  closed: true
  fields:
    names:         {type: list<string>, required: true, doc: "The program names (or absolute paths) the adapter answers to; each must be in `capabilities.process.exec.executables`."}
    versions:      {type: string, required: true, doc: "A version range `>=X.Y [<Z]`, or `any` for a machine protocol that is genuinely version-independent (spec v0.3 §1.46)."}
    version_probe: {type: record, nullable: true, doc: "Required unless `versions` is `any`. `argv` (run after the executable, under `LC_ALL=C`), `pattern` (a regex whose first capture is the version), `cache: executable-identity`."}

decoder:
  closed: true
  fields:
    kind:      {type: "enum[json, jsonl, lines, properties, builtin]", required: true, doc: "`json`: a JSON document. `jsonl`: one JSON document per line, decoded as the lines arrive — the streaming kind. `lines`: an explicit field protocol. `properties`: `key=value` lines, one record per block separated by `record_separator`; an empty value is null. `builtin`: a decoder implemented in Rust, the only kind allowed for tier C."}
    records:   {type: string, nullable: true, doc: "json: the key holding the record list; absent when the document is the list or a single record."}
    nested:    {type: string, nullable: true, doc: "json: a key whose children are records too; they are flattened with the parent's identity field carried as `$parent.<field>`."}
    children:  {type: string, nullable: true, doc: "json: the records are the entries of this key inside each element of the list, and the element is their parent (`$parent.<field>`); an element without entries contributes nothing."}
    field_separator:  {type: string, nullable: true, doc: "lines: the byte between fields (`\\t`, `\\0`, …), or `whitespace` — runs of spaces or tabs, with the last column taking the rest of the record (`ps`); properties: the text between key and value (`=`). Required for both."}
    record_separator: {type: string, nullable: true, doc: "lines: `\\n` or `\\0`; properties: the text between records (`\\n\\n`). Required for both."}
    columns:   {type: list<string>, nullable: true, doc: "lines: the decoded names of the fields, in the order the plan requests them; the last column takes the rest of the record, separators included. Required for `lines`."}
    header_lines: {type: int, nullable: true, doc: "lines: leading newline-separated records that are a header (`df`'s), skipped. Default 0."}
    id:        {type: string, nullable: true, doc: "builtin: the decoder's stable id, which must exist in the binary. Required for `builtin`."}
    stability: {type: "enum[stable, version-constrained]", nullable: true, doc: "builtin: required; `version-constrained` marks a brittle parser (spec v0.3 §1.9 Tier C)."}

field:
  closed: true
  fields:
    from:      {type: string, required: true, doc: "The decoded field name, or `$parent.<field>` for a nested tree's parent; empty when `template` reads the whole record."}
    template:  {type: string, nullable: true, doc: "A text with `{field}` placeholders filled from the decoded record (`from` empty) or from each object in the list at `from`; the result is coerced like any string. Exactness `normalized`."}
    first:     {type: bool, nullable: true, doc: "Take the first element of the list at `from`, or the first character of the string there. Exactness `normalized`."}
    basename:  {type: bool, nullable: true, doc: "Take the last path component of the string at `from`. Exactness `normalized`."}
    infer:     {type: "enum[ip-family, program-name, started-from-elapsed]", nullable: true, doc: "Derive the field: `ip-family` yields `inet` or `inet6` from an address at `from`; `program-name` the basename of the first word of a command line, brackets stripped; `started-from-elapsed` the instant this many seconds before the decoding. Exactness `inferred`."}
    unit:      {type: "enum[bytes, kib, mib, seconds, milliseconds, microseconds, percent]", nullable: true, doc: "How a bare number is to be read — for a timestamp, seconds/milliseconds/microseconds since the epoch; sets exactness to `normalized` when it converts."}
    split:     {type: string, nullable: true, doc: "Split a string on this separator into `list<string>`."}
    contains:  {type: string, nullable: true, doc: "After `split`: the field is `true` when the list holds this literal. Exactness `normalized`."}
    map:       {type: map, nullable: true, doc: "Literal translations applied before coercion, e.g. `{\"0\": false, \"1\": true}`."}
    exactness: {type: "enum[exact, normalized, inferred]", nullable: true, doc: "Defaults to `exact`, or `normalized` when `unit`, `split`, `contains` or `map` applies. `inferred` must be written down (spec v0.3 §1.8)."}

invocation:
  closed: true
  fields:
    id:      {type: string, required: true, doc: "Kebab-case, unique within the adapter."}
    summary: {type: string, required: true, doc: "The user-facing spelling, for the reference page and completion."}
    match:   {type: record, required: true, doc: "See `match`."}
    plan:    {type: record, required: true, doc: "See `plan`."}

match:
  closed: true
  fields:
    words:       {type: list<list<string>>, required: true, doc: "Alternatives of positional words that select the invocation, in order, e.g. `[[address], [addr], [a]]`; `[[]]` selects the bare program."}
    flags:       {type: record, required: true, doc: "`allow`: flags that may appear and pass through unchanged. `allow_with_value`: flags that take the next word. `require` (optional): flags that must all be present for the invocation to match. Any other flag is `adapter.unsupported_invocation` (spec v0.3 §1.14)."}
    positionals: {type: "enum[allow, forbid]", required: true, doc: "Whether further non-flag words (a device, an interface) may follow and pass through."}

plan:
  closed: true
  fields:
    argv:              {type: list<string>, required: true, doc: "The exact machine-oriented invocation, program first (spec v0.3 §1.7)."}
    append_user_flags: {type: bool, required: true, doc: "Whether allowed user flags and positionals are appended after `argv`."}
    env:               {type: map, required: true, doc: "Environment stabilisation, e.g. `LC_ALL: C` (spec v0.3 §1.21). May be empty."}
    stdin:             {type: "enum[null, inherit]", required: true, doc: "Whether the child sees the pipeline's stdin."}
    trailing_argv:     {type: list<string>, nullable: true, doc: "Words appended after the user's own — `find`'s `-printf` action, which must come last. Default none."}
    unbounded:         {type: bool, nullable: true, doc: "Whether the invocation may never end on its own (`journalctl -f`); its records are a live stream that renders in place at the terminal and needs a representation elsewhere (spec §18.3). Default false."}

# ---------------------------------------------------------------------------------------------
# Fixtures (spec v0.3 §1.47): `<name>.out` holds the bytes the tool produced, `<name>.yaml`
# says where they came from and what the decoder must make of them.
# ---------------------------------------------------------------------------------------------
fixture:
  closed: true
  fields:
    invocation:   {type: list<string>, required: true, doc: "The user's argv that produced the bytes."}
    tool_version: {type: string, required: true, doc: "The executable's version."}
    distro:       {type: string, required: true, doc: "Where the bytes were captured (`debian`, `fedora`, …)."}
    expect:       {type: record, required: true, doc: "Either `records:` — the canonical records, each field in its canonical text form, compared field by field — or `error:` — the `adapter.*` selector the decoder must produce."}
