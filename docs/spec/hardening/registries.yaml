# The index of this directory: every machine-readable hardening contract, and the gate check that
# validates it (v0.4.1 §52).
#
# §52.3 is one sentence with one hard word in it:
#
#   "`scripts/gate.sh` MUST validate every machine-readable contract for schema correctness and
#    cross-reference integrity."
#
# **Every.** §52.1 named seven contract domains; this directory holds sixteen files, because the
# rest arrived with the phases that needed them. Until this index existed, each registry was
# validated by whichever crate happened to consume it — which is fine for a registry a crate
# consumes and silence for one nothing does. `remote_limits.yaml` was in exactly that state, and
# `docs/STATE.md` had recorded it: "not validated by `xtask spec-check`; only
# `crates/ono-remote/tests/limits.rs` checks its cross-references."
#
# So this file is what makes *every* checkable rather than aspirational. A contract in this
# directory with no row here fails the gate, and a row whose `validated_by` names a function
# nobody wrote fails the gate. A registry arrives with its validator or it does not arrive.
# Decisions: ADR-0547.
#
# Fields of a registry row
#
#   file          the file name inside this directory.
#   domain        the §52.1 contract domain it is, or `null` for one this repository added.
#   validated_by  the gate checks that hold it, as `path::function`. It must live under `xtask/`:
#                 §52.3 puts the validation in the gate, and a crate test that reads the same
#                 file is a consumer agreeing with itself.
#   consumed_by   who reads it at runtime or in a crate's own tests. Recorded because §52.2's
#                 single source of truth is a claim about consumers — "runtime defaults,
#                 generated help/reference and tests consume the same source" — and a registry
#                 with no consumer is a table nothing acts on.
#   doc           what it holds.
#   spec          the sections that ask for it.
#
# Fields of a domain row
#
#   domain        one of §52.1's seven names.
#   file          the file in this directory that holds it, or `null`.
#   generated     for a domain that is not a committed registry: the artifact, and what writes it.
#   note          why it lives where it does, where that is not the obvious place.

version: 1

# ---------------------------------------------------------------------------------------------
# §52.1's seven domains, and where each one lives here.
# ---------------------------------------------------------------------------------------------
domains:
  - domain: security_boundaries
    file: security_boundaries.yaml
    generated: null
    note: >-
      §6.1's inventory, with §6.2's owning crate and §20's negative tests beside each boundary.

  - domain: remote_limits
    file: remote_limits.yaml
    generated: null
    note: >-
      One row per connection ceiling, holding no numbers: each points at the `limits.*` key in
      `limits.yaml` that does.

  - domain: materialization_limits
    file: limits.yaml
    generated: null
    note: >-
      Not a file of its own. §55.1 gives every hardening limit one dotted configuration key and
      §52.2 gives every figure one home, so materialization, capture, history and the remote
      ceilings share one catalogue rather than four (ADR-0456). Splitting it by subsystem would
      be the second copy §52.2 forbids, one directory level up.

  - domain: kuang_confinement_controls
    file: kuang_confinement_controls.yaml
    generated: null
    note: null

  - domain: performance_profiles
    file: performance_profiles.yaml
    generated: null
    note: >-
      Appendix F's fixture matrix. `performance_environment.yaml` and `performance_baseline.json`
      are the two registries §32.4 and §37.2 require beside it, and the gate validates the three
      together because each is only meaningful against the others.

  - domain: expected_test_skips
    file: expected_test_skips.yaml
    generated: null
    note: null

  - domain: release_inputs
    file: null
    generated: dist/build-inputs.json
    note: >-
      Appendix H's manifest is a property of one build, not of the repository: the commit, the
      container digests, the action SHAs, the tool versions and the workflow run identity that
      produced a specific set of bytes. `cargo xtask build-manifest` writes it and the release
      workflow publishes it beside the packages (ADR-0451). Committing a copy would be a
      statement about a build nobody ran. What *is* committed is the input side — the pins
      `xtask/src/supply_chain.rs` scans on every gate run — and `provenance::check_manifest_is_emitted`
      fails the gate if the workflow stops emitting the manifest at all.

# ---------------------------------------------------------------------------------------------
# Every machine-readable contract in this directory, and what holds it.
# ---------------------------------------------------------------------------------------------
registries:
  - file: registries.yaml
    domain: null
    validated_by: [xtask/src/contracts.rs::check_registry_inventory]
    consumed_by: [xtask]
    spec: "v0.4.1 §52.1, §52.3"
    doc: >-
      This file. It indexes itself, because an index that exempts itself is one more contract
      nobody validates.

  - file: security_boundaries.yaml
    domain: security_boundaries
    validated_by:
      - xtask/src/contracts.rs::check_security_boundaries
      - xtask/src/contracts.rs::check_dispatch_paths
    consumed_by: [xtask]
    spec: "v0.4.1 §6.1, §6.2, §10.2, §20"
    doc: >-
      The twelve boundaries of §6.1 with their input trust, their required enforcement, the one
      crate that owns each and the negative tests §20 accepts them on. Also the vocabulary
      `refusals.yaml` and `remote_trust.yaml` join against (ADR-0546).

  - file: refusals.yaml
    domain: null
    validated_by: [xtask/src/contracts.rs::check_refusals]
    consumed_by: [xtask]
    spec: "v0.4.1 §54.1, §54.2, §53.2"
    doc: >-
      Which boundary decided each hardening refusal, which crate constructs it, and the metadata
      keys it carries. The census of §54.1, so no single phase's refusals are proved and the
      property across them left unsaid (ADR-0537).

  - file: limits.yaml
    domain: materialization_limits
    validated_by: [xtask/src/contracts.rs::check_limits_registry]
    consumed_by: [ono-cli, ono-pipeline, ono-protocol, ono-remote, ono-value]
    spec: "v0.4.1 §22.2, §55.1, §55.2, Appendix A"
    doc: >-
      Every hardening limit in the product, once: key, type, default, permitted range, unit and
      the component that enforces it. `ono_cli::settings::CATALOGUE` declares the same keys and
      `crates/ono-cli/tests/resource_limits.rs` compares the two in both directions (ADR-0456).

  - file: remote_limits.yaml
    domain: remote_limits
    validated_by: [xtask/src/contracts.rs::check_remote_limits]
    consumed_by: [ono-protocol, ono-remote]
    spec: "v0.4.1 §12.1, §12.2, §12.3, §12.4, §52.2"
    doc: >-
      The connection ceilings of a listening agent as behaviour rather than as figures: what each
      bounds, when it is applied, what a refused peer is told and what the audit trail records.
      Every number is a pointer at `limits.yaml` (ADR-0501, ADR-0502, ADR-0503).

  - file: kuang_confinement_controls.yaml
    domain: kuang_confinement_controls
    validated_by: [xtask/src/contracts.rs::check_confinement_controls]
    consumed_by: [ono-kuang-supervisor]
    spec: "v0.4.1 §16.1, §16.4, Appendix D"
    doc: >-
      Appendix D's confinement matrix: every control, which execution tier requires it, whether
      it is mandatory or best-effort, and what happens when it cannot be installed. The gate also
      holds the supervisor's syscalls to it (`xtask/src/scan.rs::check_confinement_syscalls`).

  - file: streaming_classification.yaml
    domain: null
    validated_by: [xtask/src/contracts.rs::check_streaming_classification]
    consumed_by: [ono-command, ono-pipeline]
    spec: "v0.4.1 §27, Appendix E"
    doc: >-
      Appendix E's matrix: what each pipeline operation may do to a stream, and what the ordering
      of its events means. Appendix E makes an unplaceable command a release blocker, so the
      matrix is checked against the command registry rather than maintained beside it.

  - file: streaming.yaml
    domain: null
    validated_by: [xtask/src/scan.rs::check_evaluator_captures]
    consumed_by: [xtask]
    spec: "v0.4.1 §26.1, §65.7"
    doc: >-
      §26.1's inventory of every capture in the evaluator, classified as semantic materialization,
      implementation convenience or history/cache. Read in both directions against the evaluator
      sources, so a capture removed from one stage and regrown in another is visible (ADR-0479).

  - file: cost_classes.yaml
    domain: null
    validated_by: [xtask/src/contracts.rs::check_cost_classes]
    consumed_by: [ono-spatial-core, ono-spatial-query]
    spec: "v0.4.1 §34.2, §34.3"
    doc: >-
      §34.2's four acquisition classes, machine-readable as the specification requires, held
      against the enum the shell reports them with.

  - file: performance_profiles.yaml
    domain: performance_profiles
    validated_by: [xtask/src/perf.rs::check_registries]
    consumed_by: [ono-testkit, ono-spatial-query, xtask]
    spec: "v0.4.1 §32.2, Appendix F.1, F.2, F.3"
    doc: >-
      Appendix F's fixture matrix: the reference cardinalities a figure is measured at, and where
      a fixture of each size can honestly be built. `ono_testkit::profile` builds them and
      `crates/ono-spatial-query/tests/profiles.rs` compares the two (ADR-0488).

  - file: performance_environment.yaml
    domain: null
    validated_by: [xtask/src/perf.rs::check_registries]
    consumed_by: [xtask]
    spec: "v0.4.1 §32.4, §37.2"
    doc: >-
      §37.2's named reference environment, with the seven facts an absolute target has to be read
      against and the note that the machine is shared. §32.4 puts release qualification on a
      named environment, so the name is a registry rather than a paragraph (ADR-0490).

  - file: performance_baseline.json
    domain: null
    validated_by: [xtask/src/perf.rs::check_registries]
    consumed_by: [xtask]
    spec: "v0.4.1 §32.3, §32.4, §37.3, §37.4, Appendix F.4"
    doc: >-
      §32.4's regression baseline. Every record carries §32.3's six metrics, the environment it
      was measured on, its temperature, its iteration count and the load average of the run that
      wrote it. JSON rather than YAML because it is written by a command, not by a person
      (ADR-0489).

  - file: expected_test_skips.yaml
    domain: expected_test_skips
    validated_by: [xtask/src/scan.rs::check_expected_skips]
    consumed_by: [ono-testkit, xtask]
    spec: "v0.4.1 §38.2, §38.3, §65.10, Appendix G"
    doc: >-
      Every test that may announce a skip, with the precondition that would cause it and whether
      the canonical CI environment expects it. §38.3 makes an unexpected skip a failure, which
      needs a declaration of what was expected.

  - file: module_architecture.yaml
    domain: null
    validated_by: [xtask/src/architecture.rs::check]
    consumed_by: [xtask]
    spec: "v0.4.1 §29.2, §30.2, §31.2, Appendix I"
    doc: >-
      The module boundaries §29–§31 require of the parser, the evaluator and the session, with
      the responsibility each owns and the size it may not exceed. Appendix I's guardrails as
      data, so a decomposition cannot quietly reassemble itself (ADR-0523).

  - file: terminology.yaml
    domain: null
    validated_by: [xtask/src/terminology.rs::check_documents]
    consumed_by: [xtask]
    spec: "v0.4.1 §19.1, §19.2, §51.1"
    doc: >-
      §19.1's eight security terms: what each one means, the phrasings that overstate it and the
      qualifiers that make the claim defined. Rendered into `docs/reference/terminology.md` and
      read by the documentation gate, so the rule and the definition are one thing (ADR-0536).

  - file: remote_trust.yaml
    domain: null
    validated_by:
      - xtask/src/terminology.rs::check_documents
      - xtask/src/contracts.rs::check_remote_trust_boundaries
    consumed_by: [xtask]
    spec: "v0.4.1 §51.3, §7.3, §14.3"
    doc: >-
      §51.3's six remote trust concepts, each stating what it establishes *and* what it does not,
      with the §6.1 boundary it belongs to. A page that names six headings and conflates two of
      them is what §51.3 is written against (ADR-0538).

  - file: release_verification.yaml
    domain: null
    validated_by: [xtask/src/verification.rs::check_sequence]
    consumed_by: [xtask]
    spec: "v0.4.1 §47.5, §67.7"
    doc: >-
      The five steps a user runs to verify a release before installing it, written once and
      compared against the README, the Wiki's Install page and the generated reference so three
      documents cannot print three different sequences (ADR-0542, ADR-0545).

# ---------------------------------------------------------------------------------------------
# §52.3's first named failure: an unknown capability id in an authorization fixture.
# ---------------------------------------------------------------------------------------------
#
# §52.3: "Unknown capability IDs in an authorization fixture or unknown control IDs in a KUANG
# tier definition MUST fail the gate." The second half has been checked since H4. The first looked
# covered and was not: `ActionGrant` refuses a malformed id at construction and dispatch denies an
# id naming nothing, but both are runtime behaviour. A fixture granting `process.invented` is a
# test asserting against a capability the product does not have, and on the day that id is a typo
# for a real one, nobody is told.
#
# `xtask/src/contracts.rs::check_authorization_fixtures` reads every `actions=` grant in
# `crates/**` and `docker/acceptance/**` and resolves each id against
# `docs/spec/capabilities.yaml`. Some fixtures name an invalid id on purpose, because the refusal
# *is* their subject — §9.5 forbids a wildcard and Appendix C denies what the agent cannot name.
# Those are listed here rather than pattern-matched, and each must really be undeclared: an
# exemption that resolves to a real capability would wave a typo through, so the gate refuses one.
authorization_fixtures:
  deliberately_invalid:
    - id: "process.*"
      reason: >-
        §9.5: "wildcards and risk-class grants are not permitted". The fixture stores the pattern
        to prove the parser refuses it, so the id is meant to be unresolvable.
      used_by: crates/ono-cli/tests/authorized_clients.rs::should_refuse_a_wildcard_or_risk_class_in_an_action_grant
