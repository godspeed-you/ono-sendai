# The runtime resource limits of Ono-Sendai, as data.
#
# Source: v0.4.1 Appendix A (Default Hardening Limits — the normative defaults), §55.1 (the
# canonical `limits.*` configuration keys), §55.2 (numeric limits are range-checked at load time
# and a security-sensitive limit never silently becomes unlimited), §55.4 (environment overrides
# follow the existing configuration architecture), §52.1 (`materialization_limits` is one of the
# seven machine-readable hardening registries) and §52.2, the sentence this file exists to obey:
#
#   "A number such as `max_connections = 32` MUST not be independently typed into five files if
#    one contract can generate the others."
#
# So every hardening limit in the product has exactly one written-down home, and it is here.
# Decisions: ADR-0456.
#
# Authority: `ono_cli::settings::CATALOGUE` declares the same keys with the same types, defaults
# and ranges, and `crates/ono-cli/tests/resource_limits.rs` compares the two in both directions —
# a key the shell declares and this file omits is a failure, and so is a key this file declares
# and the shell has never heard of. `inspect limits` reads the shell's catalogue, so a user and a
# test read the figures the shell actually enforces rather than a second copy of them (§54.3).
#
# Fields
#
#   key         the dotted configuration key, as §55.1 spells it.
#   type        `int` for a count or a duration in milliseconds, `bytesize` for a byte ceiling.
#               Appendix A: "Limits MUST be expressed internally in integer base units and
#               rendered in human-readable units separately", so a `bytesize` is stored in bytes.
#   default     Appendix A's value, in base units.
#   min, max    the permitted range, inclusive. §55.2 requires the check; the range is this
#               registry's decision and ADR-0456 defends each bound.
#   unit        what the number counts, for rendering.
#   enforced_by which component reads the effective value. `pending` means the key is declared,
#               validated and readable, and the component that will read it has not landed yet —
#               stated rather than implied, so no reader infers an effect from a key's existence.
#   spec        the section that fixes the default.
#
# Zero is not unlimited. §22.2: "A value of zero means 'no values permitted', not unlimited."
# Where zero would turn a security boundary off rather than closed, the minimum is one instead,
# and the row says so.

version: 1

limits:
  # --- materialization, §22.2 -----------------------------------------------------------------
  - key: limits.materialize_items
    type: int
    default: 100000
    min: 0
    max: 1000000000
    unit: values
    enforced_by: ono-pipeline
    spec: "v0.4.1 §22.2, Appendix A"
    doc: >-
      How many values one global operation — `sort`, `group`, `measure`, an explicit collect —
      may hold at once. Zero permits none.
  - key: limits.materialize_bytes
    type: bytesize
    default: 134217728
    min: 0
    max: 1099511627776
    unit: bytes
    enforced_by: ono-pipeline
    spec: "v0.4.1 §22.2, Appendix A"
    doc: >-
      How many bytes one global operation may hold at once, counted with the deterministic
      approximate estimator of §21.2. Both this and the item ceiling apply; the first reached
      wins.
  - key: limits.command_capture_bytes
    type: bytesize
    default: 268435456
    min: 0
    max: 1099511627776
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §23.4, Appendix A"
    doc: >-
      How many bytes every capture inside one shell command may retain together — a ceiling
      across nested capture contexts, not an allowance each capture may spend in full.

  # --- retained result history, §24.1 ----------------------------------------------------------
  - key: limits.history_results
    type: int
    default: 16
    min: 0
    max: 4096
    unit: results
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many recent pipeline results `@-1` … `@-N` can reach. Zero retains none.
  - key: limits.history_items_per_result
    type: int
    default: 10000
    min: 0
    max: 100000000
    unit: values
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many values of one result are retained for reuse. Retention only; the emitted output
      is never truncated.
  - key: limits.history_bytes_per_result
    type: bytesize
    default: 16777216
    min: 0
    max: 68719476736
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many bytes of one result are retained. A single value larger than this is not retained
      at all, and still flows through the pipeline normally (§24.2).
  - key: limits.history_bytes_total
    type: bytesize
    default: 67108864
    min: 0
    max: 274877906944
    unit: bytes
    enforced_by: ono-cli
    spec: "v0.4.1 §24.1, Appendix A"
    doc: >-
      How many bytes the whole result history may hold. Oldest entries are evicted until it fits
      — history is a cache, so it evicts rather than failing the user's command (§24.2).

  # --- completion budgets, §36.2 ---------------------------------------------------------------
  - key: limits.completion_soft_ms
    type: int
    default: 50
    min: 1
    max: 60000
    unit: milliseconds
    enforced_by: ono-cli
    spec: "v0.4.1 §36.2, Appendix A"
    doc: >-
      When completion may begin answering with what it has. One rather than zero: a budget of
      zero would answer before it looked.
  - key: limits.completion_hard_ms
    type: int
    default: 150
    min: 1
    max: 60000
    unit: milliseconds
    enforced_by: ono-cli
    spec: "v0.4.1 §36.2, Appendix A"
    doc: >-
      When completion stops discovering, whatever it has found. Not to be set below the soft
      budget.

  # --- the listening agent, §12 ----------------------------------------------------------------
  # Declared, typed and range-checked here because §55.2's binding sentence is about the
  # *configuration* layer: "A security-sensitive agent limit MUST NOT silently become unlimited
  # because a value failed to parse." Enforcement is `ono-remote`'s and arrived with phase H3
  # (ADR-0501): `ono_protocol::Limits` carries all four as fields, clamps every setter into the
  # range declared below, and `ono_remote::ListeningAgent` applies them at the two moments
  # `docs/spec/hardening/remote_limits.yaml` names. That file describes the enforcement and
  # references these keys; the numbers stay here, once (§52.2).
  - key: limits.remote_connections
    type: int
    default: 32
    min: 1
    max: 65536
    unit: connections
    enforced_by: ono-remote
    spec: "v0.4.1 §12.1, Appendix A"
    doc: >-
      Concurrent authenticated connections one agent accepts. One rather than zero: a ceiling of
      zero would silently turn the listener off, and §2.3 wants a boundary that refuses to say so.
  - key: limits.remote_pending_handshakes
    type: int
    default: 16
    min: 1
    max: 65536
    unit: handshakes
    enforced_by: ono-remote
    spec: "v0.4.1 §12.2, Appendix A"
    doc: >-
      Connections that may be mid-negotiation at once, before any of them is authenticated.
  - key: limits.remote_connections_per_client
    type: int
    default: 4
    min: 1
    max: 65536
    unit: connections
    enforced_by: ono-remote
    spec: "v0.4.1 §12.3, Appendix A"
    doc: >-
      Concurrent connections one authenticated fingerprint may hold, so one client cannot fill
      the global ceiling.
  - key: limits.remote_handshake_timeout_ms
    type: int
    default: 10000
    min: 100
    max: 600000
    unit: milliseconds
    enforced_by: ono-remote
    spec: "v0.4.1 §12.2, Appendix A"
    doc: >-
      How long TLS and protocol negotiation may take before the connection is dropped. The floor
      is 100 ms rather than 1: a timeout too short to complete a handshake is a listener that
      accepts nobody, which is a denial of service spelled as a configuration value.
