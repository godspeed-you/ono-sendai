canonical_ci:
  # The `ubuntu-latest` GitHub runner that `.github/workflows/ci.yml` runs the gate on: an
  # unprivileged user, a live systemd with a readable journal, and a kernel that answers
  # rtnetlink and sock_diag. Every prerequisite above is one that image supplies, so §38.2's
  # preferred count of zero is the honest expectation — with the two exceptions below, which are
  # not lost coverage.
  #
  # Three entries, and none of them is coverage anybody lost. Each is a test that skips on every
  # host by construction rather than because a prerequisite is missing, so listing them is what
  # makes §38.3's reverse check a guard rather than a nuisance: if one stops emitting its marker,
  # `skip-check` says so.
  #
  # Measured on 2026-09-02 by a full `cargo test --workspace --all-features` on the reference
  # developer machine, which supplies every prerequisite the `declared:` rows above name — a
  # live systemd with a readable journal, rtnetlink and sock_diag, an unprivileged user, a second
  # mount, and the external `find` and `look`. The `ubuntu-latest` runner supplies the same set,
  # so §38.2's preferred count of zero environmental skips is the expectation, and the first run
  # that disagrees is exactly the signal §38.3 exists to raise.
  expected_skips:
    # The helper's own suite proves the marker's shape by emitting one.
    - "crates/ono-testkit/tests/harness.rs::should_name_the_test_the_reason_and_the_category_when_a_skip_is_announced"
    - "crates/ono-testkit/tests/harness.rs::should_offer_a_require_helper_that_records_an_unmet_prerequisite"
    # The re-exec entry point the PTY tests drive. `cargo test` runs it once with no role in the
    # environment, and that run has nothing to act as.
    - "crates/ono-process/tests/terminal_control.rs::acts_as_the_shell_when_a_role_is_requested"

  # Skips whose outcome is a property of the host rather than of this repository, each with the
  # condition that decides it. `skip-check` neither requires nor forbids these — it would be a
  # coin toss in both directions — but §38.2 asks that an intentional skip be listed with its
  # reason, and that is what these rows are. Nothing goes here for being awkward: an entry names
  # a capability the runner either has or has not, and a reader can check it in one command.
  permitted_skips:
    - id: "crates/ono-cli/tests/spatial_first_output.rs::should_answer_or_refuse_within_the_interactive_budget_on_the_profile_l_fixture"
      condition: "`ulimit -Hn` is at least 101024"
      doc: >-
        Profile L's socket axis needs 101 024 open descriptors. `SocketPopulation::try_of` raises
        the soft limit toward the hard one first, so this skips only where the *hard* limit is
        short — which the development machine's 524 288 is not and the GitHub runner's may be.
        Reported as `missing_privilege` because only a privileged process can raise a hard limit.
    - id: "crates/ono-cli/tests/spatial_map.rs::should_return_the_same_node_identities_when_the_terminal_width_changes"
      condition: "the host's ranked object population holds still across two `map --json` reads at the same width, in at least one of three attempts"
      doc: >-
        `COLUMNS` is read from the process environment, so the two widths are two runs, and the
        default map is relevance-ranked and cut at the §34.2 node budget. A host churning
        processes fast enough that two identical reads disagree cannot say whether a third read
        at another width disagreed because of the width. Three attempts on a machine at load 124
        of 8 processors never reached it; a busier one might, and the honest answer there is that
        the run could not observe what the test is about (ADR-0552).
    - id: "crates/ono-spatial-query/tests/profiles.rs::should_build_every_declared_profile_at_the_cardinality_the_registry_states"
      condition: "`ulimit -Hn` is at least 101024"
      doc: >-
        The same limit, reached from the registry side: this test builds every profile whose
        socket axis declares itself gate-buildable, and skips the ones the host cannot hold.
