# The expected test skip set of Ono-Sendai, as data.
#
# Source: v0.4.1 §38.2 ("For the repository's canonical CI environment, the expected skip set MUST
# be declared … If non-zero skips are intentional, their IDs and reasons MUST be listed in a
# machine-readable file"), §38.3 (an unexpected skip fails the gate, and so does a declared skip
# that stops happening), §38.4 (the six stable categories), §52.1 (`expected_test_skips` is one of
# the seven machine-readable hardening registries) and Appendix G (the test result contract).
# Decisions: ADR-0428, ADR-0513, ADR-0514.
#
# Two lists, because §38.2 and §38.3 ask two different questions.
#
#   declared             every test in this repository that *can* announce a skip, with the §38.4
#                        category it announces. `xtask spec-check` reads the tree and compares:
#                        a skip nobody declared fails the gate, and a row whose test no longer
#                        skips fails it too, so the registry cannot fall behind the suite.
#
#   canonical_ci         the skips a run in the canonical CI environment is *expected* to take.
#     .expected_skips    §38.2 prefers this list empty. `cargo xtask skip-check <log>` compares a
#                        run's `SKIPPED` markers against it in both directions (§38.3): a skip
#                        outside the list fails the run, and a listed skip that did not happen
#                        fails it as well.
#
# Fields of a `declared` row
#
#   id            `<path>::<test>` — the form `docs/ACCEPTANCE.md` names a proof by.
#   category      one of the six of §38.4.
#   prerequisite  what the host has to supply for the test to run. This is the sentence a
#                 maintainer reads when deciding whether CI could supply it instead (§38.2).
#
# The marker a run emits is `SKIPPED <test>: <category>: <detail>` (ADR-0513), so the observation
# and this file share a vocabulary and no second mechanism has to agree with them.

