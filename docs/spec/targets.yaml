# Ono-Sendai target registry.
#
# Source: spec §8.1 (system targets), §8.2 (development targets), §8.3 (infrastructure
# targets), with the design rule of §8.4. Every name the three lists give is present; nothing
# is invented beyond the two entries marked `# not in §8.x` below, which spec §7.1 and §9.1
# name as targets of an actual verb.
#
# `id`        stable identity, `ono.target.<name>` (spec §31.5 reserves `ono.*`).
# `category`  system | development | infrastructure, as spec §8 groups them.
# `summary`   what the target denotes.
# `schema`    the canonical object schema a producer of this target emits, where one is
#             defined in `docs/spec/schemas/`. `null` where the schema is still deferred; the
#             deferred set is enumerated in ADR-0012.
# `phase`     the spec §37 phase that delivers the target, or `planned` when no phase does.
#             `planned` is an honest label, not a euphemism: the target is part of the product
#             surface, and nothing in §37 delivers it yet.
#
# Provider qualification (spec §8.3) resolves collisions: `get k8s:namespace` and
# `get linux:namespace` are different targets reached through the same word.

version: 1

categories:
  - name: system
    doc: Targets of the core Linux providers, spec §8.1.
  - name: development
    doc: >-
      Spec §8.2 — native only where Ono can expose meaningful structured semantics without
      becoming a replacement for a specialized tool.
  - name: infrastructure
    doc: Spec §8.3 — contributed by provider modules, provider-qualified where ambiguous.

targets:
  # --- system, spec §8.1 -------------------------------------------------------------------
  - id: ono.target.process
    name: process
    category: system
    summary: A running process, identified by pid and start time to survive pid reuse.
    schema: ono.process/1
    phase: C
  - id: ono.target.service
    name: service
    category: system
    summary: A service-manager unit as the active service provider sees it.
    schema: ono.service/1
    phase: C
  - id: ono.target.job
    name: job
    category: system
    summary: A shell job — a backgrounded external pipeline or a detached native live view.
    schema: ono.job/1
    phase: F
  - id: ono.target.thread
    name: thread
    category: system
    summary: A thread of a process.
    schema: null
    phase: planned
  - id: ono.target.file
    name: file
    category: system
    summary: A filesystem object and its metadata; path is a reference, inode is identity.
    schema: ono.file/1
    phase: C
  - id: ono.target.dir
    name: dir
    category: system
    summary: A directory, whose entries are File records.
    schema: ono.file/1
    phase: C
  - id: ono.target.mount
    name: mount
    category: system
    summary: A mounted filesystem with its structured options.
    schema: ono.mount/1
    phase: C
  - id: ono.target.filesystem
    name: filesystem
    category: system
    summary: A filesystem or backing volume, mounted or not.
    schema: ono.filesystem/1
    phase: C
  - id: ono.target.device
    name: device
    category: system
    summary: A block or character device.
    schema: null
    phase: C
  - id: ono.target.socket
    name: socket
    category: system
    summary: A socket with its endpoints, owning process and state.
    schema: ono.socket/1
    phase: C
  - id: ono.target.connection
    name: connection
    category: system
    summary: A connection-oriented view over sockets.
    schema: null
    phase: C
  - id: ono.target.interface
    name: interface
    category: system
    summary: A network interface with its addresses, state and counters.
    schema: ono.interface/1
    phase: C
  - id: ono.target.route
    name: route
    category: system
    summary: A routing table entry.
    schema: ono.route/1
    phase: C
  - id: ono.target.neighbor
    name: neighbor
    category: system
    summary: An ARP or NDP neighbour entry.
    schema: ono.neighbor/1
    phase: C
  - id: ono.target.dns
    name: dns
    category: system
    summary: The name-resolution service, queried explicitly rather than implicitly.
    schema: null
    phase: C
  - id: ono.target.host
    name: host
    category: system
    summary: A known host from a configured source, reachable or not.
    schema: null
    phase: H
  - id: ono.target.host-key
    name: host-key
    category: system
    summary: A host key this shell has pinned, and the fingerprint it was pinned by.
    schema: ono.host-key/1
    phase: H
  - id: ono.target.user
    name: user
    category: system
    summary: A user account, identified by uid, with the numeric identity kept when NSS cannot resolve it.
    schema: ono.user/1
    phase: C
  - id: ono.target.group
    name: group
    category: system
    summary: A group account, identified by gid.
    schema: ono.group/1
    phase: C
  - id: ono.target.session
    name: session
    category: system
    summary: A login or seat session.
    schema: null
    phase: C
  - id: ono.target.env
    name: env
    category: system
    summary: The environment, as records rather than as a flat string namespace.
    schema: ono.env-var/1
    phase: C
  - id: ono.target.command
    name: command
    category: system
    summary: A native or external command and its metadata, as discoverable data.
    schema: null
    phase: D
  - id: ono.target.package
    name: package
    category: system
    summary: An installed or available package, through a package provider.
    schema: ono.package/1
    phase: C
  - id: ono.target.kernel
    name: kernel
    category: system
    summary: The running kernel, its version and its parameters.
    schema: null
    phase: planned
  - id: ono.target.module
    name: module
    category: system
    summary: A loaded kernel module.
    schema: null
    phase: planned
  - id: ono.target.container
    name: container
    category: system
    summary: A container, through an installed container provider.
    schema: ono.container/1
    phase: C
  - id: ono.target.namespace
    name: namespace
    category: system
    summary: >-
      A kernel namespace. Spec §8.3 lists a Kubernetes namespace under the same word; the two
      are distinguished by provider qualification — `get linux:namespace` and `get k8s:namespace`.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.cgroup
    name: cgroup
    category: system
    summary: A control group and its resource accounting.
    schema: null
    phase: planned
  - id: ono.target.journal
    name: journal
    category: system
    summary: The structured system journal.
    schema: ono.journal-event/1
    phase: C
  - id: ono.target.log
    name: log
    category: system
    summary: A log source, queried as records rather than parsed as text.
    schema: ono.log-record/1
    phase: C
  - id: ono.target.port
    name: port
    category: system
    summary: A transport port, as the subject of a reachability test.
    schema: null
    phase: C
  - id: ono.target.signal
    name: signal
    category: system
    summary: A Unix signal, as the object a `send` or `kill` delivers.
    schema: null
    phase: planned
  - id: ono.target.plugin
    name: plugin
    category: system
    summary: A KUANG/11 package in one of its install/enable/load states (spec §31.8).
    schema: null
    phase: I
  - id: ono.target.capability
    name: capability
    category: system
    summary: A KUANG/11 capability definition, request, grant or lease (spec §31.16).
    schema: null
    phase: I
  - id: ono.target.assistant
    name: assistant
    category: system
    summary: A loaded assistant extension (spec §31.41).
    schema: null
    phase: I
  - id: ono.target.model
    name: model
    category: system
    summary: A configured model provider and its policy characteristics (spec §31.43).
    schema: null
    phase: I
  - id: ono.target.view
    name: view
    category: system
    summary: A specialized view or TUI lens contributed by a package (spec §31.27).
    schema: null
    phase: I
  - id: ono.target.analysis
    name: analysis
    category: system
    summary: An analysis program usable as a pipeline stage (spec §31.29).
    schema: null
    phase: I
  - id: ono.target.finding
    name: finding
    category: system
    summary: A finding emitted by an analysis or an assistant, with its evidence (spec §31.24).
    schema: null
    phase: I
  - id: ono.target.audit
    name: audit
    category: system
    summary: A capability-sensitive KUANG/11 action recorded in the audit trail (spec §31.37).
    schema: null
    phase: I

  # Not in §8.1's list, but named as the target of a verb elsewhere in the spec. Kept here so
  # the registry covers every `<verb> <target>` pair the spec actually writes down.
  - id: ono.target.link
    name: link
    category: system
    summary: A persistent Ono remote execution link. # spec §9.1 Remote, §21
    schema: null
    phase: H
  # --- the spatial interface, v0.4 §3.3 -----------------------------------------------------
  # A `Place` is "the current spatial interpretation of a SpatialObject or a canonical aggregate
  # space" (v0.4 §3.3). It is the target word of the one spatial command that keeps one, because
  # bare `find` belongs to findutils (ADR-0124); every other spatial verb takes the bare name.
  - id: ono.target.place
    name: place
    category: system
    summary: A place in the spatial interface — an object or a canonical space (v0.4 §3.3).
    schema: ono.spatial-place/1
    phase: S

  # v0.4 §19.3 writes the federated map as `map links`, in the plural and beside the singular
  # `link` above. The two are different questions: `get link` enumerates the links this session
  # holds, `map links` draws the hosts they reach and the edges between them (§22). The registry
  # records the word the spec actually writes; ADR-0172 says why it is a target word at all when
  # every other spatial verb takes a bare name.
  - id: ono.target.links
    name: links
    category: system
    summary: The federated map of this host and the hosts it holds links to (v0.4 §19.3).
    schema: ono.spatial-map/1
    phase: S

  - id: ono.target.context
    name: context
    category: system
    summary: An entry on the context stack. # spec §7.1 (`leave`), §14.1
    schema: null
    phase: E
  - id: ono.target.config
    name: config
    category: system
    summary: A resolved configuration setting with its provenance. # spec §30, ADR-0010
    schema: ono.config-setting/1
    phase: A

  # --- development, spec §8.2 --------------------------------------------------------------
  # "These SHOULD only be native when Ono-Sendai can expose meaningful structured semantics
  # without becoming a replacement for specialized tools" (§8.2). No phase of §37 delivers any
  # of them, so all are `planned`.
  - id: ono.target.repo
    name: repo
    category: development
    summary: A source repository.
    schema: null
    phase: planned
  - id: ono.target.branch
    name: branch
    category: development
    summary: A branch within a repository.
    schema: null
    phase: planned
  - id: ono.target.commit
    name: commit
    category: development
    summary: A commit within a repository.
    schema: null
    phase: planned
  - id: ono.target.worktree
    name: worktree
    category: development
    summary: A checked-out worktree of a repository.
    schema: null
    phase: planned
  - id: ono.target.build
    name: build
    category: development
    summary: A build invocation and its outcome.
    schema: null
    phase: planned
  - id: ono.target.test
    name: test
    category: development
    summary: >-
      A test case or test run. The word is also the `test` verb of §7.1; the two never collide
      because a target only ever appears after a verb.
    schema: null
    phase: planned
  - id: ono.target.artifact
    name: artifact
    category: development
    summary: A build artifact.
    schema: null
    phase: planned
  - id: ono.target.project
    name: project
    category: development
    summary: A project as its tooling defines it.
    schema: null
    phase: planned

  # --- infrastructure, spec §8.3 -----------------------------------------------------------
  # "Provider modules MAY add" — these arrive with a provider, not with a core phase, so all
  # are `planned` and all are provider-qualified where the word is ambiguous.
  - id: ono.target.pod
    name: pod
    category: infrastructure
    summary: A Kubernetes pod.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.node
    name: node
    category: infrastructure
    summary: A cluster node.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.vm
    name: vm
    category: infrastructure
    summary: A virtual machine.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.image
    name: image
    category: infrastructure
    summary: A container or machine image.
    schema: ono.image/1
    phase: C
    provider_qualified: true
  - id: ono.target.volume
    name: volume
    category: infrastructure
    summary: A storage volume managed by an infrastructure provider.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.network
    name: network
    category: infrastructure
    summary: A managed virtual network.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.secret
    name: secret
    category: infrastructure
    summary: >-
      A managed secret. Values carry the secret semantic type: redacted by default, revealed
      only by an explicit action, and never entering history through renderer output (§17.5).
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.endpoint
    name: endpoint
    category: infrastructure
    summary: A service endpoint exposed by an infrastructure provider.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.database
    name: database
    category: infrastructure
    summary: A database instance or logical database.
    schema: null
    phase: planned
    provider_qualified: true
  - id: ono.target.queue
    name: queue
    category: infrastructure
    summary: A message queue or topic.
    schema: null
    phase: planned
    provider_qualified: true
