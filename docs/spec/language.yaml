# The Ono language surface, as data.
#
# Purpose (spec §46.3, §27.1): completion, syntax highlighting, the editor's tokenizer fixtures
# and the language reference are generated from this file plus `grammar.ebnf`, so that the
# editor and the evaluator can never disagree about what a keyword or an operator is.
#
# Authority: `docs/spec/grammar.ebnf` is the grammar; this file restates the *lexical and
# resolution* surface it implies, and adds nothing the grammar does not contain. The decisions
# behind both are ADR-0009 (concrete grammar, argument modes) and ADR-0011 (name resolution).
# Where this file and grammar.ebnf could ever disagree, grammar.ebnf wins.

version: 1
grammar: grammar.ebnf

# ---------------------------------------------------------------------------------------------
# Keywords. A WORD matching an identifier is a keyword only where the grammar asks for one; in
# words-mode argument position `let` is the word "let" and nothing more (ADR-0009).
# ---------------------------------------------------------------------------------------------
keywords:
  statement: [let, fn, alias, if, else, for, while, match, try, catch, return, break, continue, use]
  expression: [and, or, not, in]
  literal: [true, false, null]
  reserved:
    words: [elif, until]
    doc: >-
      Reserved, not implemented. ADR-0009 and grammar.ebnf list them among the expression-mode
      heads; the grammar spells the constructs `else if` and `while`. They are reserved so that
      a future spelling cannot silently change the meaning of an existing script.

# ---------------------------------------------------------------------------------------------
# Operators, lowest precedence first. `precedence` is a rank: a higher number binds tighter.
# Derived directly from the production chain of grammar.ebnf
# (logical_or -> logical_and -> equality -> comparison -> membership -> additive ->
#  multiplicative -> unary -> postfix), which is spec §6.3's expression list made concrete.
# ---------------------------------------------------------------------------------------------
operators:
  expression:
    - {symbol: "or",     precedence: 1, associativity: left,   arity: binary, production: logical_or,      doc: "Logical disjunction over truth values."}
    - {symbol: "and",    precedence: 2, associativity: left,   arity: binary, production: logical_and,     doc: "Logical conjunction over truth values."}
    - {symbol: "==",     precedence: 3, associativity: left,   arity: binary, production: equality,        doc: "Equality. Compares values, converting compatible units first."}
    - {symbol: "!=",     precedence: 3, associativity: left,   arity: binary, production: equality,        doc: "Inequality."}
    - {symbol: "<",      precedence: 4, associativity: left,   arity: binary, production: comparison,      doc: "Less than. A comparison only in expression mode; a redirection in words mode."}
    - {symbol: "<=",     precedence: 4, associativity: left,   arity: binary, production: comparison,      doc: "Less than or equal."}
    - {symbol: ">",      precedence: 4, associativity: left,   arity: binary, production: comparison,      doc: "Greater than. A comparison only in expression mode; a redirection in words mode."}
    - {symbol: ">=",     precedence: 4, associativity: left,   arity: binary, production: comparison,      doc: "Greater than or equal."}
    - {symbol: "in",     precedence: 5, associativity: left,   arity: binary, production: membership,      doc: "List or range membership."}
    - {symbol: "not in", precedence: 5, associativity: left,   arity: binary, production: membership,      doc: "Negated membership."}
    - {symbol: "~=",     precedence: 5, associativity: left,   arity: binary, production: membership,      doc: "Regex match. Spec §6.3 requires regex to be an explicit operator, never implicit."}
    - {symbol: "!~=",    precedence: 5, associativity: left,   arity: binary, production: membership,      doc: "Negated regex match."}
    - {symbol: "+",      precedence: 6, associativity: left,   arity: binary, production: additive,        doc: "Addition; also duration and byte-size arithmetic within one dimension."}
    - {symbol: "-",      precedence: 6, associativity: left,   arity: binary, production: additive,        doc: "Subtraction; also timestamp minus duration."}
    - {symbol: "*",      precedence: 7, associativity: left,   arity: binary, production: multiplicative,  doc: "Multiplication."}
    - {symbol: "/",      precedence: 7, associativity: left,   arity: binary, production: multiplicative,  doc: "Division. In words mode a bare `/` is part of a path word, never division."}
    - {symbol: "%",      precedence: 7, associativity: left,   arity: binary, production: multiplicative,  doc: "Remainder. Adjacent to a numeric literal it is instead the percent unit suffix."}
    - {symbol: "not",    precedence: 8, associativity: prefix, arity: unary,  production: unary,           doc: "Logical negation."}
    - {symbol: "-",      precedence: 8, associativity: prefix, arity: unary,  production: unary,           doc: "Arithmetic negation."}
    - {symbol: ".",      precedence: 9, associativity: left,   arity: postfix, production: postfix,        doc: "Field access. `process.user.name`."}
    - {symbol: "?.",     precedence: 9, associativity: left,   arity: postfix, production: postfix,        doc: "Null-safe field access: yields null instead of an error when the receiver is null."}
    - {symbol: "[]",     precedence: 9, associativity: left,   arity: postfix, production: postfix,        doc: "Index or key lookup."}
    - {symbol: "()",     precedence: 9, associativity: left,   arity: postfix, production: call_args,      doc: "Function call."}
  pipeline:
    - {symbol: "|",  production: stage_list, doc: "Connect one stage's output to the next stage's input."}
    - {symbol: "&&", production: and_or,     doc: "Run the next pipeline only if this one succeeded. Chains on exit status, not on truth."}
    - {symbol: "||", production: and_or,     doc: "Run the next pipeline only if this one failed."}
    - {symbol: "&",  production: pipeline,   doc: "Detach the pipeline into a job (spec §18.4)."}
    - {symbol: ";",  production: terminator, doc: "End a statement."}
  redirection:
    doc: >-
      Redirections exist only on words-mode stages, which are exactly the stages that produce
      bytes (ADR-0009). A structured pipeline must pass through a serializer before it may reach
      a byte sink, which spec §12.5 requires in any case.
    forms:
      - {symbol: ">",   doc: "Redirect stdout to a file, truncating it."}
      - {symbol: ">>",  doc: "Redirect stdout to a file, appending."}
      - {symbol: "<",   doc: "Redirect stdin from a file."}
      - {symbol: ">&",  doc: "Duplicate an output file descriptor onto another, as in `2>&1`."}
      - {symbol: "<&",  doc: "Duplicate an input file descriptor onto another."}
    fd_prefix:
      doc: A decimal file descriptor may prefix any redirection with no intervening space, as in `2>`.

# ---------------------------------------------------------------------------------------------
# Argument modes (ADR-0009). The mode is a syntactic property of the head word, known before any
# registry is loaded, so the editor can parse a line as it is typed.
# ---------------------------------------------------------------------------------------------
argument_modes:
  - name: words
    doc: >-
      Every head not listed as expression-mode: external commands, native verb-target commands,
      and `to` / `from` / `format`. `<` `>` `>>` are redirections; bare words are word atoms and
      keep their exact source text, so an external command receives what was typed.
    default: true
  - name: expression
    doc: >-
      `<` and `>` are comparisons; a bare identifier that is not a keyword and is not followed
      by `(` is a field path, so `select pid name cpu` and `sort cpu desc` need no quoting. No
      redirection is possible.
    heads:
      [where, select, sort, group, take, skip, each, reduce, count, measure, join, diff,
       if, elif, while, until, let, return, match]
escapes:
  words_into_expression:
    syntax: "( … )"
    doc: "A parenthesised value inside a words-mode argument, e.g. `echo (get process | count)`."
  expression_into_words:
    doc: "A quoted string is a word wherever a word is expected; a word is never re-lexed as an operator."

# ---------------------------------------------------------------------------------------------
# Unit suffixes (spec §10.6). A numeric literal immediately followed by a suffix is a semantic
# scalar; adjacency is required, so `512 MiB` is two tokens and `512MiB` is one (ADR-0009).
# Comparisons convert compatible units and reject incompatible dimensions with
# `type.invalid_unit` (Ono-Sendai-E0203).
# ---------------------------------------------------------------------------------------------
unit_dimensions:
  - name: bytesize
    value_type: bytesize
    base: byte
    doc: Data sizes. Both the binary (IEC) and the decimal (SI) families are accepted and are not the same.
    units:
      - {suffix: B,   factor: 1,                         doc: byte}
      - {suffix: KiB, factor: 1024,                      doc: kibibyte}
      - {suffix: MiB, factor: 1048576,                   doc: mebibyte}
      - {suffix: GiB, factor: 1073741824,                doc: gibibyte}
      - {suffix: TiB, factor: 1099511627776,             doc: tebibyte}
      - {suffix: PiB, factor: 1125899906842624,          doc: pebibyte}
      - {suffix: KB,  factor: 1000,                      doc: kilobyte}
      - {suffix: MB,  factor: 1000000,                   doc: megabyte}
      - {suffix: GB,  factor: 1000000000,                doc: gigabyte}
      - {suffix: TB,  factor: 1000000000000,             doc: terabyte}
      - {suffix: PB,  factor: 1000000000000000,          doc: petabyte}
  - name: duration
    value_type: duration
    base: nanosecond
    doc: Spans of time. `m` is minutes; there is no month suffix, because a month is not a fixed span.
    units:
      - {suffix: ns, factor: 1,                doc: nanosecond}
      - {suffix: us, factor: 1000,             doc: microsecond}
      - {suffix: ms, factor: 1000000,          doc: millisecond}
      - {suffix: s,  factor: 1000000000,       doc: second}
      - {suffix: m,  factor: 60000000000,      doc: minute}
      - {suffix: h,  factor: 3600000000000,    doc: hour}
      - {suffix: d,  factor: 86400000000000,   doc: day}
      - {suffix: w,  factor: 604800000000000,  doc: week}
  - name: ratio
    value_type: float
    base: ratio
    doc: >-
      A proportion. `24.8%` is the float 0.248 carrying a percent unit; spec §33.5 requires
      serialization to emit the canonical value, not the display string.
    units:
      - {suffix: "%", factor: 0.01, doc: percent}

# ---------------------------------------------------------------------------------------------
# Literal forms (grammar.ebnf `literal`, spec §26.2, ADR-0009).
# ---------------------------------------------------------------------------------------------
literals:
  integer:
    forms: ["42", "-7", "0x1f", "0b1010", "1_000_000"]
    doc: Decimal, hexadecimal and binary; `_` is a digit separator. There is no octal literal.
  float:
    forms: ["1.5", "2.5e-3"]
    doc: Decimal fraction with an optional exponent.
  string:
    double_quoted:
      escapes: ["\\\\", "\\\"", "\\n", "\\r", "\\t", "\\0", "\\e", "\\xNN", "\\u{…}"]
      interpolation: ["$name", "$name.field", "$( … )"]
      doc: Escapes and interpolation both apply.
    single_quoted:
      doc: >-
        Raw: no escapes and no interpolation. A literal single quote can only be written in the
        double-quoted form.
    incomplete:
      doc: >-
        An unterminated string is `parse.incomplete` (Ono-Sendai-E0002), never `parse.syntax`,
        so the editor can tell "still typing" from "wrong".
  regex:
    form: "/…/flags"
    flags: [i, m, s, x]
    doc: >-
      A regex literal only in expression mode at operand position. In words mode `/etc/passwd`
      is a path word.
  boolean: {forms: ["true", "false"]}
  null: {forms: ["null"], doc: "Unknown or unavailable data. Never fabricated and never zero (spec §10.5)."}

# ---------------------------------------------------------------------------------------------
# Value type vocabulary (spec §10.2), as used by `docs/spec/schemas/*.yaml` and by the `type`
# annotations of `let` and `fn`. Three names extend §10.2's list; see ADR-0012.
# ---------------------------------------------------------------------------------------------
types:
  scalar: [null, bool, int, float, decimal, string, bytes, path, timestamp, duration,
           bytesize, regex, uuid, ip, ipnetwork, port]
  composite:
    - {name: "list<T>",   doc: "An ordered sequence."}
    - {name: "map<K,V>",  doc: "An association from keys to values."}
    - {name: record,      doc: "A map-like value with a stable schema and an optional semantic type name."}
    - {name: "stream<T>", doc: "A lazily produced sequence, possibly unbounded."}
    - {name: enum,        doc: "A closed set of named values, enumerated by the schema field that uses it."}
    - {name: error,       doc: "A structured error; `ono.error/1`. Spec §25 makes it a variant of Value."}
  references:
    - {name: "ref<schema-id>", doc: "An identity handle for an object of that schema: its identity fields plus a display name, resolvable to the full record. A ref that cannot be resolved keeps the numeric identity it was built from (spec §23.6)."}
    - {name: "<schema-id>",    doc: "A bare schema id as a type means an embedded record of that schema, in contrast to `ref<…>` (ADR-0012)."}
  extensions:
    - {name: value, doc: "Any value of the model. Used where a field genuinely spans the union, such as `ActionResult.target` (ADR-0012)."}

# ---------------------------------------------------------------------------------------------
# Variables, the current value and namespaces.
# ---------------------------------------------------------------------------------------------
variables:
  form: "$name"
  field_access: "$name.field.field"
  environment:
    form: "$env"
    doc: >-
      The environment record; `$env.PATH` is the environment variable. A bare `$NAME` resolves
      the shell binding if one exists and otherwise the environment variable of that name; the
      order is fixed and inspectable through `explain` (ADR-0009).
current_value:
  - {token: "@",   doc: "The item bound by the enclosing block (spec §19.4), or the interactive selection at the prompt (spec §6.4)."}
  - {token: "@-N", doc: "The Nth previous pipeline result. `@-1` is the previous one."}
  - {token: "@N",  doc: "Item N of the current result."}

namespaces:
  syntax: "<namespace>:<name>"
  doc: >-
    A qualified head forces one stage of the resolution order and skips the rest. A qualified
    name that does not resolve is `resolve.command_not_found` and is never silently retried in
    another namespace (ADR-0011). A head containing `/` is never a namespace: `./build.sh` and
    `/usr/bin/env` are paths.
  entries:
    - {prefix: "ono", resolves_in: native command registry, doc: "Native commands only, including KUANG/11 contributions."}
    - {prefix: "exec", resolves_in: PATH, doc: "External executables only."}
    - {prefix: "fn", resolves_in: user functions, doc: "User functions only."}
    - {prefix: "<module>", resolves_in: module or KUANG/11 package, doc: "Commands contributed by that module or package (spec §19.6, §31.22). Publisher-namespaced ids (spec §31.5) mean a package can always be addressed unambiguously."}

resolution_order:
  doc: >-
    A head word resolves in exactly this order, first match wins (ADR-0011, resolving the
    "suggested default" of spec §6.5). `explain <command>` reports which step matched, what was
    skipped and why — the order is reported by the code, not merely documented beside it.
  steps:
    - {step: 1, kind: keyword,  doc: "A language keyword or control form."}
    - {step: 2, kind: function, doc: "A user function, in the innermost scope that defines one."}
    - {step: 3, kind: alias,    doc: "An alias. Expanded exactly once, then re-resolved from step 1, so an alias may shadow a native command and a cycle terminates."}
    - {step: 4, kind: native,   doc: "The native command registry, including KUANG/11 contributions."}
    - {step: 5, kind: external, doc: "The first executable hit on PATH, with the usual executable-bit rules."}
    - {step: 6, kind: failure,  doc: "resolve.command_not_found (Ono-Sendai-E0101), with edit-distance suggestions over natives, functions, aliases and PATH (spec §15.4)."}
  ambiguity:
    doc: >-
      Two contributed commands claiming one unqualified name is `resolve.ambiguous`
      (Ono-Sendai-E0103), listing every candidate's qualified name. Steps 1–5 are ordered, and
      the core never allows two natives to claim one name (spec §40.1).

# ---------------------------------------------------------------------------------------------
# Statement forms (grammar.ebnf `statement`).
# ---------------------------------------------------------------------------------------------
statements:
  - {form: "let name [: type] = pipeline", doc: "Declare or rebind a binding in the current scope (spec §19.2). The only binding form; rebinding is a further `let`."}
  - {form: "fn name(param: Type = default, …) -> Type { … }", doc: "Declare a function (spec §19.3)."}
  - {form: "alias name = pipeline", doc: "Declare an alias (spec §6.5 step 2). Its text replaces the head word that names it, exactly once, and the result is resolved again from step 1 (ADR-0070)."}
  - {form: "if expr { … } else if expr { … } else { … }", doc: "Conditional (spec §19.5)."}
  - {form: "for name in expr { … }", doc: "Iterate over a list or stream."}
  - {form: "while expr { … }", doc: "Loop while the expression holds."}
  - {form: "match expr { pattern => { … }, … }", doc: "Pattern match."}
  - {form: "try { … } catch name { … }", doc: "Catch a structured error as a value; match on its `name` selector (ADR-0006)."}
  - {form: "return expr?", doc: "Return from a function."}
  - {form: "break", doc: "Leave the innermost loop."}
  - {form: "continue", doc: "Continue the innermost loop."}
  - {form: "use module", doc: "Bring a module's contributions into scope (spec §19.6)."}

brace_disambiguation:
  doc: >-
    `{ … }` is a record when the first significant token after `{` is an identifier or string
    followed by `:`, and `{}` is the empty record; otherwise it is a block. One token of
    lookahead, which the incremental parser can always perform (ADR-0009).
  record_example: "{name: \"x\", port: 80}"
  block_example: "each { restart service @ }"

comment:
  syntax: "#"
  doc: From `#` to end of line, when `#` begins a token.

builtin_functions:
  - {name: "now()", returns: timestamp, doc: "The current wall-clock time. Spec §6.3 uses it in `modified < now() - 7d`. The only function the specification names; others arrive with the phase that needs them."}
