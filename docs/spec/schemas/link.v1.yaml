# Link. Spec §21.1 creates one with `link host`, §14.4 makes the active link decide where
# provider calls run, and §37 Phase H delivers it. The record is the session's own bookkeeping:
# a link is not an object some provider found, it is a connection this shell holds.
id: ono.link/1
name: Link
summary: One remote Ono link this session holds.
identity: [name]
fields:
  name:
    type: string
    required: true
    doc: The host as the user named it — the prompt's spelling, and `enter link`'s argument.
  host:
    type: string
    required: true
    doc: >-
      The host the link points at. `link host prod-db` points at `prod-db` itself; a definition
      may point elsewhere (`add link prod-db --host 10.4.2.11`), and the table never hides where
      a link goes.
  transport:
    type: enum
    required: true
    values: [ssh, local, tcp]
    doc: >-
      How the bytes travel. `ssh` spawns the remote agent over OpenSSH; `local` spawns
      `ono --agent` as a child of this shell, which is how a link is exercised without a
      network; `tcp` is Ono's own authenticated transport of spec §21.5, where the peer proves
      it holds the key this shell pinned for the host (ADR-0353).
  mode:
    type: enum
    required: true
    values: [agent, agentless]
    doc: >-
      Whether the far side is the Ono agent of spec §21.4 or the agentless fallback of §21.3.
      The fallback MUST be visible because semantics and performance may differ, so the mode is
      part of the record wherever the link is described.
  state:
    type: enum
    required: true
    values: [defined, connected, closed]
    doc: >-
      Whether the link is usable now: `connected` once the handshake succeeded, `defined` for a
      definition recorded with `add link` that was never established, `closed` once torn down.
  targets:
    type: list<string>
    required: true
    doc: >-
      The targets the remote negotiated (spec §21.2), which is what its context can answer.
      Empty for a link that was never established: nothing was negotiated.
  protocol:
    type: int
    nullable: true
    doc: The link protocol version the handshake settled on (spec §21.2); null until it did.
  providers:
    type: list<string>
    nullable: true
    doc: >-
      The ids of the providers the remote offers (spec §21.2), which keep their ids across the
      link (ADR-0036); null until the handshake settled them.
default_view:
  columns: [name, host, transport, mode, state, targets]
