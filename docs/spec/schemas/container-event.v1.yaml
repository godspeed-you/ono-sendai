# ContainerEvent. Spec §18.2 turns a query into a stream of updates and §31.14 fixes the event
# envelope; ADR-0078 keys the object field by the target's own name. Spec §18.2 also requires
# polling to be explicit rather than invisible, which is what `source` is for.
id: ono.container-event/1
name: ContainerEvent
summary: One change to one container, as a live stream emits it.
identity: []
fields:
  kind:
    type: enum
    required: true
    values: [snapshot, added, changed, removed]
    doc: >-
      What happened. A subscription always begins with `snapshot` events carrying the current
      state (ADR-0024), so no consumer has to reconstruct the starting point.
  at:
    type: timestamp
    required: true
    doc: When the change was observed.
  container:
    type: record
    required: false
    doc: >-
      The container as it now is — or, for `removed`, as it last was. Identity lives inside it.
  changed:
    type: list<string>
    required: false
    doc: For `changed`, the names of the fields whose values moved. Null for every other kind.
  source:
    type: enum
    required: true
    values: [subscription, poll]
    doc: >-
      How the change was observed. `poll` means the runtime compared engine listings at the
      configured interval — explicit, as spec §18.2 requires.
default_view:
  columns: [kind, at, container, changed]
