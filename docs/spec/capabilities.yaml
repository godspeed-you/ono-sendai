# Ono-Sendai capability registry.
#
# Two capability vocabularies exist and they are not the same thing (ADR-0012):
#
#   `provider_capabilities`  what a *provider* must be able to do for a command to work. Every
#                            entry in `docs/spec/commands/` names one in its
#                            `provider_capability` field. Spec §27 shows `process.list`; §27.1
#                            derives a "provider capability matrix" from exactly this pairing,
#                            and §27.2 requires CI to verify that every stable command has an
#                            implementation for at least one provider.
#
#   `kuang_capabilities`     what a *KUANG/11 package* may ask Ono to do (spec §31.16). These
#                            are a security boundary: they are granted, scoped, leased,
#                            audited and revocable (§31.18–§31.21, §31.37). They gate an
#                            extension's access to the host API — they are not the mechanism by
#                            which a core command reaches a provider.
#
# Shared vocabulary:
#
#   `risk`       read        a point-in-time query with no side effect;
#                observe     a continuous subscription — holds resources and keeps running;
#                mutate      changes state outside the shell, reversibly;
#                destructive may cause irreversible loss. Spec §17.1 computes a risk descriptor
#                            from this plus target count, context, privilege and irreversibility.
#   `elevation`  none        works as an ordinary user;
#                conditional works unprivileged for some targets and needs privilege for others
#                            — the common case on Linux, and the one a shell must not paper over;
#                required    cannot work without privilege.

version: 1

risk_levels:
  - name: read
    doc: A point-in-time query. No state changes and nothing keeps running afterwards.
  - name: observe
    doc: A subscription or poll that keeps running and holds resources until cancelled.
  - name: mutate
    doc: Changes state outside the shell. Reversible by another operation.
  - name: destructive
    doc: May cause irreversible loss. Subject to the confirmation and preview rules of spec §11.6 and §17.

elevation_levels:
  - name: none
    doc: Available to an ordinary user.
  - name: conditional
    doc: Unprivileged for some targets, privileged for others; the command reports which before it runs.
  - name: required
    doc: Cannot succeed without privilege.

# ---------------------------------------------------------------------------------------------
# Provider capabilities — referenced by `provider_capability` in docs/spec/commands/*.yaml.
# ---------------------------------------------------------------------------------------------
provider_capabilities:
  # process, spec §23.1
  - id: process.list
    summary: Enumerate processes and their metadata.
    risk: read
    elevation: none
  - id: process.inspect
    summary: Read the detailed properties of one process, including its open files and cgroup.
    risk: read
    elevation: conditional
  - id: process.watch
    summary: Subscribe to process appearance, disappearance and metric updates.
    risk: observe
    elevation: none
  - id: process.signal
    summary: Deliver a signal to a process.
    risk: mutate
    elevation: conditional
  - id: process.set
    summary: Adjust mutable process attributes such as scheduling priority.
    risk: mutate
    elevation: conditional
  - id: process.trace
    summary: Resolve a process's relationships to files, sockets, cgroups and services.
    risk: read
    elevation: conditional
  - id: job.list
    summary: Enumerate the session's jobs.
    risk: read
    elevation: none

  # filesystem, spec §23.4
  - id: file.list
    summary: Read file metadata for given paths.
    risk: read
    elevation: conditional
  - id: file.find
    summary: Walk a tree and yield matching file metadata.
    risk: read
    elevation: conditional
  - id: file.read
    summary: Read file content.
    risk: read
    elevation: conditional
  - id: file.write
    summary: Create or replace file content.
    risk: mutate
    elevation: conditional
  - id: file.set
    summary: Change file metadata — mode, ownership, timestamps.
    risk: mutate
    elevation: conditional
  - id: file.copy
    summary: Duplicate a file or tree.
    risk: mutate
    elevation: conditional
  - id: file.move
    summary: Relocate a file or tree.
    risk: mutate
    elevation: conditional
  - id: file.remove
    summary: Delete a file or tree.
    risk: destructive
    elevation: conditional
  - id: file.watch
    summary: Subscribe to filesystem change events.
    risk: observe
    elevation: conditional
  - id: file.open
    summary: Hand a file to its associated handler.
    risk: mutate
    elevation: none
  - id: dir.list
    summary: Enumerate the entries of a directory.
    risk: read
    elevation: conditional

  # service, spec §23.3
  - id: service.list
    summary: Enumerate service-manager units and their states.
    risk: read
    elevation: none
  - id: service.watch
    summary: Subscribe to service state transitions.
    risk: observe
    elevation: none
  - id: service.manage
    summary: Start, stop, restart, enable or disable a service unit.
    risk: mutate
    elevation: required
  - id: service.trace
    summary: Resolve a unit's dependency, process, socket and file relationships.
    risk: read
    elevation: conditional
  - id: log.read
    summary: Query log or journal records.
    risk: read
    elevation: conditional

  # network, spec §23.2
  - id: socket.list
    summary: Enumerate sockets with their endpoints and states.
    risk: read
    elevation: conditional
  - id: socket.watch
    summary: Subscribe to socket lifecycle events.
    risk: observe
    elevation: conditional
  - id: socket.close
    summary: Force a socket closed.
    risk: destructive
    elevation: required
  - id: socket.trace
    summary: Resolve a socket to its owning process, service and remote endpoint.
    risk: read
    elevation: conditional
  - id: connection.list
    summary: Enumerate connection-oriented socket views.
    risk: read
    elevation: conditional
  - id: interface.list
    summary: Enumerate interfaces, addresses and counters.
    risk: read
    elevation: none
  - id: interface.watch
    summary: Subscribe to interface and address changes.
    risk: observe
    elevation: none
  - id: interface.set
    summary: Change interface configuration or administrative state.
    risk: mutate
    elevation: required
  - id: route.list
    summary: Enumerate routing table entries.
    risk: read
    elevation: none
  - id: route.watch
    summary: Subscribe to routing table changes.
    risk: observe
    elevation: none
  - id: route.set
    summary: Add, remove or modify routing table entries.
    risk: mutate
    elevation: required
  - id: neighbor.list
    summary: Enumerate ARP and NDP neighbour entries.
    risk: read
    elevation: none
  - id: dns.resolve
    summary: Perform an explicit name resolution.
    risk: read
    elevation: none
  - id: port.probe
    summary: Attempt a connection to a host and port and time the result.
    risk: observe
    elevation: none

  # identity, spec §23.6
  - id: user.list
    summary: Enumerate user accounts.
    risk: read
    elevation: none
  - id: user.manage
    summary: Create, remove or modify user accounts.
    risk: mutate
    elevation: required
  - id: group.list
    summary: Enumerate group accounts.
    risk: read
    elevation: none
  - id: group.manage
    summary: Create, remove or modify group accounts and their membership.
    risk: mutate
    elevation: required
  - id: session.list
    summary: Enumerate login and seat sessions.
    risk: read
    elevation: none
  - id: env.read
    summary: Read environment and shell variables.
    risk: read
    elevation: none
  - id: env.set
    summary: Set an environment or shell variable in the current scope.
    risk: mutate
    elevation: none

  # storage, spec §23.5
  - id: mount.list
    summary: Enumerate mounted filesystems with their structured options.
    risk: read
    elevation: none
  - id: mount.watch
    summary: Subscribe to mount and unmount events.
    risk: observe
    elevation: none
  - id: mount.manage
    summary: Mount, unmount or remount a filesystem.
    risk: mutate
    elevation: required
  - id: filesystem.list
    summary: Enumerate filesystems and their capacity, mounted or not.
    risk: read
    elevation: conditional
  - id: device.list
    summary: Enumerate block and character devices.
    risk: read
    elevation: none

  # package
  - id: package.list
    summary: Enumerate installed and known packages.
    risk: read
    elevation: none
  - id: package.search
    summary: Search the provider's repositories.
    risk: read
    elevation: none
  - id: package.manage
    summary: Install, remove or transition the version of a package.
    risk: mutate
    elevation: required
  - id: package-source.list
    summary: Enumerate the repositories the package manager reads its index from.
    risk: read
    elevation: none
  - id: package-source.refresh
    summary: Bring the local package index up to date from a repository.
    risk: mutate
    elevation: required

  # container
  - id: container.list
    summary: Enumerate containers through an installed container provider.
    risk: read
    elevation: conditional
  - id: container.manage
    summary: Start, stop, restart, remove or reconfigure a container.
    risk: mutate
    elevation: conditional
  - id: container.exec
    summary: Execute inside a container's namespaces.
    risk: mutate
    elevation: conditional
  - id: container.trace
    summary: Resolve a container's namespaces, cgroups, mounts, processes and image.
    risk: read
    elevation: conditional
  - id: image.list
    summary: Enumerate container or machine images.
    risk: read
    elevation: conditional

  # remote, spec §21
  - id: host.list
    summary: Enumerate known hosts from configured sources.
    risk: read
    elevation: none
  - id: host.probe
    summary: Check a host's reachability and advertised capabilities.
    risk: observe
    elevation: none
  - id: host.trust
    summary: Record, replace or forget a pinned host key (spec §21.5, ADR-0015 T5/T6).
    risk: mutate
    elevation: none
  - id: link.create
    summary: Establish a remote Ono link, performing the handshake of spec §21.2.
    risk: mutate
    elevation: none
  - id: link.list
    summary: Enumerate active links.
    risk: read
    elevation: none
  - id: link.watch
    summary: Subscribe to link state and health changes.
    risk: observe
    elevation: none
  - id: link.manage
    summary: Create, modify, detach or remove a link definition.
    risk: mutate
    elevation: none

  # KUANG/11 runtime management, spec §31.8
  - id: plugin.list
    summary: Enumerate installed and loaded KUANG/11 packages and their runtime health.
    risk: read
    elevation: none
  - id: plugin.search
    summary: Search configured extension sources without executing any package.
    risk: read
    elevation: none
  - id: plugin.inspect
    summary: Read a package's manifest, origin, contributions, capabilities and errors.
    risk: read
    elevation: none
  - id: plugin.verify
    summary: Validate a package's integrity, signature and contract compatibility.
    risk: read
    elevation: none
  - id: plugin.install
    summary: Verify and install a package into the managed store.
    risk: mutate
    elevation: none
  - id: plugin.remove
    summary: Remove an installed package.
    risk: destructive
    elevation: none
  - id: plugin.load
    summary: Negotiate capabilities and instantiate a package's runtime.
    risk: mutate
    elevation: none
  - id: plugin.unload
    summary: Drain a package's jobs and withdraw its runtime contributions.
    risk: mutate
    elevation: none
  - id: plugin.set
    summary: Change a package's management settings, such as enablement and background policy.
    risk: mutate
    elevation: none
  - id: capability.list
    summary: Read capability definitions, requests, grants and leases.
    risk: read
    elevation: none
  - id: capability.grant
    summary: Create a scoped capability grant or lease, subject to policy.
    risk: mutate
    elevation: none
  - id: capability.revoke
    summary: Revoke a capability grant or lease.
    risk: mutate
    elevation: none
  - id: assistant.list
    summary: Enumerate loaded assistant extensions.
    risk: read
    elevation: none
  - id: assistant.ask
    summary: Run an assistant turn under an explicit context and model policy.
    risk: mutate
    elevation: none
  - id: model.list
    summary: Enumerate configured model providers and their policy characteristics.
    risk: read
    elevation: none
  - id: finding.list
    summary: Query findings emitted by analyses and assistants.
    risk: read
    elevation: none
  - id: audit.list
    summary: Query the record of capability-sensitive KUANG/11 actions.
    risk: read
    elevation: none

  # shell-owned surfaces
  - id: config.read
    summary: Read resolved configuration settings with their provenance.
    risk: read
    elevation: none
  - id: config.set
    summary: Change a configuration setting in the current scope.
    risk: mutate
    elevation: none
  - id: command.list
    summary: Enumerate native and external commands and their metadata.
    risk: read
    elevation: none

# ---------------------------------------------------------------------------------------------
# KUANG/11 capabilities — spec §31.16, complete and in the order the spec lists them.
#
# A package declares each capability it wants as `required`, `optional` or `runtime_requested`
# (spec §31.17); the class is a property of the declaration, not of the capability, so it is not
# a field here. `scopes` names the scope keys spec §31.16 shows for a capability; a scope that
# cannot be enforced reliably MUST NOT be offered as if it were a security boundary (§31.16),
# so a capability with no enforceable scope declares none rather than a decorative one.
# ---------------------------------------------------------------------------------------------
kuang_capabilities:
  - id: object.read
    summary: Read objects from the host's object world.
    risk: read
    elevation: none
    scopes: [schemas, targets]
  - id: schema.read
    summary: Read schema definitions and their field metadata.
    risk: read
    elevation: none
  - id: process.read
    summary: Read process objects.
    risk: read
    elevation: none
    scopes: [selector]
  - id: process.signal
    summary: Deliver signals to processes.
    risk: mutate
    elevation: conditional
    scopes: [signals, selector]
  - id: process.exec
    summary: Execute an external program.
    risk: mutate
    elevation: conditional
    scopes: [programs, executables, argv_policy]
  - id: filesystem.read
    summary: Read files and directories.
    risk: read
    elevation: conditional
    scopes: [paths]
  - id: filesystem.write
    summary: Create, modify or delete files.
    risk: destructive
    elevation: conditional
    scopes: [paths]
  - id: filesystem.watch
    summary: Subscribe to filesystem change events.
    risk: observe
    elevation: conditional
    scopes: [paths]
  - id: network.observe
    summary: Observe network state — sockets, interfaces, routes, neighbours.
    risk: read
    elevation: conditional
  - id: network.connect
    summary: Open outbound network connections.
    risk: mutate
    elevation: none
    scopes: [hosts, ports]
  - id: network.listen
    summary: Bind and accept inbound connections.
    risk: mutate
    elevation: conditional
    scopes: [ports]
  - id: service.read
    summary: Read service-manager units and their state.
    risk: read
    elevation: none
    scopes: [units]
  - id: service.mutate
    summary: Change the state of service-manager units.
    risk: mutate
    elevation: required
    scopes: [units]
  - id: container.read
    summary: Read container objects.
    risk: read
    elevation: conditional
    scopes: [containers]
  - id: container.exec
    summary: Execute inside a container.
    risk: mutate
    elevation: conditional
    scopes: [containers]
  - id: remote.read
    summary: Read objects across a remote link.
    risk: read
    elevation: none
    scopes: [links]
  - id: remote.mutate
    summary: Perform mutations across a remote link.
    risk: mutate
    elevation: conditional
    scopes: [links]
  - id: history.read
    summary: Read the session's semantic history.
    risk: read
    elevation: none
    scopes: [window]
  - id: history.write
    summary: Add entries to the session's history.
    risk: mutate
    elevation: none
  - id: context.read
    summary: Read the current context stack — cwd, active object, active link.
    risk: read
    elevation: none
  - id: ui.view
    summary: Contribute a view or TUI lens and render into it.
    risk: read
    elevation: none
  - id: ui.notify
    summary: Raise a notification to the operator.
    risk: mutate
    elevation: none
  - id: relation.read
    summary: Read relationship edges from the graph.
    risk: read
    elevation: none
  - id: relation.write
    summary: Contribute relationship edges to the graph.
    risk: mutate
    elevation: none
  - id: secret.use
    summary: >-
      Use a secret without reading its value. Spec §17.5 and §31.20 keep the value redacted;
      the capability grants use, not disclosure.
    risk: mutate
    elevation: none
    scopes: [secrets]
  - id: model.infer
    summary: Send a request to a model provider through the model broker (spec §31.43).
    risk: mutate
    elevation: none
    scopes: [providers, data_class]
  - id: plugin.invoke
    summary: Invoke a contribution of another loaded package (spec §31.30).
    risk: mutate
    elevation: none
    scopes: [plugins]
  - id: state.persist
    summary: Store extension state across sessions (spec §31.31).
    risk: mutate
    elevation: none
  - id: clock.read
    summary: Read the wall clock.
    risk: read
    elevation: none
