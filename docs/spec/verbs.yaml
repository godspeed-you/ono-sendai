# Ono-Sendai verb registry.
#
# Source: spec §7.1, the core verb table, transcribed complete and unaltered in meaning.
# Spec §7 makes the registry deliberately small and curated: third-party modules reuse an
# existing verb whenever the semantics match, and §40.1 requires a verb review before a new one
# is added. Nothing here is invented; nothing from §7.1 is dropped.
#
# `id`              stable identity, `ono.verb.<verb>`. Only the Ono project may claim `ono.*`
#                   (spec §31.5).
# `verb`            the word the user types.
# `semantics`       one line, quoted from or faithful to the §7.1 table.
# `typical_targets` the §7.1 column of the same name; not a closed list, and not a constraint.
#                   The commands that actually exist are in `docs/spec/commands/`.
# `pipeline_role`   the §7.1 column of the same name.
# `mutating`        true when the verb changes state outside the shell's own view of the world.
#                   Context verbs and pure transforms are not mutating; the risk of an
#                   individual command is in its `privilege` and its provider capability.
# `stability`       every core verb is `stable`: the verb registry is the vocabulary the whole
#                   product is named in, and §40.4 treats stable ids as a compatibility promise.

version: 1

verbs:
  # --- producers and observers ------------------------------------------------------------
  - id: ono.verb.get
    verb: get
    semantics: Obtain current objects or state.
    typical_targets: [process, file, service, socket, user]
    pipeline_role: producer
    mutating: false
    stability: stable
  - id: ono.verb.find
    verb: find
    semantics: Discover by search criteria or location.
    typical_targets: [file, host, command, package]
    pipeline_role: producer
    mutating: false
    stability: stable
  - id: ono.verb.inspect
    verb: inspect
    semantics: Expose a detailed representation and its provenance.
    typical_targets: [any object]
    pipeline_role: transform/terminal
    mutating: false
    stability: stable
  - id: ono.verb.watch
    verb: watch
    semantics: Observe repeatedly or live.
    typical_targets: [query, process, file, service]
    pipeline_role: stream producer
    mutating: false
    stability: stable
  - id: ono.verb.trace
    verb: trace
    semantics: Derive relationships, path or provenance.
    typical_targets: [process, service, host, packet]
    pipeline_role: producer/view
    mutating: false
    stability: stable

  # --- lifecycle --------------------------------------------------------------------------
  - id: ono.verb.start
    verb: start
    semantics: Transition into a running or active state.
    typical_targets: [service, job, container]
    pipeline_role: consumer
    mutating: true
    stability: stable
  - id: ono.verb.stop
    verb: stop
    semantics: Transition into a stopped or inactive state.
    typical_targets: [service, process, job]
    pipeline_role: consumer
    mutating: true
    stability: stable
  - id: ono.verb.restart
    verb: restart
    semantics: Stop and start again with target semantics.
    typical_targets: [service, container]
    pipeline_role: consumer
    mutating: true
    stability: stable
  - id: ono.verb.kill
    verb: kill
    semantics: Deliver a termination signal or forceful stop.
    typical_targets: [process, job]
    pipeline_role: consumer
    mutating: true
    stability: stable
  - id: ono.verb.open
    verb: open
    semantics: Open a resource in its associated handler or context.
    typical_targets: [file, URL, device]
    pipeline_role: consumer
    mutating: true
    stability: stable

  # --- context ----------------------------------------------------------------------------
  - id: ono.verb.enter
    verb: enter
    semantics: Make a resource the active interaction context.
    typical_targets: [dir, container, service]
    pipeline_role: context
    mutating: false
    stability: stable
  - id: ono.verb.leave
    verb: leave
    semantics: Pop the active context.
    typical_targets: [context]
    pipeline_role: context
    mutating: false
    stability: stable
  - id: ono.verb.connect
    verb: connect
    semantics: Create a protocol connection.
    typical_targets: [host, socket, database]
    pipeline_role: consumer/context
    mutating: true
    stability: stable
  - id: ono.verb.link
    verb: link
    semantics: Create and persist an Ono remote execution link.
    typical_targets: [host, session]
    pipeline_role: context
    mutating: true
    stability: stable
  - id: ono.verb.detach
    verb: detach
    semantics: Leave a live or remote attachment without stopping the target.
    typical_targets: [link, job, stream]
    pipeline_role: context
    mutating: false
    stability: stable

  # --- mutation ---------------------------------------------------------------------------
  - id: ono.verb.add
    verb: add
    semantics: Create a membership or association.
    typical_targets: [user, route, group, repo]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.remove
    verb: remove
    semantics: Delete a resource or a membership.
    typical_targets: [file, route, package]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.set
    verb: set
    semantics: Modify properties or configuration.
    typical_targets: [env, service, file metadata]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.move
    verb: move
    semantics: Relocate an object.
    typical_targets: [file, dir]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.copy
    verb: copy
    semantics: Duplicate an object.
    typical_targets: [file, dir]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.rename
    verb: rename
    semantics: Change an identity label or name.
    typical_targets: [file, link]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.mount
    verb: mount
    semantics: Attach a filesystem or resource.
    typical_targets: [filesystem]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.unmount
    verb: unmount
    semantics: Detach a filesystem or resource.
    typical_targets: [filesystem]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.send
    verb: send
    semantics: Emit data, a signal or a message.
    typical_targets: [signal, packet, notification]
    pipeline_role: consumer
    mutating: true
    stability: stable

  # --- content ----------------------------------------------------------------------------
  - id: ono.verb.read
    verb: read
    semantics: Consume content rather than metadata.
    typical_targets: [file, stream, secret]
    pipeline_role: producer
    mutating: false
    stability: stable
  - id: ono.verb.write
    verb: write
    semantics: Create or replace content.
    typical_targets: [file, stream]
    pipeline_role: consumer
    mutating: true
    stability: stable
  - id: ono.verb.tail
    verb: tail
    semantics: Follow append-oriented content.
    typical_targets: [file, journal]
    pipeline_role: stream
    mutating: false
    stability: stable

  # --- predicates and mapping -------------------------------------------------------------
  - id: ono.verb.test
    verb: test
    semantics: Evaluate a condition or a capability.
    typical_targets: [port, path, permission]
    pipeline_role: producer
    mutating: false
    stability: stable
  - id: ono.verb.resolve
    verb: resolve
    semantics: Map a name or identifier.
    typical_targets: [dns, user, path, command]
    pipeline_role: producer
    mutating: false
    stability: stable

  # --- rendering and serialization --------------------------------------------------------
  - id: ono.verb.format
    verb: format
    semantics: Render explicitly for a human.
    typical_targets: [any value]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.to
    verb: to
    semantics: Serialize or convert.
    typical_targets: [json, yaml, csv, text, bytes]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.from
    verb: from
    semantics: Parse an explicit representation.
    typical_targets: [json, yaml, csv]
    pipeline_role: transform
    mutating: false
    stability: stable

  # --- data transforms (spec §53 gives the reference semantics) ---------------------------
  - id: ono.verb.select
    verb: select
    semantics: Project fields.
    typical_targets: [records]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.where
    verb: where
    semantics: Filter values.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.sort
    verb: sort
    semantics: Order values.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.group
    verb: group
    semantics: Group by an expression.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.take
    verb: take
    semantics: Take the first N values.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.skip
    verb: skip
    semantics: Skip the first N values.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.each
    verb: each
    semantics: Execute an expression or block per value.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.reduce
    verb: reduce
    semantics: Fold a stream into a single value.
    typical_targets: [stream, list]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.count
    verb: count
    semantics: Count values.
    typical_targets: [stream, list]
    pipeline_role: terminal/transform
    mutating: false
    stability: stable
  - id: ono.verb.measure
    verb: measure
    semantics: Calculate statistics.
    typical_targets: [numeric stream]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.join
    verb: join
    semantics: Perform a relational join.
    typical_targets: [records, tables]
    pipeline_role: transform
    mutating: false
    stability: stable
  - id: ono.verb.diff
    verb: diff
    semantics: Compare values or state.
    typical_targets: [file, record, query]
    pipeline_role: producer/view
    mutating: false
    stability: stable

  # --- meta -------------------------------------------------------------------------------
  - id: ono.verb.help
    verb: help
    semantics: Discover documentation.
    typical_targets: [command, target, topic]
    pipeline_role: meta
    mutating: false
    stability: stable
  - id: ono.verb.explain
    verb: explain
    semantics: Show the resolution and plan without executing.
    typical_targets: [command, expression]
    pipeline_role: meta
    mutating: false
    stability: stable
  - id: ono.verb.type
    verb: type
    semantics: Show the type or schema.
    typical_targets: [value, command output]
    pipeline_role: meta
    mutating: false
    stability: stable

  # --- KUANG/11 extension runtime (spec §31) ----------------------------------------------
  - id: ono.verb.install
    verb: install
    semantics: Add a verified package or artifact to a managed store.
    typical_targets: [plugin, package]
    pipeline_role: mutation
    mutating: true
    stability: stable
  - id: ono.verb.load
    verb: load
    semantics: Activate an installed extension or runtime contribution.
    typical_targets: [plugin]
    pipeline_role: mutation/context
    mutating: true
    stability: stable
  - id: ono.verb.unload
    verb: unload
    semantics: Deactivate a loaded extension without uninstalling it.
    typical_targets: [plugin]
    pipeline_role: mutation/context
    mutating: true
    stability: stable
  - id: ono.verb.verify
    verb: verify
    semantics: Validate integrity, signature and contracts.
    typical_targets: [plugin, package]
    pipeline_role: meta
    mutating: false
    stability: stable
  - id: ono.verb.grant
    verb: grant
    semantics: Create an explicit capability grant or lease.
    typical_targets: [capability]
    pipeline_role: mutation/security
    mutating: true
    stability: stable
  - id: ono.verb.revoke
    verb: revoke
    semantics: Remove an existing capability grant or lease.
    typical_targets: [capability]
    pipeline_role: mutation/security
    mutating: true
    stability: stable
  - id: ono.verb.ask
    verb: ask
    semantics: Send a request to an explicitly selected assistant.
    typical_targets: [assistant]
    pipeline_role: producer/context
    mutating: false
    stability: stable
