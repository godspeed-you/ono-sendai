# Command family: Container. Sources: spec §9.1 Container and the `container` row of the §52
# matrix. No phase of spec §37 delivers a container provider, so everything here is
# `phase: planned` (ADR-0012). Conventions as documented at the head of process.yaml.

version: 1
family: container

commands:
  - id: ono.container.get
    verb: get
    target: container
    summary: Enumerate containers through the installed provider or providers.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.container/1>
    provider_capability: container.list
    selectors:
      - {name: id, type: string, doc: "Resolve one container by id or name."}
    options:
      - {name: all, type: bool, doc: "Include containers that are not running."}
      - {name: provider, type: string, doc: "Query one named container provider."}
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - get container
      - get container | where state == running

  - id: ono.container.start
    verb: start
    target: container
    summary: Start a container.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.container/1>"
    output: stream<ono.action-result/1>
    provider_capability: container.manage
    selectors:
      - {name: id, type: string, doc: "The container to start."}
    options: []
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - start container web-1

  - id: ono.container.stop
    verb: stop
    target: container
    summary: Stop a container.
    stability: stable
    argument_mode: words
    input: "null | stream<ono.container/1>"
    output: stream<ono.action-result/1>
    provider_capability: container.manage
    selectors:
      - {name: id, type: string, doc: "The container to stop."}
    options:
      - {name: timeout, type: duration, doc: "How long to wait for a graceful stop before forcing it."}
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - stop container web-1

  - id: ono.container.restart
    verb: restart
    target: container
    summary: Restart a container.
    stability: stable                     # spec §7.1 names `container` among `restart`'s targets; §52 container/restart = "M"
    argument_mode: words
    input: "null | stream<ono.container/1>"
    output: stream<ono.action-result/1>
    provider_capability: container.manage
    selectors:
      - {name: id, type: string, doc: "The container to restart."}
    options: []
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - restart container web-1

  - id: ono.container.enter
    verb: enter
    target: container
    summary: Push a container's execution context onto the context stack.
    stability: stable
    argument_mode: words
    input: "null | ono.container/1"
    output: ono.context/1
    provider_capability: container.exec
    selectors:
      - {name: id, type: string, doc: "The container to enter."}
    options: []
    privilege: conditional
    streaming: false
    phase: planned
    examples:
      - enter container web-1

  - id: ono.container.trace
    verb: trace
    target: container
    summary: Show a container's namespaces, cgroups, mounts, processes, sockets and image.
    stability: stable
    argument_mode: words
    input: "null | ono.container/1"
    output: ono.graph/1
    provider_capability: container.trace
    selectors:
      - {name: id, type: string, doc: "The container to trace."}
    options:
      - {name: depth, type: int, doc: "How many relationship hops to follow."}
    privilege: conditional
    streaming: false
    phase: planned
    examples:
      - trace container web-1

  - id: ono.image.get
    verb: get
    target: image
    summary: Enumerate container images.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.image/1>
    provider_capability: image.list
    selectors:
      - {name: reference, type: string, doc: "Resolve one image by reference."}
    options:
      - {name: provider, type: string, doc: "Query one named container provider."}
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - get image

  - id: ono.container.watch
    verb: watch
    target: container
    summary: Emit container lifecycle events as a live stream.
    stability: experimental               # spec §52, container/watch = "L"
    argument_mode: words
    input: "null"
    output: stream<ono.container-event/1>
    provider_capability: container.list
    selectors:
      - {name: id, type: string, doc: "Watch one container."}
    options: []
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - watch container

  - id: ono.container.remove
    verb: remove
    target: container
    summary: Remove a container.
    stability: experimental               # spec §52, container/remove = "M"
    argument_mode: words
    input: "null | stream<ono.container/1>"
    output: stream<ono.action-result/1>
    provider_capability: container.manage
    selectors:
      - {name: id, type: string, doc: "The container to remove."}
    options:
      - {name: force, type: bool, doc: "Remove a running container. Destructive, so never the default."}
      - {name: volumes, type: bool, doc: "Remove the container's anonymous volumes too."}
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - remove container web-1

  - id: ono.container.set
    verb: set
    target: container
    summary: Change a container's mutable configuration, such as its resource limits.
    stability: experimental               # spec §52, container/set = "M"
    argument_mode: words
    input: "null | stream<ono.container/1>"
    output: stream<ono.action-result/1>
    provider_capability: container.manage
    selectors:
      - {name: id, type: string, doc: "The container to modify."}
    options:
      - {name: memory, type: bytesize, doc: "New memory limit."}
      - {name: cpus, type: float, doc: "New CPU allowance."}
    privilege: conditional
    streaming: true
    phase: planned
    examples:
      - set container web-1 --memory 2GiB
