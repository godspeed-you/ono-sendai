# Command family: Spatial. Sources: the v0.4 Spatial Systems Interface — §6 (the spatial command
# language), §6.8 (`find`), §9.3 (active global discovery), §27 (selector resolution), §29.4
# (streaming), §41.3 (this registry generates help, completion and tests) — and ADR-0124, which
# fixes the spellings.
#
# ADR-0124: every spatial verb takes the bare name except the one that collides with a program
# everybody uses. `find` keeps its target word, so the spatial search is `find place`, beside the
# existing `find file`, `find command`, `find plugin` and `find package`; bare `find` still
# reaches findutils through the v0.3 adapter. The spatial type is an option (`--type`), not a
# second target word.
#
# `phase: S` is the v0.4 tranche of §50, whose phases are S1–S11 rather than the letters of v0.2
# §37. Conventions as documented at the head of process.yaml.

version: 1
family: spatial

commands:
  - id: ono.place.find
    verb: find
    target: place
    summary: Search the spatial index for places, by name, type, predicate or anchor.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.spatial-place/1>
    provider_capability: null
    selectors:
      - {name: name, type: string, doc: "The name or alias to look for. Without one, every place the search reaches answers (v0.4 §6.8)."}
    options:
      - {name: type, type: string, doc: "Restrict to one spatial type — `process`, `service`, `listener`, `directory` (v0.4 §3.3; ADR-0124 makes the type an option rather than a second target word)."}
      - {name: where, type: value, doc: "A predicate over the objects being searched for, evaluated against each object as its provider described it: `--where state == \"running\"`, `--where local.port == 8080` (v0.4 §6.8; ADR-0138 makes its value an expression, ADR-0140 fixes what it reads)."}
      - {name: near, type: string, doc: "A place selector the search is anchored to; only places under that anchor answer (v0.4 §6.8)."}
      - {name: limit, type: int, doc: "How many places to answer with. The search is bounded by default, because §34 budgets it."}
      - {name: all, type: bool, doc: "Answer every match, however many. May be expensive (v0.4 §6.2)."}
    privilege: conditional
    streaming: true
    phase: S
    examples:
      - find place nginx
      - find place --type service --where state == "active"
      - find place --where local.port == 8080 | take 1

  - id: ono.place.look
    verb: look
    target: null
    summary: Describe the current place, its exits, its landmarks and what changed around it.
    stability: stable
    argument_mode: words
    input: "null"
    output: "ono.place-view/1 | string"
    provider_capability: null
    selectors: []
    options:
      - {name: json, type: bool, doc: "Write the `PlaceView` as one JSON document rather than rendering it (v0.4 §6.1, §29.1)."}
      - {name: all, type: bool, doc: "Widen the exits: every group lists the places behind it instead of counting them (v0.4 §6.1, §24.1)."}
      - {name: changes, type: duration, optional_value: true, doc: "Report what changed in this window, or in `spatial.look.change_window` when the duration is left out (v0.4 §6.1, §24.3)."}
    privilege: none
    streaming: false
    phase: S
    note: >-
      `look` shadows util-linux `look(1)` on hosts that have it; ADR-0124 keeps the bare name for
      the spatial command and leaves the program reachable as `exec:look`, exactly as v0.2 §6.5
      resolves every other collision.
    examples:
      - look
      - look --json
      - look --all

  - id: ono.place.near
    verb: near
    target: null
    summary: Stream the ranked, bounded neighbourhood of the current place.
    stability: stable
    argument_mode: words
    input: "null"
    output: stream<ono.spatial-neighbor/1>
    provider_capability: null
    selectors:
      - {name: relation, type: string, doc: "One exit only — the relation or collection to look along (v0.4 §6.2)."}
    options:
      - {name: type, type: string, doc: "Restrict to one spatial type — `process`, `listener`, `mount` (v0.4 §6.2, §3.3)."}
      - {name: changed, type: duration, optional_value: true, doc: "Only neighbours observed to change inside this window, or inside `spatial.look.change_window` when the duration is left out (v0.4 §6.2)."}
      - {name: limit, type: int, doc: "How many neighbours to answer with. The neighbourhood is bounded by default (v0.4 §6.2, §34.2)."}
      - {name: all, type: bool, doc: "The complete currently known one-hop neighbourhood. May be expensive (v0.4 §6.2)."}
    privilege: conditional
    streaming: true
    phase: S
    examples:
      - near
      - near --limit 5
      - near --type process | take 3

  - id: ono.place.enter
    verb: enter
    target: null
    summary: Move into a hierarchical child or an explicitly selected place.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors:
      - {name: selector, type: string, doc: "The place to move into: a visible child, a visible neighbour, a canonical id or a spatial id (v0.4 §6.3, §27.1)."}
    options: []
    privilege: conditional
    streaming: false
    phase: S
    note: >-
      The target-less form of `enter`. `enter dir`, `enter process`, `enter user` and the other
      target forms keep the v0.2 context-stack meaning of ADR-0075; a word that names no target
      is a place selector, which is what makes `enter compute` and `enter processes` work without
      a second vocabulary.
    examples:
      - enter compute
      - enter processes
      - enter network

  - id: ono.place.follow
    verb: follow
    target: null
    summary: Traverse a relationship edge of the current place — never a hierarchy edge.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors:
      - {name: relation, type: string, doc: "The relation to traverse: the word `look` prints for the exit, or the relation label the registry declares — `parent`, `socket`, `children` (v0.4 §6.4, §24.2)."}
      - {name: selector, type: string, doc: "Which neighbour, where the relation reaches more than one: `follow socket :443`, `follow file /etc/nginx/nginx.conf` (v0.4 §6.4)."}
    options:
      - {name: resolve, type: bool, doc: "Pay for the relation even when it is classified `expensive` or `external`. v0.4.1 §34.3: a relation described as \"available on request\" must have a request path, and this is it (§34.2)."}
    privilege: conditional
    streaming: false
    phase: S
    note: >-
      §6.4: "`follow` MUST traverse a relationship edge, not a canonical hierarchy edge." A word
      that names a canonical space is refused with `spatial.no_relation` and reached with `enter`
      instead; a relation this place has but no edge along is the same refusal; a relation the
      registry declares for another kind of place is `spatial.not_found`, because the name was
      understood (v0.4 §11.1, §40).
    examples:
      - follow parent
      - follow socket :443
      - follow service

  - id: ono.place.map
    verb: map
    target: null
    summary: Project the bounded, ranked graph around a place — as text, or as a `SpatialMap`.
    stability: stable
    argument_mode: words
    input: "null"
    output: "ono.spatial-map/1 | string"
    provider_capability: null
    selectors:
      - {name: selector, type: string, doc: "The place to map. Without one, the current place; naming one maps it without moving there (v0.4 §6.9, §23.4)."}
    options:
      - {name: json, type: bool, doc: "Write the `SpatialMap` as one JSON document rather than rendering it. It is a bounded graph value and depends on no terminal (v0.4 §22, §29.4)."}
      - {name: depth, type: int, doc: "How many hierarchy hops to draw. Two by default: the place, its canonical children and what lies behind them (v0.4 §6.9)."}
      - {name: zoom, type: int, doc: "One of the five canonical levels of §8.1 — 0 SYSTEM, 1 DOMAIN, 2 COLLECTION, 3 ENTITY, 4 DETAIL. A place finer than the level is drawn as its canonical ancestor at it."}
      - {name: expand, type: string, doc: "Draw the members of a cluster instead of the cluster. A view action: it never changes the current place (v0.4 §8.3)."}
      - {name: focus, type: string, doc: "Centre the view on one node. Focus is not navigation and never moves the shell (v0.4 §23.4, §53)."}
      - {name: relations, type: string, doc: "Keep only these relations' edges, comma-separated. Filtering removes edges; it never creates one (v0.4 §6.9, §43.2)."}
      - {name: type, type: string, doc: "Keep only nodes of these spatial types, comma-separated — `process`, `service`, `listener`. It narrows the bounded map rather than re-selecting what fills it, so the answer is always a subset of the same map without it, and what it removed is counted in `hidden` (v0.4 §6.9, §3.3, §43.2)."}
      - {name: all, type: bool, doc: "The explicit larger bound the default is not, still inside `spatial.map.node_budget` (v0.4 §6.9, §34.2, §47)."}
      - {name: live, type: bool, doc: "Keep the map current. At an interactive terminal it is the full-screen view of §23.3, redrawn from a polling source and saying so in §25.3's vocabulary; where the values are consumed instead, it is a stream that subscribes to the change events of everything this place is drawn from — the first value is the current state, every value after it is something that moved (v0.4 §25.1, §25.2, §25.3, §29.1)."}
    privilege: conditional
    streaming: true
    execution: live_view   # v0.4.1 Appendix E, docs/spec/hardening/streaming_classification.yaml
    phase: S
    note: >-
      §22 fixes the answer of `map --json` field for field and forbids screen coordinates in it:
      layout belongs to the renderer. What does not fit the view budget is clustered and counted
      in `hidden` rather than dropped (§8.2, §23.6). At an interactive terminal `map` opens the
      full-screen view of §23.3; `--json`, a consumer downstream, a redirection or `spatial.map.mode
      = "text"` all keep it textual (§29.1). `--live` keeps that view current from a polling
      source; where the values are consumed rather than shown, it is a stream instead, subscribing
      through the v0.2 watch runtime rather than a second one (§2.16, ADR-0024): nothing is emitted
      while nothing changes, which is §25.2, and every value says how fresh it is and what it was
      observed through (§25.3, §25.4). Shown with no terminal to draw into, it is refused rather
      than faked (§29.1).
    examples:
      - map
      - map --json
      - map --zoom 1
      - map --all --type process
      - map --live --json

  - id: ono.place.map-links
    verb: map
    target: links
    summary: Draw the federated map — this host beside the hosts this session holds links to.
    stability: stable
    argument_mode: words
    input: "null"
    output: "ono.spatial-map/1 | string"
    provider_capability: null
    selectors: []
    options:
      - {name: json, type: bool, doc: "Write the `SpatialMap` as one JSON document rather than rendering it (v0.4 §22, §29.4)."}
      - {name: all, type: bool, doc: "The explicit larger bound the default is not, still inside `spatial.map.node_budget` (v0.4 §6.9, §34.2)."}
    privilege: none
    streaming: false
    phase: S
    note: >-
      §19.3: "A map MAY show multiple linked hosts when explicitly requested" — `map links` is
      that request, and its counterpart is the rule beside it: "The default root map SHOULD NOT
      automatically expand all remote graphs." So this map draws host roots and the links between
      them and stops there; walking a linked host is what `jump` is for (§35.4). The edges carry
      the §11.5 confidence of the evidence they rest on: a link this session negotiated is
      `exact`, a definition nobody has connected is `user_declared` (§19.4).
    examples:
      - map links
      - map links --json

  - id: ono.place.home
    verb: home
    target: null
    summary: Return to the root system place of the active host.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors: []
    options: []
    privilege: none
    streaming: false
    phase: S
    examples:
      - home
      - home; look

  - id: ono.place.back
    verb: back
    target: null
    summary: Return to the previous place in the actual navigation history.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors: []
    options: []
    privilege: none
    streaming: false
    phase: S
    note: >-
      §53: "`back` follows history; `up` follows canonical hierarchy." The two never collapse into
      one message either: an empty trail is `spatial.history_empty` and a place with no canonical
      parent is `spatial.no_parent` (v0.4 §40). Where a place on the way back no longer exists,
      §20.3 makes the shell say so before it skips past it, and the trail record is retained.
    examples:
      - back
      - follow socket :443; back

  - id: ono.place.up
    verb: up
    target: null
    summary: Move to the canonical hierarchical parent of the current place.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors: []
    options: []
    privilege: none
    streaming: false
    phase: S
    note: >-
      §6.6 and §43.2: `up` follows the canonical hierarchy and never a relationship edge, so from
      a socket it reaches the socket's network collection rather than the process that owns it —
      that one is `follow owner`. The parent is the `canonical_parent` the place view already
      declares (v0.4 §11.3, §33.1). At the root of a host there is none: `spatial.no_parent`.
    examples:
      - up
      - home; enter compute; enter processes; up

  - id: ono.place.jump
    verb: jump
    target: null
    summary: Move directly to a resolved place, without adjacency and across scopes.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors:
      - {name: selector, type: string, doc: "The place to move to: a name, a `<type>/<key>` or `<domain>:<key>` spelling, a spatial id, or `@<pin>` for a bookmark (v0.4 §6.5, §20.4, §27.1)."}
    options: []
    privilege: conditional
    streaming: false
    phase: S
    note: >-
      §6.5: `jump` "performs global or cross-scope place resolution without requiring adjacency"
      and "MUST visibly record the source and destination in the trail" — so its step carries both
      ends and, where the move crossed one, the scope boundary (v0.4 §20.1, §3.2).
    examples:
      - jump storage:/data
      - jump process/1842
      - jump @edge-proxy

  - id: ono.place.trail
    verb: trail
    target: null
    summary: Show the navigation trail of this session, movement by movement.
    stability: stable
    argument_mode: words
    input: "null"
    output: "stream<ono.navigation-step/1> | string"
    provider_capability: null
    selectors: []
    options:
      - {name: json, type: bool, doc: "Write the steps as one JSON document rather than rendering them (v0.4 §6.7, §29.1)."}
      - {name: compact, type: bool, doc: "Write the breadcrumb of the current place — `local > compute > processes > 1842` — instead of the steps (v0.4 §6.7, §20.2)."}
    privilege: none
    streaming: true
    phase: S
    note: >-
      §6.7: "The trail is session state, not command history", and §46.1 keeps it session-local —
      `spatial.trail.persist` is `false` by default, so a new session starts with an empty trail
      while pins survive. Every step preserves what §20.1 lists: both ends, the movement kind, the
      relation where there was one, the scope crossing where there was one, and the timestamp.
    examples:
      - trail
      - trail --json
      - trail --compact

  - id: ono.place.pin
    verb: pin
    target: null
    summary: Mark the current place as a persistent user landmark.
    stability: stable
    argument_mode: words
    input: "null"
    output: ono.spatial-place/1
    provider_capability: null
    selectors: []
    options:
      - {name: name, type: string, doc: "What to call the pin; `jump @<name>` reaches it. Without one the place's own name is used (v0.4 §20.4)."}
    privilege: none
    streaming: false
    phase: S
    note: >-
      §20.4: a pin stores "a resilient selector and identity metadata rather than only a rendered
      path", so it keeps the place's identity, the name it answers to and its spatial type. §46.1
      lets pins persist where the trail may not; they live in the session's state directory.
    examples:
      - pin
      - pin --name edge-proxy

  - id: ono.place.unpin
    verb: unpin
    target: null
    summary: Remove a user landmark.
    stability: stable
    argument_mode: words
    input: "null"
    output: "null"
    provider_capability: null
    selectors:
      - {name: name, type: string, doc: "Which pin to remove. Without one, the pin on the current place is removed (v0.4 §6, §20.4)."}
    options: []
    privilege: none
    streaming: false
    phase: S
    examples:
      - unpin
      - unpin edge-proxy
