# The provider that answers over D-Bus from systemd. Registered even when systemd cannot be
# reached: unavailability with a reason is a different answer from "there are no services"
# (spec §35.3). See linux-procfs.yaml for what this registry is and what enforces it.

providers:
  - id: systemd
    doc: Services, from org.freedesktop.systemd1 over D-Bus.
    targets: [service]
    capabilities: [service.list, service.manage]
    schemas: [ono.service/1]

  - id: systemd-journal
    doc: >-
      The journal and the log, from `journalctl --output=json` through the decoder of the
      systemd adapter pack (ADR-0085). Registered even where no `journalctl` is on PATH or no
      journal files exist: that is `provider.unavailable` with the reason, not an empty journal.
    targets: [journal, log]
    capabilities: [log.read]
    schemas: [ono.journal-event/1, ono.log-record/1]
