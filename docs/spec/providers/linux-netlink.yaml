# The providers that answer from netlink sockets — structured kernel answers, never parsed tool
# output (spec §50). See linux-procfs.yaml for what this registry is and what enforces it.

providers:
  - id: linux.netlink
    doc: >-
      Network interfaces, from rtnetlink (RTM_GETLINK / RTM_GETADDR); configured through
      RTM_NEWLINK / RTM_DELLINK / RTM_NEWADDR / RTM_DELADDR, which need CAP_NET_ADMIN.
    targets: [interface]
    capabilities: [interface.list, interface.set]
    schemas: [ono.interface/1]
    spatial:
      identity_strategy: stable
      canonical_parent:
        Interface: [network.interfaces]
      relationships:
        - interface.has_address
        - route.via_interface
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [state, rx_bytes, tx_bytes, mtu]

  - id: linux.netlink
    doc: >-
      Routes, from rtnetlink (RTM_GETROUTE); changed through RTM_NEWROUTE / RTM_DELROUTE,
      which need CAP_NET_ADMIN.
    targets: [route]
    capabilities: [route.list, route.set]
    schemas: [ono.route/1]
    spatial:
      # A route is identified by the tuple it carries; delete it and add it again and it is a
      # new route with the same shape (§10.1 Tier B).
      identity_strategy: lifetime
      canonical_parent:
        Route: [network.routes]
      relationships:
        - route.via_interface
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [metric, protocol, type]

  - id: linux.netlink
    doc: Neighbors, from rtnetlink (RTM_GETNEIGH).
    targets: [neighbor]
    capabilities: [neighbor.list]
    schemas: [ono.neighbor/1]
    spatial:
      identity_strategy: lifetime
      canonical_parent:
        Neighbor: [network.neighbors]
      relationships: []
      freshness: on_demand
      events: false
      permissions: [available, empty, permission_denied]
      cost_class: cheap
      landmark_metrics: [state, updated]

  - id: linux.sock-diag
    doc: >-
      Sockets and connections, from sock_diag; endpoints are ono.endpoint/1 records. A socket
      is closed through SOCK_DESTROY, which needs CAP_NET_ADMIN.
    targets: [socket, connection]
    capabilities: [socket.list, connection.list, socket.close]
    schemas: [ono.socket/1, ono.endpoint/1]
    spatial:
      # A socket inode is reused after the socket closes, so the identity lasts exactly as
      # long as the socket does (§10.1 Tier B).
      identity_strategy: lifetime
      # §6.6: `up` from a socket reaches "the canonical parent of the socket in the currently
      # active map projection, normally `NETWORK/SOCKETS`, not necessarily to the process" — so
      # the chain is the network collection alone, and the owning process stays a relationship
      # `follow` traverses (§44.6, ADR-0151).
      canonical_parent:
        Listener: [network.listeners]
        Connection: [network.connections]
      relationships:
        - process.owns_socket
        - socket.connected_to
      freshness: on_demand
      events: true
      permissions: [available, empty, permission_denied]
      cost_class: normal
      landmark_metrics: [state, protocol]
