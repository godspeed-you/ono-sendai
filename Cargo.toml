[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/godspeed-you/ono-sendai"
authors = ["The Ono-Sendai project"]

[workspace.dependencies]
ono-core = { path = "crates/ono-core", version = "0.0.1" }
ono-testkit = { path = "crates/ono-testkit", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
