[workspace]
resolver = "3"
# `fuzz` is a member so the gate compiles, lints and documents it like everything else:
# a fuzz target nothing builds is a check that never runs (ADR-0313).
members = ["crates/*", "fuzz", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/godspeed-you/ono-sendai"
authors = ["The Ono-Sendai project"]

[workspace.dependencies]
# Internal crates. Created as a phase needs them (ADR-0001, ADR-0005).
ono-core = { path = "crates/ono-core", version = "0.4.0" }
ono-value = { path = "crates/ono-value", version = "0.4.0" }
ono-parser = { path = "crates/ono-parser", version = "0.4.0" }
ono-process = { path = "crates/ono-process", version = "0.4.0" }
ono-pipeline = { path = "crates/ono-pipeline", version = "0.4.0" }
ono-command = { path = "crates/ono-command", version = "0.4.0" }
ono-render = { path = "crates/ono-render", version = "0.4.0" }
ono-provider-api = { path = "crates/ono-provider-api", version = "0.4.0" }
ono-provider-linux = { path = "crates/ono-provider-linux", version = "0.4.0" }
ono-provider-net = { path = "crates/ono-provider-net", version = "0.4.0" }
ono-provider-netlink = { path = "crates/ono-provider-netlink", version = "0.4.0" }
ono-provider-systemd = { path = "crates/ono-provider-systemd", version = "0.4.0" }
ono-provider-container = { path = "crates/ono-provider-container", version = "0.4.0" }
ono-editor = { path = "crates/ono-editor", version = "0.4.0" }
ono-graph = { path = "crates/ono-graph", version = "0.4.0" }
ono-adapter = { path = "crates/ono-adapter", version = "0.4.0" }
ono-history = { path = "crates/ono-history", version = "0.4.0" }
ono-protocol = { path = "crates/ono-protocol", version = "0.4.0" }
ono-remote = { path = "crates/ono-remote", version = "0.4.0" }
ono-kuang-protocol = { path = "crates/ono-kuang-protocol", version = "0.4.0" }
ono-kuang-supervisor = { path = "crates/ono-kuang-supervisor", version = "0.4.0" }
ono-kuang-sdk = { path = "crates/ono-kuang-sdk", version = "0.4.0" }
ono-kuang-testhost = { path = "crates/ono-kuang-testhost", version = "0.4.0" }
ono-model-broker = { path = "crates/ono-model-broker", version = "0.4.0" }
ono-spatial-core = { path = "crates/ono-spatial-core", version = "0.4.0" }
ono-spatial-events = { path = "crates/ono-spatial-events", version = "0.4.0" }
ono-spatial-index = { path = "crates/ono-spatial-index", version = "0.4.0" }
ono-spatial-query = { path = "crates/ono-spatial-query", version = "0.4.0" }
ono-spatial-render = { path = "crates/ono-spatial-render", version = "0.4.0" }
ono-testkit = { path = "crates/ono-testkit", version = "0.4.0" }

# Third-party. Choices and rationale: ADR-0005.
async-trait = "0.1"
bytes = "1"
crossterm = "0.29"
csv = "1"
# The one asymmetric primitive in the workspace: package signatures (spec §31.36, ADR-0311).
ed25519-dalek = "3"
futures = "0.3"
globset = "0.4"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
nix = "0.31"
# The one XML reader in the workspace: zypper documents `--xmlout` as its machine mode, and
# a SUSE machine has no other way to be asked what its repositories carry (ADR-0422).
quick-xml = "0.42"
regex = "1"
# The authenticated transport of spec §21.5 (ADR-0353). rustls with the `ring` provider rather
# than the default one, so the agent builds with the toolchain a Rust build already needs;
# `rcgen` writes the self-signed certificate that *is* a host's pinned identity.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal", "net", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
toml = "1"
unicode-width = "0.2"

# --- release tool versions (spec §44.2, ADR-0450) -----------------------------------------------
#
# Every tool the release path installs, at the one version it installs. A packaging tool decides
# what an artifact *is* — `cargo-deb` 3.5 and 3.7 lay out a `.deb` differently — so the version is
# an input to the build and belongs beside the other inputs rather than in whatever
# `install-action` considers newest today. `xtask spec-check` refuses a workflow or a script that
# names a different one, and `xtask build-manifest` reads these into the release input manifest
# of Appendix H.

[workspace.metadata.release-tools]
cargo-deb = "3.7.0"
cargo-generate-rpm = "0.21.0"
cross = "0.2.5"
cargo-deny = "0.20.2"

# --- recorded justifications (spec §45.3, §45.4, ADR-0449) --------------------------------------
#
# `cargo` ignores `workspace.metadata`; `xtask spec-check` does not. Two kinds of dependency are
# not an ordinary library choice, and both are decisions somebody has to be able to find again:
#
#   * a dependency taken from git, which must name one immutable revision (spec §45.3) — there
#     are none, and the gate refuses the first one that arrives without an entry here;
#   * a dependency that TLS, signing, hashing or key handling passes through, which needs a
#     recorded review before it is introduced (spec §45.4).
#
# `reviewed` is the date of the decision the ADR records, not the date the line was written.

[[workspace.metadata.supply-chain.cryptographic]]
crate = "ed25519-dalek"
role = "the signature over a KUANG/11 package manifest, verified before a plugin is trusted (spec §31.36)"
adr = "ADR-0311"
reviewed = "2026-08-29"

[[workspace.metadata.supply-chain.cryptographic]]
crate = "sha2"
role = "content digests: spatial identity and edge identity, KUANG/11 manifest digests, host-key fingerprints"
adr = "ADR-0129"
reviewed = "2026-08-28"

[[workspace.metadata.supply-chain.cryptographic]]
crate = "rustls"
role = "the TLS transport that carries the direct remote protocol, with the ring provider (spec §21.5)"
adr = "ADR-0353"
reviewed = "2026-08-29"

[[workspace.metadata.supply-chain.cryptographic]]
crate = "tokio-rustls"
role = "the async adapter over rustls used by the listening agent and the client"
adr = "ADR-0353"
reviewed = "2026-08-29"

[[workspace.metadata.supply-chain.cryptographic]]
crate = "rustls-pemfile"
role = "reading the local certificate and key files that are a host's own pinned identity"
adr = "ADR-0353"
reviewed = "2026-08-29"

[[workspace.metadata.supply-chain.cryptographic]]
crate = "rcgen"
role = "writing the self-signed certificate that is a host's identity when it is first generated"
adr = "ADR-0353"
reviewed = "2026-08-29"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Full debuginfo made every build directory 14-20 GB, which is what fills the disk when several
# worktrees build at once. Line tables keep test backtraces readable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
