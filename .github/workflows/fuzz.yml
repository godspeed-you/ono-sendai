# The coverage-guided fuzzing tier of v0.4.1 §41.2, on the schedule §41.3 requires.
#
# The gate keeps the fast deterministic tier (§41.1): `scripts/gate.sh` runs `ono-fuzz` for four
# hundred bounded iterations per target on every increment, which is a regression suite rather
# than a campaign. This is the campaign, and it is separate because it needs a nightly toolchain
# for libFuzzer's instrumentation while the gate is pinned to 1.94 (spec §44.3).
#
# Both tiers execute the same target bodies, from `fuzz/src/targets.rs`. A finding here reproduces
# on the pinned stable toolchain with `cargo run -p ono-fuzz -- repro <target> <file>`, which is
# what makes it worth committing (ADR-0521).
name: fuzz

on:
  schedule:
    # 03:17 UTC daily. §41.3: "at least daily on the default branch or a minimum aggregate of 30
    # minutes per day across the critical targets" — this run is both, at seven targets times
    # five minutes.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: >-
          Minutes per target. The default of 5 gives §41.3's daily aggregate; release
          qualification asks for at least two CPU-hours, which is 18.
        required: false
        default: "5"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# Least privilege (spec §43.3). This workflow reads the repository, writes nothing back, and
# reads no stored secret; its findings leave as run artifacts.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  campaign:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # One target's crash must not stop the other six: a campaign that stops at the first
      # finding finds one thing a night.
      fail-fast: false
      matrix:
        # The seven entry points v0.4.1 §41.2 names. `fuzz/tests/corpus.rs` holds this list
        # against the targets themselves, so a target added there and forgotten here fails the
        # gate rather than quietly never running.
        target:
          - parser
          - serializers
          - remote-protocol
          - remote-handshake
          - plugin-protocol
          - system-decoders
          - adapter-decoders
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          # libFuzzer needs `-Z sanitizer`, which is nightly-only. Nothing this job builds is
          # ever shipped: the release toolchain stays `rust-toolchain.toml`'s (spec §44.3).
          toolchain: nightly # spec §41.2 requires libFuzzer, which is nightly-only
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz@0.13.2

      # §41.4: "Interesting corpus inputs and every minimized crash reproducer MUST be committed
      # or stored as durable CI artifacts." The corpus is the campaign's memory — a run that
      # starts from the seeds every night re-discovers the same shallow inputs for five minutes
      # and never gets past them.
      - name: restore the corpus this target has grown
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/coverage-guided/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: run the campaign
        env:
          MINUTES: ${{ github.event.inputs.minutes || '5' }}
        run: |
          set -euo pipefail
          seconds=$(( MINUTES * 60 ))
          # `-timeout` is §41.5: a single input that takes longer than ten seconds is reported as
          # a hang and written where it can be reproduced, rather than being absorbed into a long
          # job nobody reads. `-rss_limit_mb` is the same rule for memory.
          cargo fuzz run --fuzz-dir fuzz/coverage-guided '${{ matrix.target }}' \
            fuzz/coverage-guided/corpus/'${{ matrix.target }}' \
            fuzz/corpus/'${{ matrix.target }}' \
            -- -max_total_time="$seconds" -timeout=10 -rss_limit_mb=2048

      # A crash found and then lost to a discarded runner is a crash found twice.
      - name: keep what it found
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/coverage-guided/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 90
