# The targeted verification of v0.4.1 §42, on the schedule §42.2 and §42.3 ask for.
#
# §42.1 states the argument: unsafe code is intentionally concentrated in a narrow process crate,
# and v0.4.1 "MUST exploit that architecture with targeted verification" rather than admire it.
# Eight files in four crates hold every `unsafe` block in the workspace; everything else is
# `#![forbid(unsafe_code)]`. That is small enough to check properly and too small to check by
# reading.
#
# Two jobs, because the two tools answer different questions. Miri interprets safe Rust and finds
# undefined behaviour in what the *safe* code does with memory — aliasing, provenance, uninit
# reads — and cannot execute the real process layer at all, because it does not implement `fork`,
# `execve` or `ioctl` (§42.2 says so in as many words). The sanitizers run the real thing, on the
# real kernel, and are the only way to reach the syscall wrappers themselves (§42.3).
#
# §42.4: "A reproducible sanitizer or Miri finding is a release blocker until fixed or proven
# false-positive and documented." Neither job may be allowed to fail and still report green, so
# neither carries the step setting that would let it.
#
# Decisions: ADR-0522.
name: verification

on:
  schedule:
    # 04:41 UTC daily, after the fuzzing tier and well clear of it.
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: false

# Least privilege (spec §43.3). Nothing here writes to the repository or reads a stored secret.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The jobs below install nightly, and `rust-toolchain.toml` pins 1.94: a toolchain file
  # outranks the installed default, so every cargo invocation in the checkout resolved to stable
  # and the nightly options were refused — the first scheduled run of each workflow died that way
  # (2026-09-04). `RUSTUP_TOOLCHAIN` outranks the file and reaches the child processes cargo
  # spawns, which is where the build that failed actually ran.
  RUSTUP_TOOLCHAIN: nightly

jobs:
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          # Miri ships with nightly only. Nothing here is built for release (spec §44.3).
          toolchain: nightly # spec §42.2 requires Miri, which is nightly-only
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: interpret the crates §42.2 names
        env:
          # Miri's own isolation hides the clock and the filesystem, which these crates read.
          # `-Zmiri-disable-isolation` gives them back; the strict-provenance checks that matter
          # for the pointer arithmetic in `ono-value` and the protocol codecs stay on.
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-strict-provenance"
        run: |
          set -euo pipefail
          cargo miri setup
          # §42.2's four areas: value ownership and sharing, parser data structures, protocol
          # serialization, and whatever else runs without an unsupported syscall. The process and
          # job-control layer is deliberately absent — §42.2 does not require it, and Miri cannot
          # run it.
          cargo miri test --package ono-value --lib
          cargo miri test --package ono-parser --lib
          cargo miri test --package ono-protocol --lib
          cargo miri test --package ono-kuang-protocol --lib
          cargo miri test --package ono-core --lib

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          # `-Z sanitizer` is nightly-only. Nothing here is built for release (spec §44.3).
          toolchain: nightly # spec §42.3 requires the sanitizers, which are nightly-only
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: run the unsafe boundary under ${{ matrix.sanitizer }}sanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=${{ matrix.sanitizer }}"
          RUSTDOCFLAGS: "-Zsanitizer=${{ matrix.sanitizer }}"
          # A leak on a test that forks is the child's allocations, not a defect in the wrapper.
          ASAN_OPTIONS: "detect_leaks=0"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          set -euo pipefail
          # §42.3: "The unsafe process crate and FFI/syscall wrappers are priority targets."
          # These four crates hold every `unsafe` block in the workspace; the standard library is
          # rebuilt with the sanitizer so the instrumentation reaches across it.
          cargo test -Z build-std --target x86_64-unknown-linux-gnu \
            --package ono-process \
            --package ono-kuang-supervisor \
            --package ono-provider-net \
            --package ono-value
