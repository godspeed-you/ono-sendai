name: audit

# The dependency policy of `deny.toml` runs in the gate on every change (ADR-0449), which answers
# "did this change bring something we refuse". It cannot answer the other half: an advisory is
# published against code that was already here, and nobody pushes anything that day. This
# workflow is the clock — the same policy, the same file, against a database that moved.

on:
  schedule:
    # Daily, at a minute nobody else picked.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege (spec §43.3): this workflow reads the repository and reports; it writes nothing
# and holds no secret, so a fork's pull request could run it and gain nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny@0.20.2
      # The whole policy, not only the advisories: a waiver in `deny.toml` expires by date, and
      # this is what notices the day it does (spec §45.1).
      - name: the dependency policy against today's advisory database
        run: cargo deny --locked --all-features check
