name: release

# Builds and proves the installable packages (ADR-0121, ADR-0123) on native runners for both
# architectures and attaches them to the GitHub release of the tag. Both halves run the same two
# scripts a developer runs locally; nothing here is a different build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ONO_ALLOW_MAIN: 1

jobs:
  package:
    name: package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cross
      - name: build the packages
        run: scripts/package.sh
      - name: install and run them in fresh containers
        run: scripts/package-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: list what is being published
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
