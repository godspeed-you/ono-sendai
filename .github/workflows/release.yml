name: release

# Builds and proves the installable packages (ADR-0121, ADR-0123) on native runners for both
# architectures and attaches them to the GitHub release of the tag. Both halves run the same two
# scripts a developer runs locally; nothing here is a different build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege (spec §43.3): the default for every job is read, and `contents: write` is
# granted below to `publish` alone — the one job that attaches anything to the release.
permissions:
  contents: read

# Tag uniqueness (spec §43.5): one publication per tag, and a second run for the same tag waits
# rather than racing the first to attach a conflicting artifact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ONO_ALLOW_MAIN: 1

jobs:
  package:
    name: package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deb,cargo-generate-rpm,cross
      - name: build the packages
        run: scripts/package.sh
      - name: install and run them in fresh containers
        run: scripts/package-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: list what is being published
        run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
