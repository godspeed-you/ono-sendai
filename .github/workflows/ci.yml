name: ci

on:
  push:
    branches: [main, implementation, "implementation/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, and the whole of the fork-pull-request story (spec §43.3, §43.4). Nothing in
# this workflow writes to the repository, and nothing reads a stored secret, so a run proposed
# from a fork holds a read-only token and sees no credential. `xtask spec-check` refuses a write
# scope declared here rather than on a single publishing job — there is no publishing job here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI verifies whatever branch it is handed; the branch policy of AGENTS.md section 12.1 is
  # enforced where it matters, on the machine an agent commits from.
  ONO_ALLOW_MAIN: 1
  # This is the canonical environment whose expected skip set `expected_test_skips.yaml`
  # declares, so the gate runs the skip-verification step of spec §38.3 here: a skip nobody
  # declared fails the run, and a declared skip that stopped happening fails it too.
  ONO_CANONICAL_CI: 1

jobs:
  # The steps of scripts/gate.sh, spread over runners of their own (ADR-0852). `cargo test` runs
  # its test binaries one after another, so the tests were seventeen of the single job's twenty
  # minutes. Two parts cut along the package boundary take about half of that each, the static
  # steps run beside them, and one last job verifies the skips of both parts together. Between
  # them the jobs run every step the bare script runs.
  #
  # A repository keeps 10 GB of caches, and a gate cache is about one of them. So only `main`
  # and `implementation` save one; a side branch or a pull request starts from theirs.
  gate-static:
    name: quality gate (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-static
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/implementation' }}
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # An exact version, because it decides what a verification means (spec §44.2,
          # ADR-0450). scripts/gate.sh runs the dependency policy (ADR-0449).
          tool: cargo-deny@0.20.2
      - name: run the gate's static steps
        run: scripts/gate.sh --static

  gate-tests:
    name: quality gate (tests of ${{ matrix.part.name }})
    runs-on: ubuntu-latest
    strategy:
      # Both parts report, so one push shows every test that broke.
      fail-fast: false
      matrix:
        part:
          - { key: ono-cli, name: ono-cli, selection: --package ono-cli }
          - { key: rest, name: every other package, selection: --workspace --exclude ono-cli }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-tests-${{ matrix.part.key }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/implementation' }}
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # Exact versions, because each of these decides what an artifact or a verification
          # means (spec §44.2, ADR-0450). xtask/tests/packaging.rs drives both packagers in the
          # gate (ADR-0121), and xtask/tests/supply_chain.rs runs the dependency policy over its
          # fixtures (ADR-0449).
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.21.0,cargo-deny@0.20.2
      - name: run the gate's tests
        env:
          SELECTION: ${{ matrix.part.selection }}
          ONO_TEST_LOG: target/gate-test-${{ matrix.part.key }}.log
        # SELECTION is split into words on purpose: it is a list of cargo arguments.
        run: scripts/gate.sh --tests $SELECTION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-tests-log-${{ matrix.part.key }}
          path: target/gate-test-${{ matrix.part.key }}.log
          retention-days: 1
      # The skip verification needs `xtask`, and this part has just built it for its own tests,
      # so the last job takes the binary rather than compiling it a third time.
      - if: matrix.part.key == 'rest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-tests-xtask
          path: target/debug/xtask
          retention-days: 1

  gate-skips:
    name: quality gate (skip verification)
    needs: gate-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-tests-*
          merge-multiple: true
          path: target/gate
      # spec §38.3 compares the whole expected-skip register with one run, so it reads the two
      # parts as the one run they are together.
      - name: verify the skips of both parts
        run: |
          chmod +x target/gate/xtask
          cat target/gate/gate-test-*.log > target/gate/gate-test.log
          target/gate/xtask skip-check target/gate/gate-test.log

  # The acceptance images are built once and handed to one job per group of
  # docker/acceptance/groups, so the suite takes the build plus its slowest group rather than the
  # build plus every case, and a red job names the area that broke (ADR-0851). Inside a job the
  # cases still run one after another: many of them measure time or load, and a neighbour on the
  # same runner would move what they measure.
  acceptance-image:
    name: acceptance image
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image keeps cargo's registry and target directory in BuildKit cache mounts, and a
      # fresh runner has none, so every run compiled every dependency again — eight of the
      # suite's twenty-two minutes. These two steps carry the mounts from one run to the next.
      # What they restore is only a starting point: the build stamps the workspace sources before
      # compiling, so a restored artifact never stands in for a changed source (ADR-0251).
      - name: restore the image's cargo caches
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            acceptance-cargo-registry
            acceptance-cargo-target
          key: acceptance-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: acceptance-cargo-
      - name: hand them to the image build
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "acceptance-cargo-registry": {"target": "/usr/local/cargo/registry", "sharing": "locked"},
              "acceptance-cargo-target": {"target": "/build/target", "sharing": "locked"}
            }
          utility-image: ghcr.io/containerd/busybox:1.36@sha256:7b3ccabffc97de872a30dfd234fd972a66d247c8cfc69b0550f276481852627c
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
      - name: build the images
        run: scripts/acceptance.sh --build-only
      - name: pack them
        run: |
          docker save $(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter 'reference=ono-sendai:acceptance*') \
            | zstd --threads=0 > acceptance-images.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-images
          path: acceptance-images.tar.zst
          # Compressed already, and read only by the group jobs of this run.
          compression-level: 0
          retention-days: 1
      - name: list the groups
        id: groups
        run: echo "groups=$(scripts/acceptance.sh --list-groups | jq --raw-input . | jq --compact-output --slurp .)" >> "$GITHUB_OUTPUT"

  acceptance:
    name: containerised acceptance (${{ matrix.group }})
    needs: acceptance-image
    runs-on: ubuntu-latest
    strategy:
      # Every group reports, so one push shows every area that broke.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.acceptance-image.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-images
      - name: load the images
        run: zstd --decompress --stdout acceptance-images.tar.zst | docker load
      - name: run the group's cases
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/acceptance.sh --no-build --group "$GROUP"

  packaging:
    # The packages must not rot between releases: every push builds and installs them for
    # x86_64 exactly the way the release workflow does (ADR-0121, ADR-0123).
    name: installable packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
        with:
          toolchain: "1.94"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # The versions of Cargo.toml's [workspace.metadata.release-tools] (spec §44.2).
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.21.0,cross@0.2.5
      - name: build the packages
        run: scripts/package.sh
      - name: install and run them in fresh containers
        run: scripts/package-check.sh
