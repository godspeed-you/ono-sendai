name: ci

on:
  push:
    branches: [main, implementation, "implementation/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI verifies whatever branch it is handed; the branch policy of AGENTS.md section 12.1 is
  # enforced where it matters, on the machine an agent commits from.
  ONO_ALLOW_MAIN: 1

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: run the gate
        run: scripts/gate.sh

  acceptance:
    name: containerised acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the acceptance suite
        run: scripts/acceptance.sh --keep-image
