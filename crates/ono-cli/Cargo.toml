[package]
name = "ono-cli"
description = "The ono shell binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ono"
path = "src/main.rs"

[features]
# The default build is the whole product, exactly as it was before the core build existed (#127).
default = ["full"]
# Every tier. `cargo build -p ono-cli` builds this, and every test and acceptance case of the
# default profile is written against it.
full = ["adapter", "change", "container", "graph", "kuang", "remote", "spatial", "systemd", "temporal"]
# The object shell alone, for container images and embedded Linux targets: the language, the
# evaluator, typed pipelines, the native commands and the Linux and network providers, and none
# of the tiers below. A compiled-out command refuses with `resolve.not_in_build`, a compiled-out
# provider with `provider.unavailable` (ADR-0910, ADR-0911). `core` enables nothing: it names the
# profile, so the exit test's `--no-default-features --features core` says what it builds.
#
# Cargo features only add, so `--features core` WITHOUT `--no-default-features` still builds the
# full shell, and so does `--all-features`, which the quality gate uses. That is deliberate: the
# gate lints and tests every tier, and a `compile_error!` on `core` plus a tier would break it.
# The core build is `--no-default-features --features core` and nothing else; `scripts/build-core.sh`
# is the one recipe, and it refuses a binary whose `--version` does not say `build: core`
# (ADR-0924).
core = []
# The tiers. They are named one by one so a reader can find what each `cfg` belongs to, but they
# are one decision: the build is `full` or `core`, and `lib.rs` refuses any mixture, because a
# combination nobody builds is a combination that does not compile (ADR-0910).
adapter = []
change = [
    "spatial", "temporal",
    "dep:ono-change-actions", "dep:ono-change-core", "dep:ono-change-executor",
    "dep:ono-change-impact", "dep:ono-change-plan", "dep:ono-change-protection",
    "dep:ono-change-recovery", "dep:ono-change-render", "dep:ono-recovery-btrfs",
    "dep:ono-recovery-files", "dep:ono-recovery-zfs", "dep:sha2",
]
container = ["dep:ono-provider-container"]
graph = []
kuang = [
    "dep:ono-kuang-protocol", "dep:ono-kuang-supervisor", "dep:ono-model-broker", "dep:ring",
    "dep:rustls-pki-types", "dep:rustls-webpki", "dep:x509-parser", "dep:base64", "dep:tar",
    "dep:ureq", "dep:sha2",
]
remote = ["dep:ono-protocol", "dep:ono-remote"]
spatial = [
    "dep:ono-spatial-core", "dep:ono-spatial-events", "dep:ono-spatial-index",
    "dep:ono-spatial-query", "dep:ono-spatial-render", "dep:sha2",
]
systemd = ["dep:ono-provider-systemd", "ono-provider-linux/systemd"]
temporal = [
    "spatial",
    "dep:ono-recorder", "dep:ono-temporal-ledger",
    "dep:ono-temporal-query", "dep:ono-temporal-reconstruct", "dep:ono-temporal-render",
]

[dependencies]
# v0.6 §32.2: the size of a filesystem mounted beneath a recursive removal, from statvfs(3).
nix = { workspace = true, features = ["fs"] }
bytes.workspace = true
async-trait.workspace = true
futures.workspace = true
jiff.workspace = true
ono-adapter.workspace = true
ono-command.workspace = true
ono-change-actions = { workspace = true, optional = true }
ono-change-core = { workspace = true, optional = true }
ono-change-executor = { workspace = true, optional = true }
ono-change-impact = { workspace = true, optional = true }
ono-change-plan = { workspace = true, optional = true }
ono-change-protection = { workspace = true, optional = true }
ono-change-recovery = { workspace = true, optional = true }
ono-change-render = { workspace = true, optional = true }
ono-core.workspace = true
ono-editor.workspace = true
ono-graph.workspace = true
ono-history.workspace = true
ono-kuang-protocol = { workspace = true, optional = true }
ono-kuang-supervisor = { workspace = true, optional = true }
ono-model-broker = { workspace = true, optional = true }
ono-parser.workspace = true
ono-process.workspace = true
ono-render.workspace = true
ono-pipeline.workspace = true
ono-provider-api.workspace = true
ono-protocol = { workspace = true, optional = true }
ono-remote = { workspace = true, optional = true }
ono-provider-linux.workspace = true
ono-provider-net.workspace = true
ono-provider-netlink.workspace = true
ono-provider-systemd = { workspace = true, optional = true }
ono-provider-container = { workspace = true, optional = true }
ono-recorder = { workspace = true, optional = true }
ono-recovery-btrfs = { workspace = true, optional = true }
ono-recovery-files = { workspace = true, optional = true }
ono-recovery-zfs = { workspace = true, optional = true }
ono-spatial-core = { workspace = true, optional = true }
ono-spatial-events = { workspace = true, optional = true }
ono-spatial-index = { workspace = true, optional = true }
ono-spatial-query = { workspace = true, optional = true }
ono-spatial-render = { workspace = true, optional = true }
# The temporal coordinate every invocation carries (v0.5 §4) is a type `ono-command` already
# links; a core build puts the present there (ADR-0910).
ono-temporal-core.workspace = true
ono-temporal-ledger = { workspace = true, optional = true }
ono-temporal-query = { workspace = true, optional = true }
ono-temporal-reconstruct = { workspace = true, optional = true }
ono-temporal-render = { workspace = true, optional = true }
ono-value.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
ring = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rustls-webpki = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
ono-testkit.workspace = true
ono-process.workspace = true
# The fixture service manager of `tests/spatial_orientation_bound.rs` (ADR-0880).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[lints]
workspace = true

# Installable packages (ADR-0121). `cargo deb` and `cargo generate-rpm` read these tables;
# `scripts/package.sh` drives them and `scripts/package-check.sh` installs the result in fresh
# containers. Paths are relative to this crate; `target/release/ono` is rewritten to the
# `--target` directory by both tools.
[package.metadata.deb]
name = "ono"
revision = ""
section = "shells"
priority = "optional"
depends = "$auto, debianutils"
extended-description = """\
Ono-Sendai is an object-pipeline shell for Linux: commands exchange typed values instead of
text, providers answer from the kernel and systemd instead of parsing tool output, and the
Unix tools you already know keep working unchanged. Installing this package registers
/usr/bin/ono in /etc/shells; `chsh -s /usr/bin/ono` makes it a login shell."""
maintainer-scripts = "packaging/deb"
assets = [
    ["target/release/ono", "usr/bin/", "755"],
    # What `install plugin` runs on a component, beside `ono` (ADR-0870). Built by the SDK in a
    # cargo invocation of its own, so the shell does not link the compiler it carries (ADR-0905).
    ["target/release/kuang-compile", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/ono/README.md", "644"],
    # What the licences of the crates in the binary ask to travel with it (ADR-0608), generated
    # from `Cargo.lock` and held to it by `spec-check`.
    ["../../THIRD-PARTY-LICENSES", "usr/share/doc/ono/THIRD-PARTY-LICENSES", "644"],
    ["../../docs/reference/*.md", "usr/share/doc/ono/reference/", "644"],
    ["../../docs/reference/adapters/*.md", "usr/share/doc/ono/reference/adapters/", "644"],
]

[package.metadata.generate-rpm]
name = "ono"
summary = "An object-pipeline shell for Linux"
license = "MIT"
url = "https://github.com/godspeed-you/ono-sendai"
assets = [
    { source = "target/release/ono", dest = "/usr/bin/ono", mode = "755" },
    { source = "target/release/kuang-compile", dest = "/usr/bin/kuang-compile", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/ono/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/ono/README.md", mode = "644", doc = true },
    { source = "../../THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/ono/THIRD-PARTY-LICENSES", mode = "644", doc = true },
    { source = "../../docs/reference/*.md", dest = "/usr/share/doc/ono/reference/", mode = "644", doc = true },
    { source = "../../docs/reference/adapters/*.md", dest = "/usr/share/doc/ono/reference/adapters/", mode = "644", doc = true },
]
# /etc/shells is edited in place: rpm has no add-shell, and the edit must be idempotent because
# %post also runs on upgrade ($1 = 2) and %postun on upgrade ($1 = 1) must leave the entry alone
# (ADR-0122).
post_install_script = """
if ! grep -qx /usr/bin/ono /etc/shells 2>/dev/null; then
    echo /usr/bin/ono >> /etc/shells
fi
"""
post_uninstall_script = """
if [ "$1" -eq 0 ] && [ -f /etc/shells ]; then
    sed -i '\\|^/usr/bin/ono$|d' /etc/shells
fi
"""
