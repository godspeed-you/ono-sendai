[package]
name = "ono-provider-net"
description = "Network providers that ask beyond the local kernel: name resolution through the C library's resolver, and reachability probes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ono-core.workspace = true
ono-pipeline.workspace = true
ono-provider-api.workspace = true
ono-value.workspace = true
async-trait.workspace = true
jiff.workspace = true
# The C library's resolver is the only way to ask NSS a reverse question: `std` wraps
# `getaddrinfo` but has no `getnameinfo`, and the error codes `std` folds into prose are what
# tells "no such name" apart from "no resolver reachable" (ADR-0087).
libc.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
