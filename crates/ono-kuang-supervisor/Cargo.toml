[package]
name = "ono-kuang-supervisor"
description = "The KUANG/11 supervisor: spawns plugin instances, negotiates the contract, brokers every capability, audits every decision (spec §31.11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ono-adapter.workspace = true
# The change and recovery vocabulary of v0.6 §8, §11.3, §19 and §25.1: a contributed recovery
# provider names a `ConsistencyClass` and a `RestoreMethod`, a contributed risk rule a
# `RiskDimension` and a `RiskClass`, and the host settles each against the one definition rather
# than a copy (§48.4 refuses at load, so the words must be resolvable at load).
ono-change-core.workspace = true
ono-core.workspace = true
ono-kuang-protocol.workspace = true
ono-model-broker.workspace = true
# The temporal vocabulary of v0.5 §6, §7 and §15: a contributed event names an `EventKind`, a
# contributed link a `CausalRelation` and an `EvidenceStrength`, and the host validates against
# the one definition of each rather than a copy (§37.1).
ono-temporal-core.workspace = true
ono-value.workspace = true
async-trait.workspace = true
globset.workspace = true
jiff.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
ono-temporal-core.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
