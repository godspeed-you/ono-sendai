[package]
name = "ono-testkit"
description = "Test fixtures and harness helpers shared by every crate in the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
jiff.workspace = true
# `signal`: a run that overruns is ended with its whole process tree (ADR-0892).
nix = { workspace = true, features = ["resource", "signal"] }
ono-core.workspace = true
# `process`: pidfds, so a process tree is signalled by identity rather than by pid (ADR-0893).
rustix = { workspace = true, features = ["process"] }
serde_yaml_ng.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["resource"] }

[lints]
workspace = true
